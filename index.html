<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4c2244">
<title>Co-Living Tycoon : Seoul</title>
<style>
:root {
  --sky: #7da6ee;
  --soil: #4c2244;
  --soil2: #3c1937;
  --mint: #8fdcb6;
  --mint2: #6cc79d;
  --ink: #12302f;
  --panel: #1f5f66;
  --panel2: #184c52;
  --card: #133f45;
  --line: #0c2a2e;
  --txt: #e8fff4;
  --dim: #9cc7bf;
  --lime: #c6f26b;
  --yellow: #ffd34d;
  --red: #ff6b6b;
  --pink: #ff8fab;
  --font: "Galmuri11", "DungGeunMo", "NeoDunggeunmo", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #1a0d18; color: var(--txt); font-family: var(--font); overflow: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

#app { position: relative; max-width: 460px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--soil); overflow: hidden; }

/* ---------- Scene + HUD ---------- */
#sceneWrap { position: relative; width: 100%; aspect-ratio: 180 / 176; flex: none; max-height: 52dvh; }
#scene { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: cover; object-position: bottom; }
#hud { position: absolute; inset: 0; pointer-events: none; padding: 8px 8px 0; }
#hud button { pointer-events: auto; }
.hud-top { display: flex; align-items: center; gap: 6px; }
.hud-icon { width: 38px; height: 38px; padding: 3px; border: 0; background: rgba(18, 26, 60, .35); border-radius: 6px; display: grid; place-items: center; flex: none; }
.hud-icon svg { width: 28px; height: auto; }
#cashBox { flex: 1; text-align: center; font-weight: 900; font-size: 27px; letter-spacing: 1px; color: #d8f56b;
  text-shadow: 2px 0 #1b3a14, -2px 0 #1b3a14, 0 2px #1b3a14, 0 -2px #1b3a14, 2px 2px #1b3a14, -2px 2px #1b3a14, 2px -2px #1b3a14, -2px -2px #1b3a14, 0 4px #1b3a14;
  white-space: nowrap; }
#cashBox .won { font-size: 22px; margin-right: 3px; }
#cashBox .cash-lbl { display: block; font-size: 10px; color: #fff; letter-spacing: 0; font-weight: 700; text-shadow: 1px 1px 0 #1b3a14, -1px 1px 0 #1b3a14, 1px -1px 0 #1b3a14, -1px -1px 0 #1b3a14; margin-top: -1px; }
#cashBox.neg { color: #ff8a8a; }
.hud-stats { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 4px 6px 2px; background: var(--soil); }
.stat { background: #2b1428; border-radius: 4px; padding: 2px 4px; text-align: center; line-height: 1.15; }
.stat b { display: block; font-size: 12px; color: #fff; white-space: nowrap; }
.stat small { font-size: 9px; color: #c8d6ff; }
.stat.good b { color: var(--lime); } .stat.bad b { color: #ff9c9c; }
.hud-row { position: absolute; left: 8px; right: 8px; bottom: 3.5%; display: flex; gap: 4px; align-items: center; }
.chip { font-size: 11px; background: rgba(14, 20, 48, .6); border: 0; border-radius: 10px; padding: 3px 9px; color: #fff; }
.chip.dim { color: #c8d6ff; }
#branchSel { background: #2b2235; border: 2px solid #ffd34d; }

#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; font-weight: 900; font-size: 15px; white-space: nowrap; transform: translateX(-50%);
  text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; animation: floatUp 1.8s ease-out forwards; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 8px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -46px); } }

/* ---------- Band ---------- */
#band { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--soil);
  background-image: linear-gradient(135deg, var(--soil2) 25%, transparent 25%), linear-gradient(225deg, var(--soil2) 25%, transparent 25%);
  background-size: 16px 8px; background-position: 0 0; }
#tvIcon { flex: none; width: 38px; height: 32px; }
#monthBar { flex: 1; position: relative; height: 26px; background: #dfe9f5; border: 3px solid #1e2034; border-radius: 4px; overflow: hidden; }
#monthFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--mint2); }
#monthLabel { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 900; color: #1e2034; }
.band-btn { flex: none; min-width: 38px; height: 32px; border: 3px solid #1e2034; background: var(--mint); color: var(--ink); font-weight: 900; font-size: 13px; border-radius: 4px; box-shadow: inset 0 -3px 0 var(--mint2); padding: 0 4px; display: grid; place-items: center; }
.band-btn svg { width: 16px; height: auto; }
.band-btn.paused { background: var(--yellow); box-shadow: inset 0 -3px 0 #d9a520; }

/* ---------- Tabs ---------- */
#tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 5px 6px; background: var(--soil); }
.tab { height: 44px; border: 3px solid #1e2034; border-radius: 4px; background: var(--mint); box-shadow: inset 0 -4px 0 var(--mint2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; }
.tab svg { width: 22px; height: auto; }
.tab span { font-size: 9px; color: var(--ink); font-weight: 900; }
.tab.on { background: var(--lime); box-shadow: inset 0 -4px 0 #9cc24a; transform: translateY(2px); }
.tab .dot { position: absolute; }

/* ---------- Panel ---------- */
#panel { flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border-top: 4px solid #0d2f33; padding: 8px 8px 24px; -webkit-overflow-scrolling: touch; }
.card { background: var(--card); border: 3px solid var(--line); border-radius: 6px; padding: 9px 10px; margin-bottom: 8px; }
.card h3 { margin: 0 0 7px; font-size: 13px; color: var(--yellow); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.card h3 small { color: var(--dim); font-weight: 400; font-size: 11px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; }
.row .k { color: var(--dim); }
.row .v { font-weight: 800; }
.pos { color: var(--lime); } .neg { color: #ff9c9c; }
.muted { color: var(--dim); font-size: 11px; line-height: 1.5; }
.bar { height: 10px; background: #0a2326; border: 2px solid var(--line); border-radius: 3px; overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lime); }
.stack { display: flex; height: 12px; border: 2px solid var(--line); border-radius: 3px; overflow: hidden; background: #0a2326; }
.stack i { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; font-size: 10px; color: var(--dim); }
.legend em { display: inline-block; width: 8px; height: 8px; margin-right: 3px; font-style: normal; }

.btn { border: 3px solid #1e2034; border-radius: 4px; background: var(--mint); color: var(--ink); font-weight: 900; font-size: 12px; padding: 7px 10px; box-shadow: inset 0 -3px 0 var(--mint2); }
.btn:active { transform: translateY(1px); }
.btn.y { background: var(--yellow); box-shadow: inset 0 -3px 0 #d9a520; }
.btn.r { background: #ff9c9c; box-shadow: inset 0 -3px 0 #d96b6b; }
.btn.ghost { background: #2c6e74; color: var(--txt); box-shadow: inset 0 -3px 0 #1f5257; }
.btn.big { width: 100%; font-size: 15px; padding: 11px; }
.btn:disabled { opacity: .45; filter: grayscale(.6); }
.btn.on { background: var(--lime); box-shadow: inset 0 -3px 0 #9cc24a; }

.toggle-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 2px dashed #1f5257; }
.toggle-item:first-of-type { border-top: 0; }
.toggle-item .info { flex: 1; min-width: 0; }
.toggle-item .info b { font-size: 13px; display: block; }
.toggle-item .info small { font-size: 10.5px; color: var(--dim); display: block; margin-top: 2px; }
.toggle-item .btn { min-width: 64px; }

.slider { padding: 6px 0; }
.slider .top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.slider .top b { color: var(--lime); }
input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 14px; background: #0a2326; border: 2px solid var(--line); border-radius: 3px; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 22px; background: var(--yellow); border: 3px solid #1e2034; border-radius: 3px; cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 16px; height: 18px; background: var(--yellow); border: 3px solid #1e2034; border-radius: 3px; }

.funnel { display: flex; align-items: stretch; gap: 2px; text-align: center; }
.funnel > div { flex: 1; background: #0e3236; border-radius: 4px; padding: 5px 0; }
.funnel b { display: block; font-size: 15px; }
.funnel small { font-size: 9.5px; color: var(--dim); }
.funnel .arr { flex: none; width: 8px; background: none; display: grid; place-items: center; color: var(--dim); font-size: 10px; padding: 0; }

.badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 8px; background: #2c6e74; color: var(--txt); margin-right: 3px; }
.badge.y { background: var(--yellow); color: var(--ink); }
.badge.l { background: var(--lime); color: var(--ink); }

.goal { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 4px 0; }
.goal .ck { width: 18px; height: 18px; border: 2px solid var(--line); background: #0a2326; border-radius: 3px; display: grid; place-items: center; font-size: 12px; color: var(--ink); flex: none; }
.goal.ok .ck { background: var(--lime); }
.goal .gv { margin-left: auto; font-weight: 800; }

.cta { background: linear-gradient(#ffe27a, #ffc93d); color: var(--ink); border: 3px solid #1e2034; border-radius: 6px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; font-weight: 900; box-shadow: inset 0 -4px 0 #d9a520; width: 100%; text-align: left; font-size: 13px; animation: pulse 1.6s infinite; }
.cta small { display: block; font-weight: 400; font-size: 11px; }
@keyframes pulse { 50% { transform: scale(1.015); } }

.hidden-stat { display: grid; grid-template-columns: 82px 1fr 44px; gap: 6px; align-items: center; font-size: 11.5px; padding: 3px 0; }
.pips { display: flex; gap: 2px; }
.pips i { width: 11px; height: 9px; background: #0a2326; border: 1px solid var(--line); }
.pips i.on { background: var(--yellow); }
.pips i.on.bad { background: #ff7b7b; } .pips i.on.good { background: var(--lime); }

/* ---------- Full screens ---------- */
#screen { position: absolute; inset: 0; z-index: 20; background: var(--panel); overflow-y: auto; display: flex; flex-direction: column; }
.scr-head { background: var(--soil); padding: 14px 12px 12px; border-bottom: 4px solid #0d2f33; position: sticky; top: 0; z-index: 2; }
.scr-head .stg { color: var(--yellow); font-size: 12px; font-weight: 900; letter-spacing: 1px; }
.scr-head h2 { margin: 3px 0 4px; font-size: 20px; }
.scr-head p { margin: 0; font-size: 12px; color: #e9d4ea; }
.scr-head .money { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.scr-body { padding: 10px; flex: 1; }
.scr-foot { position: sticky; bottom: 0; padding: 10px; background: var(--panel2); border-top: 3px solid var(--line); display: flex; gap: 8px; }
.steps { display: flex; gap: 4px; margin-top: 8px; }
.steps i { flex: 1; height: 5px; background: #2b1a2b; border-radius: 2px; }
.steps i.on { background: var(--lime); }

.land { background: var(--card); border: 3px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 9px; position: relative; cursor: pointer; }
.land.sel { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow); }
.land.used { opacity: .4; pointer-events: none; }
.land .ttl { display: flex; align-items: center; gap: 8px; }
.land .ttl .lt { width: 26px; height: 26px; background: var(--yellow); color: var(--ink); font-weight: 900; display: grid; place-items: center; border-radius: 4px; border: 2px solid #1e2034; flex: none; }
.land .ttl b { font-size: 15px; flex: 1; }
.land .ttl .price { font-weight: 900; color: var(--lime); font-size: 14px; }
.land .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin: 8px 0 6px; font-size: 12px; }
.land .pc { font-size: 11px; line-height: 1.6; }
.land .pc .p { color: var(--lime); } .land .pc .c { color: #ffa7a7; }
.land .hid { margin-top: 7px; border-top: 2px dashed #1f5257; padding-top: 6px; }
.land .hid .hs { display: flex; flex-wrap: wrap; gap: 4px; }
.land .hid .hs span { font-size: 10px; background: #0a2326; padding: 2px 6px; border-radius: 3px; color: var(--dim); }
.land .hid .hs span b { color: var(--txt); }
.land .survey { margin-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: var(--dim); }

.opt { background: var(--card); border: 3px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.opt.sel { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow); }
.opt.locked { opacity: .45; cursor: not-allowed; }
.opt .sw { width: 42px; height: 42px; border-radius: 4px; border: 3px solid #1e2034; flex: none; display: grid; place-items: center; font-size: 20px; }
.opt .tx { flex: 1; }
.opt .tx b { font-size: 14px; display: block; }
.opt .tx small { font-size: 11px; color: var(--dim); display: block; line-height: 1.5; margin-top: 2px; }
.opt .tx .eff { color: var(--lime); font-weight: 800; }

/* ---------- Title ---------- */
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(transparent 0, transparent 45%, var(--soil) 45%); }
.title-logo { text-align: center; padding-top: 14px; }
.title-logo .l1 { font-size: 34px; font-weight: 900; color: #d8f56b; letter-spacing: 1px; line-height: 1;
  text-shadow: 3px 0 #1b3a14, -3px 0 #1b3a14, 0 3px #1b3a14, 0 -3px #1b3a14, 3px 3px #1b3a14, -3px 3px #1b3a14, 3px -3px #1b3a14, -3px -3px #1b3a14, 0 6px #1b3a14; }
.title-logo .l2 { font-size: 22px; font-weight: 900; color: #fff; margin-top: 10px; letter-spacing: 4px;
  text-shadow: 2px 0 #2b2235, -2px 0 #2b2235, 0 2px #2b2235, 0 -2px #2b2235, 0 4px #2b2235; }
.title-form { margin-top: auto; padding: 16px 16px 26px; }
.title-form label { display: block; font-size: 12px; color: #e9d4ea; margin: 10px 0 4px; }
.title-form input { width: 100%; font-family: inherit; font-size: 16px; padding: 10px; border: 3px solid #1e2034; border-radius: 4px; background: #fff7e6; color: #2b2235; font-weight: 800; }
.title-form .btn { margin-top: 12px; }
.ver { text-align: center; font-size: 10px; color: #a888a8; margin-top: 10px; }

/* ---------- Modal ---------- */
#modal { position: absolute; inset: 0; z-index: 40; background: rgba(10, 6, 20, .66); display: flex; align-items: center; justify-content: center; padding: 16px; }
.mbox { width: 100%; max-width: 400px; max-height: 92%; overflow-y: auto; background: var(--panel); border: 4px solid #1e2034; border-radius: 8px; box-shadow: 0 6px 0 #0a1a1c; animation: pop .22s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.mhead { background: var(--soil); padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 3px solid #1e2034; }
.mhead .ic { font-size: 26px; }
.mhead h3 { margin: 0; font-size: 16px; }
.mhead small { display: block; font-size: 11px; color: #e9d4ea; font-weight: 400; margin-top: 2px; }
.mbody { padding: 12px; font-size: 13px; line-height: 1.6; }
.mfoot { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 7px; }
.choice { text-align: left; display: block; width: 100%; }
.choice small { display: block; font-weight: 400; font-size: 11px; margin-top: 2px; }
.coo { display: flex; gap: 10px; align-items: flex-start; }
.coo .face { flex: none; width: 54px; height: 54px; background: #fff3d6; border: 3px solid #1e2034; border-radius: 4px; display: grid; place-items: center; }
.coo .face svg { width: 44px; height: auto; }
.coo .say { flex: 1; background: #fff7e6; color: #2b2235; padding: 9px 10px; border-radius: 6px; border: 3px solid #1e2034; font-size: 13px; line-height: 1.6; font-weight: 700; }
.coo .say b { color: #b8336a; }

#toast { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); z-index: 50; pointer-events: none; display: flex; flex-direction: column; gap: 6px; align-items: center; width: 92%; }
.tst { background: rgba(20, 12, 30, .92); border: 3px solid var(--yellow); color: #fff; border-radius: 6px; padding: 8px 12px; font-size: 12.5px; font-weight: 800; text-align: center; animation: tst 3.2s ease forwards; line-height: 1.5; }
@keyframes tst { 0% { opacity: 0; transform: translateY(10px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

.rank-row { display: flex; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 2px dashed #1f5257; font-size: 13px; }
.rank-row.me { background: #2c6e74; border-radius: 4px; }
.rank-row .no { width: 24px; font-weight: 900; color: var(--yellow); }
.rank-row .nm { flex: 1; }
.br-item { display: flex; align-items: center; gap: 8px; padding: 7px; border: 2px solid var(--line); background: #0e3236; border-radius: 4px; margin-bottom: 5px; font-size: 12px; cursor: pointer; }
.br-item.cur { border-color: var(--yellow); }
.br-item .nm { flex: 1; font-weight: 800; }
.hud-stats { grid-template-columns: repeat(5, 1fr); }
.stat b { font-size: 11.5px; }
.evcv { display: block; width: 100%; aspect-ratio: 160 / 90; image-rendering: pixelated; background: #000; border-bottom: 3px solid #1e2034; }
.dz { display: inline-block; font-size: 10px; background: #ff5d5d; color: #fff; padding: 1px 5px; border-radius: 3px; vertical-align: 2px; }
.fam-desc { font-style: italic; color: #fff3b0; margin-bottom: 6px; }
/* 대시보드 크게 */
.hud-stats { gap: 4px; padding: 6px 6px 4px; }
.stat { padding: 5px 2px 4px; border-radius: 5px; }
.stat b { font-size: 15px; letter-spacing: -0.3px; }
.stat small { font-size: 10px; display: block; margin-top: 1px; }
/* 월 결산 */
.rep-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin: 4px 0 8px; }
.rep-tbl td { padding: 4px 2px; border-bottom: 1px dashed #1f5257; }
.rep-tbl td:last-child { text-align: right; font-weight: 800; }
.rep-big { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.rep-big div { background: var(--card); border: 2px solid var(--line); border-radius: 5px; padding: 6px 8px; }
.rep-big b { display: block; font-size: 18px; }
.rep-big small { font-size: 10.5px; color: var(--dim); }
.rep-sec { font-size: 12px; color: var(--yellow); font-weight: 900; margin: 8px 0 3px; }
.rep-br { background: var(--card); border: 2px solid var(--line); border-radius: 5px; padding: 6px 8px; margin-bottom: 5px; font-size: 12px; }
.rep-br .t { display: flex; justify-content: space-between; font-weight: 900; margin-bottom: 3px; }
.rep-br .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; text-align: center; }
.rep-br .g b { display: block; font-size: 14px; }
.rep-br .g small { font-size: 9.5px; color: var(--dim); }
.advice { list-style: none; margin: 6px 0 0; padding: 0; }
.advice li { margin: 0 0 5px; padding-left: 14px; position: relative; font-size: 12.5px; }
.advice li::before { content: '▸'; position: absolute; left: 0; color: #b8336a; }
.mbox.wide { max-width: 440px; }
#fatChip { border: 0; margin-left: auto; }
#fatChip.warm { background: #b8336a; }
#fatChip.hot { background: #ff3b3b; animation: pulse 1s infinite; }
/* 엔딩 */
.end-wrap { position: absolute; inset: 0; background: #07050f; display: flex; flex-direction: column; align-items: center; overflow: hidden; z-index: 60; }
.end-cv { width: 100%; aspect-ratio: 160 / 90; image-rendering: pixelated; margin-top: 12%; }
.end-cap { color: #fff3b0; font-size: 18px; font-weight: 900; text-align: center; padding: 18px 16px 4px; min-height: 64px; text-shadow: 0 2px 0 #b8336a; animation: capIn .8s ease; }
.end-sub { color: #c8d6ff; font-size: 13px; text-align: center; padding: 0 20px; line-height: 1.6; animation: capIn 1.2s ease; }
@keyframes capIn { from { opacity: 0; transform: translateY(10px); } }
.end-skip { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 12px; padding: 5px 12px; font-size: 12px; z-index: 2; }
.end-credits { position: absolute; left: 0; right: 0; top: 100%; text-align: center; color: #fff; animation: roll 26s linear forwards; padding: 0 20px; }
.end-credits h1 { font-size: 30px; color: #d8f56b; margin: 0 0 6px; text-shadow: 0 3px 0 #1b3a14; }
.end-credits h2 { font-size: 14px; color: #ffd34d; margin: 26px 0 6px; letter-spacing: 2px; }

<script>
// ===== 시뮬레이션 엔진 =====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function randRound(x) { const f = Math.floor(x); return f + (Math.random() < x - f ? 1 : 0); }
function weighted(items, wfn) {
  let tot = 0; const ws = items.map(it => { const w = Math.max(0, wfn(it)); tot += w; return w; });
  if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

function fmtMoney(v, plus) {
  const sign = v < 0 ? '-' : (plus && v > 0 ? '+' : '');
  const a = Math.abs(Math.round(v));
  if (a >= 10000) {
    let s = (a / 10000).toFixed(a >= 1000000 ? 1 : 2).replace(/\.?0+$/, '');
    return sign + s + '억';
  }
  return sign + a.toLocaleString('ko-KR') + '만';
}
function dateOf(m) { const t = m + 2; return { y: 2027 + Math.floor(t / 12), mo: (t % 12) + 1 }; }
function dateStr(m) { const d = dateOf(m); return d.y + '.' + String(d.mo).padStart(2, '0'); }
function spanStr(n) { n = Math.max(0, n); const y = Math.floor(n / 12), m = n % 12; return y ? (m ? `${y}년 ${m}개월` : `${y}년`) : `${m}개월`; }
// 게임 시작부터 몇 년 몇 개월차인지 (0 → 1개월차)
function elapsedStr(m) { const y = Math.floor(m / 12), mo = m % 12 + 1; return y ? `${y}년 ${mo}개월차` : `${mo}개월차`; }

const Sim = {
  S: null,

  rollFamily() {
    return weighted(FAMILIES, f => f.rate);
  },
  fam(S = this.S) { return FAMILIES.find(f => f.id === (S && S.family)) || FAMILIES[0]; },
  rate(S = this.S) { return (this.fam(S).rate1 ? 0.03 / 12 : INTEREST) + (S.rateAdd || 0) / 12; },
  rateYear(S = this.S) { return Math.round(((this.fam(S).rate1 ? 3 : 4) + (S.rateAdd || 0) * 100) * 10) / 10; },

  newGame(ceo, brand, famId) {
    const fam = FAMILIES.find(f => f.id === famId) || FAMILIES[0];
    const lm = fam.loanMul || 1;
    this.S = {
      v: 2, ceo, brand, family: fam.id, loanMul: lm, month: 0, cash: fam.money, loan: 0, loanCap: Math.round(STAGES[0].loan * lm),
      stage: 1, stageStatus: 'select', streak: 0, brandXP: fam.brand || 0,
      branches: [], sel: 0, rankBest: { brand: 6, ceo: 6 }, competitors: (() => { const nk = CEO_NICKS.slice().sort(() => Math.random() - 0.5); return COMPETITORS.map((c, i) => ({ ...c, ceo: nk[i] })); })(),
      surveys: {}, negMonths: 0, over: false, won: false, tut: 0,
      lastNet: 0, lastRev: 0, history: [], pendingEvent: null, eventAt: 1, log: [],
    };
    return this.S;
  },

  lvl(S = this.S) { let l = 1; for (let i = 0; i < BRAND_XP.length; i++) if (S.brandXP >= BRAND_XP[i]) l = i + 1; return Math.min(10, l); },
  lvlProgress(S = this.S) {
    const l = this.lvl(S); if (l >= 10) return 1;
    return (S.brandXP - BRAND_XP[l - 1]) / (BRAND_XP[l] - BRAND_XP[l - 1]);
  },
  stageDef(n) { return STAGES[n - 1]; },
  land(b) { return STAGES[b.stage - 1].lands.find(l => l.id === b.landId); },
  rooms(b) { return SIZES[b.size].rooms; },
  occ(b) { return SEGS.reduce((s, k) => s + b.occ[k], 0); },
  scale(b) { return this.rooms(b) / 30; },
  branch() { return this.S.branches[this.S.sel]; },
  stageBranch(S = this.S) { return S.branches.filter(b => b.stage === S.stage).slice(-1)[0]; },

  buildCost(stage, landId, size, grade) {
    const st = STAGES[stage - 1]; const land = st.lands.find(l => l.id === landId);
    const f = [1, 1.1, 1.3, 1.15, 1.2, 1.4, 1.3, 1.2][stage - 1];
    const build = Math.round(SIZES[size].cost * f * GRADES[grade || 'std'].cost / 1000) * 1000;
    return { land: land.price, build, pf: Math.round(build * PF_RATIO / 10000) * 10000 };
  },
  baseRent(b) { return b.baseRent || this.land(b).rent; },
  rentNow(b) { return Math.round(this.baseRent(b) * b.rentF); },
  grade(b) { return GRADES[b.grade || 'std']; },

  targetFor(stage, invest) { return Math.max(2000, Math.round(invest * STAGE_YIELD[stage - 1] / 12 / 100) * 100); },
  bTarget(b) { return Math.round((b.target || this.targetFor(b.stage, b.invest || 0)) * (this.S.targetMul || 1) / 100) * 100; },
  startBranch(stage, landId, concept, size, borrow, grade) {
    const S = this.S; const st = STAGES[stage - 1]; const land = st.lands.find(l => l.id === landId);
    grade = grade || 'std';
    const c = this.buildCost(stage, landId, size, grade);
    S.loanCap += c.pf;
    S.loan += borrow; S.cash += borrow;
    S.cash -= c.land + c.build;
    const occ = {}; SEGS.forEach(k => occ[k] = 0);
    const b = {
      id: 'b' + Date.now() + Math.floor(Math.random() * 999), stage, landId, area: st.area,
      name: S.brand + ' ' + (st.multi ? land.name.replace(/\s.*$/, '') : st.area.replace(' 프리미엄', '')) + '점',
      concept, size, grade, baseRent: Math.round(land.rent * GRADES[grade].rent), status: 'build', buildLeft: SIZES[size].months, buildTotal: SIZES[size].months,
      occ, waitlist: 0, sat: 70, cond: 100, rentF: 1, monthsOpen: 0, openedAt: null,
      budget: { clean: 50, fac: 50, mkt: 50, comm: 50 },
      staff: { cm: false, sm: false, mm: false, fm: false },
      channels: {}, events: {}, upgrades: {}, mods: [], pendingCost: 0,
      revealed: [false, false, false, false, false], last: null, invest: c.land + c.build, buildCost: c.build, startM: S.month, payLv: {}, target: this.targetFor(stage, c.land + c.build),
    };
    if (stage === 6) b.name = S.brand + ' 성수 프리미엄점';
    const sv = (S.surveys[stage] || {})[landId] || [];
    sv.forEach(i => b.revealed[i] = true);
    S.branches.push(b); S.sel = S.branches.length - 1;
    S.stageStatus = 'build';
    S.streak = 0;
    return b;
  },

  survey(stage, landId) {
    const S = this.S; S.surveys[stage] = S.surveys[stage] || {};
    const got = S.surveys[stage][landId] = S.surveys[stage][landId] || [];
    const left = [0, 1, 2, 3, 4].filter(i => !got.includes(i));
    if (!left.length) return false;
    S.cash -= SURVEY_COST;
    for (let k = 0; k < 2 && left.length; k++) got.push(left.splice(Math.floor(Math.random() * left.length), 1)[0]);
    return true;
  },

  addMod(b, k, seg, v, n) { b.mods.push({ k, seg, v, n }); },
  modMul(b, k, seg) { let m = 1; b.mods.forEach(x => { if (x.k === k && (x.seg === 'all' || x.seg === seg || !x.seg)) m *= x.v; }); return m; },
  modAdd(b, k) { let a = 0; b.mods.forEach(x => { if (x.k === k) a += x.v; }); return a; },

  segShare(b) {
    const o = this.occ(b); const land = this.land(b); const sh = {};
    if (o === 0) { const t = land.seg.reduce((a, c) => a + c, 0); SEGS.forEach((k, i) => sh[k] = land.seg[i] / t); }
    else SEGS.forEach(k => sh[k] = b.occ[k] / o);
    return sh;
  },

  prefMatch(b, seg) {
    const land = this.land(b); const u = b.upgrades;
    switch (seg) {
      case 'stu': return (b.rentF <= 1 ? 1 : 0) + (land.school ? 1 : 0);
      case 'intl': return (u.english ? 1 : 0) + (u.furnish ? 1 : 0);
      case 'junior': return (land.transit ? 1 : 0) + (u.internet ? 1 : 0);
      case 'creator': return (u.lounge ? 1 : 0) + (b.budget.comm >= 60 ? 1 : 0);
      case 'expat': return (u.concierge ? 1 : 0) + (this.lvl() >= 4 ? 1 : 0);
    }
    return 0;
  },

  // ---- 만족도 목표값과 구성 요소 ----
  satParts(b) {
    const sh = this.segShare(b); const p = [];
    p.push(['기본', 35]);
    p.push(['청소', b.budget.clean * 0.2]);
    p.push(['시설 상태', b.cond * 0.15]);
    p.push(['커뮤니티 예산', b.budget.comm * 0.15]);
    const cmN = this.stN(b, 'cm'); if (cmN) p.push(['커뮤니티 매니저' + (cmN > 1 ? ' ×' + cmN : ''), this.dim(cmN, 8) * this.ab(b, 'cm')]);
    let ev = 0;
    COMM_EVENTS.forEach(e => {
      const n = this.evN(b, e.id); if (!n) return; const k = this.dim(n, 1);
      ev += e.sat * k;
      if (e.segBonus) for (const s in e.segBonus) ev += e.segBonus[s] * sh[s] * k;
    });
    if (ev) p.push(['커뮤니티 이벤트 (월 ' + this.sessions(b) + '회)', Math.min(12, ev)]);
    let pref = 0; SEGS.forEach(k => pref += (this.prefMatch(b, k) - 1) * 5 * sh[k]);
    p.push(['입주민 선호 충족', pref]);
    const cs = CONCEPTS[b.concept].segs; let fit = 0; cs.forEach(k => fit += sh[k]);
    p.push(['컨셉 적합', Math.min(1, fit) * 6]);
    p.push(['규모', { S: 4, M: 0, L: -6 }[b.size]]);
    const gd = this.grade(b); if (gd.sat) p.push(['건물 등급 · ' + gd.name, gd.sat]);
    const fam = this.fam(); if (fam.sat) p.push(['가문 특성 · ' + fam.skill, fam.sat]);
    if (b.rentF > 1) p.push(['월세 인상', -Math.min(45, (b.rentF - 1) * 40)]);
    else if (b.rentF < 1) p.push(['월세 할인', (1 - b.rentF) * 15]);
    if (b.revealed[4]) p.push(['브랜드 적합도', (this.land(b).hidden[4] - 50) / 10]);
    else p.push(['???', (this.land(b).hidden[4] - 50) / 10]);
    if (b.member) {
      const pen = Math.max(0, b.member - 8) * 0.35; p.push(['커뮤니티 멤버십', 2 - pen]);
      // 멤버십 혜택: 커뮤니티 이벤트 회차가 많을수록 가입비 불만을 상쇄
      const off = Math.min(pen, this.sessions(b) * 0.8); if (off) p.push(['멤버십 혜택 (이벤트 회차)', off]);
    }
    BIZ.forEach(z => { if (b.biz && b.biz[z.id]) p.push([z.short, z.sat]); });
    const m = this.modAdd(b, 'sat'); if (m) p.push(['일시 효과', m]);
    return p;
  },
  satTarget(b) { return clamp(this.satParts(b).reduce((a, x) => a + x[1], 0), 0, 100); },

  // ---- 문의 수 ----
  inquiries(b, preview) {
    const land = this.land(b); const S = this.S; const out = {};
    const rooms = this.rooms(b); const lvl = this.lvl();
    const tot = land.seg.reduce((a, c) => a + c, 0);
    const gd = this.grade(b); const fam = this.fam();
    SEGS.forEach((k, i) => {
      let v = land.demand * Math.pow(rooms / 60, 0.95) * 0.5 * (land.seg[i] / tot);
      v *= gd.demand * (gd.seg[k] || 1) * STAGE_DEMAND[b.stage - 1];
      v *= (1 + b.budget.mkt / 100) * (fam.mkt || 1);
      const rentMul = this.rentMul(b, k);
      if (CONCEPTS[b.concept].segs.includes(k)) v *= 1.3;
      if (b.concept === 'creator' && k !== 'creator') v *= 1.05;
      CHANNELS.forEach(c => { if (b.channels[c.id] && (c.segs === 'all' || c.segs.includes(k))) v *= c.m; });
      UPGRADES.forEach(u => { if (b.upgrades[u.id] && u.seg === k) v *= 1.1; });
      v *= 1 + 0.06 * (lvl - 1);
      v *= rentMul;
      const mmN = this.stN(b, 'mm'); if (mmN) v *= 1 + this.dim(mmN, 0.3) * this.ab(b, 'mm');
      v *= this.boostInq(b);
      v *= this.modMul(b, 'inq', k);
      v *= 1 - land.hidden[0] / 250;
      if (b.sat >= 90) v *= 1.25 * (CONCEPTS[b.concept].viral || 1);
      // 학기 시즌: 2·8월 학생 문의 증가
      const mo = dateOf(S.month).mo;
      if ((k === 'stu' || k === 'intl') && (mo === 2 || mo === 8)) v *= 1.4;
      out[k] = preview ? v : v * rnd(0.85, 1.15);
    });
    return out;
  },

  rentMul(b, k) {
    if (b.rentF <= 1) return Math.min(1.5, 1 + (1 - b.rentF) * 2.2);
    return Math.max(0.02, Math.pow(b.rentF, -RENT_ELAST[k]));
  },
  rentMulAvg(b) { const sh = this.segShare(b); return SEGS.reduce((a, k) => a + sh[k] * this.rentMul(b, k), 0); },

  // 절대 임대료가 높을수록 투어 후 지원을 망설임 (80만 ≈ 1.0, 150만 ≈ 0.83, 300만 ≈ 0.6)
  priceResist(b) { return clamp((1.12 - (this.rentNow(b) * this.modMul(b, 'rent') - 30) / 450) * (1 + 0.05 * ((b.boost || 1) - 1)), 0.55, 1.15); },
  // 프리미엄 마케팅 (x1~x5): 문의 증가 · 고가 월세 설득력 ↑ · 마케팅비 배수 증가
  boostInq(b) { return 1 + 0.35 * ((b.boost || 1) - 1); },

  rates(b) {
    const lvl = this.lvl();
    return {
      tour: clamp(0.5 + 0.02 * (lvl - 1), 0.05, 0.9),
      apply: clamp((0.5 + this.dim(this.stN(b, 'sm'), 0.1) * this.ab(b, 'sm')) * this.priceResist(b), 0.05, 0.9),
      contract: clamp((0.46 + this.dim(this.stN(b, 'sm'), 0.1) * this.ab(b, 'sm') + (this.ace(b, 'sm') ? 0.05 : 0) + 0.015 * (lvl - 1) + this.modAdd(b, 'contract')) * Math.sqrt(this.rentMulAvg(b) > 1 ? 1 : this.rentMulAvg(b)), 0.05, 0.9),
      movein: 0.8,
    };
  },

  churn(b) {
    const land = this.land(b); const h = land.hidden;
    // 월 퇴거율: 만족도 90 이상 10% → 만족도 30 이하 40%
    let c = 0.10 + clamp((90 - b.sat) / 60, 0, 1) * 0.30;
    c += (60 - h[3]) / 100 * 0.05 + h[0] / 100 * 0.02 + STAGE_CHURN[b.stage - 1];
    c -= b.budget.comm / 100 * 0.01;
    COMM_EVENTS.forEach(e => { c -= e.churn * 1.5 * this.dim(this.evN(b, e.id), 1); });
    c += this.modAdd(b, 'churn');
    return clamp(c, 0.08, 0.45);
  },

  costs(b) {
    const sc = this.scale(b); const land = this.land(b);
    const c = {};
    c.budget = Math.round((b.budget.clean + b.budget.fac + b.budget.mkt + b.budget.comm) * sc);
    c.staff = STAFF.reduce((a, s) => a + this.staffPay(b, s) * this.stN(b, s.id), 0);
    c.maint = Math.round(this.rooms(b) * (2 + land.hidden[2] / 100 * 6));
    c.channels = CHANNELS.reduce((a, ch) => a + (b.channels[ch.id] ? this.chCost(b, ch) : 0), 0);
    c.events = Math.round(COMM_EVENTS.reduce((a, e) => a + e.cost * this.evN(b, e.id), 0) * sc);
    c.service = Math.round(UPGRADES.reduce((a, u) => a + (b.upgrades[u.id] ? u.monthly : 0), 0) * this.rooms(b) / 60);
    // 전기·수도: 순이익 1억 돌파 이후부터 (공용부 + 입주 객실)
    c.boost = Math.round((c.channels + b.budget.mkt * sc) * ((b.boost || 1) - 1));
    c.util = this.S && this.S.bigProfit ? Math.round(this.rooms(b) * UTIL_ROOM + this.occ(b) * UTIL_OCC) : 0;
    return c;
  },
  // 법인세 (누진) + 지방소득세
  corpTax(base) {
    let tax = 0, prev = 0;
    for (const [cap, r] of TAX_BRACKETS) { if (base <= prev) break; tax += (Math.min(base, cap) - prev) * r; prev = cap; }
    return Math.round(tax * (1 + LOCAL_TAX));
  },
  // ---- 월세 외 부가 수익 ----
  memberRate(b) {
    const f = b.member || 0; if (!f) return 0;
    const ev = this.sessions(b) * 0.8;
    return clamp(0.95 - f * 0.028 + b.budget.comm / 100 * 0.15 + ev * 0.03 + (this.ace(b, 'cm') ? 0.1 : 0), 0.05, 0.98);
  },
  extraRev(b, occ) {
    const lvl = this.lvl(); const o = { member: 0, data: 0, ads: 0 };
    if (b.member) o.member = Math.round(occ * b.member * this.memberRate(b));
    if (b.biz && b.biz.data) o.data = Math.round(occ * BIZ[0].perOcc * BIZ[0].revMul[b.size] * (1 + 0.05 * (lvl - 1)) * this.dataMul());
    if (b.biz && b.biz.ads) o.ads = Math.round(occ * BIZ[1].perOcc * BIZ[1].revMul[b.size] * (1 + 0.1 * (lvl - 1)) * this.adMul());
    o.total = o.member + o.data + o.ads; return o;
  },
  bizCost(b, z) { return z.costBy[b.size]; },
  // 공간 데이터: Stage 5 AI 로봇 대중화 ×2, Stage 7 글로벌 AI 제휴 ×1.5 (미리 연구해 둔 경우만)
  dataMul(S = this.S) { return (S.aiBoom ? 2 : 1) * (S.aiDeal ? 1.5 : 1); },
  // 광고: 브랜드 광고 계약(2년) 1건당 ×1.2
  adMul(S = this.S) { return (S.adDeals || []).filter(d => d.until > S.month).reduce(a => a * 1.2, 1); },
  upgradeCost(b, u) { return Math.round(u.cost * this.rooms(b) / 60 * (b.size === 'L' ? 1.15 : 1) / 10) * 10; },
  // 건물 규모 배수 (Small 기준) · 연차별 임금 인상
  sizeMul(b) { return { S: 1.3, M: 2, L: 3 }[b.size]; },
  wageMul(S = this.S) { return Math.pow(1 + WAGE_RAISE, Math.floor(S.month / 12)) * (S.wageBonus || 1); },
  // 직원 월급: 직무 기본급 × 연봉 등급 × 지점 근속연수만큼 인상(연 3%) × 노조 합의
  staffYears(b) { return Math.max(0, Math.floor((this.S.month - (b.startM != null ? b.startM : (b.openedAt || 0))) / 12)); },
  payLv(b, id) { return (b.payLv && b.payLv[id]) || 0; },
  staffPay(b, s) { return Math.round(s.pay * PAY_GRADES[this.payLv(b, s.id)].pay * Math.pow(1 + WAGE_RAISE, this.staffYears(b)) * (this.S.wageBonus || 1) / 10) * 10; },
  // 능력 배수: 연봉 등급 + 근속 경력(1년마다 +5%, 최대 +30%)
  ab(b, id) { return PAY_GRADES[this.payLv(b, id)].ab * (1 + 0.05 * Math.min(6, this.staffYears(b))); },
  ace(b, id) { return this.stN(b, id) > 0 && this.payLv(b, id) >= 3; },
  // 민원 자동 처리: 오픈 1년 지난 지점 + 담당 직원 연봉 '우수' 이상
  autoOK(b, id) { return this.stN(b, id) > 0 && b.status === 'open' && (b.monthsOpen || 0) >= AUTO_OPEN_MONTHS && this.payLv(b, id) >= AUTO_MIN_GRADE; },
  chCost(b, ch) { return Math.round(ch.cost * this.sizeMul(b) / 5) * 5; },

  breakdownW(b) { return (0.6 + (100 - b.cond) / 30) / (1 + this.stN(b, 'fm') * this.ab(b, 'fm')); },
  // 직원 수(0~3) · 이벤트 회차(0~4) · 체감 효과(첫째 100%, 둘째 50%, 셋째 25%)
  stN(b, id) { const v = b.staff[id]; return v === true ? 1 : (v || 0); },
  evN(b, id) { const v = b.events[id]; return v === true ? 1 : (v || 0); },
  sessions(b) { return COMM_EVENTS.reduce((a, e) => a + this.evN(b, e.id), 0); },
  dim(n, a) { let s = 0; for (let i = 0; i < n; i++) s += a * Math.pow(0.5, i); return s; },

  // ---- 한 달 진행 ----
  monthTick() {
    const S = this.S; const lvl = this.lvl(); const rep = { branches: [], xp: 0, opened: [], revealed: [] };
    let rev = 0, cost = 0, prepaid = 0;
    S.branches.forEach(b => {
      const r = this.tickBranch(b, rep);
      rev += r.revenue; cost += r.cost; prepaid += r.prepaid || 0;
    });
    let interest = Math.round(S.loan * this.rate());
    // 미납 이자: 연체 가산 월 1.5%
    if (S.unpaid) S.unpaid = Math.round(S.unpaid * 1.015);
    if (S.deferNext && interest > 0) {
      S.unpaid = (S.unpaid || 0) + interest; S.deferCount = (S.deferCount || 0) + 1;
      rep.deferred = interest; rep.deferCount = S.deferCount; interest = 0;
    }
    S.deferNext = false;
    const childcare = (S.kids || 0) * CHILD_COST;
    const hq = S.hqCost || 0;
    const net = rev - cost - interest - childcare - hq;
    rep.hq = hq;
    S.cash += net + prepaid; S.lastNet = net; S.lastRev = rev; S.lastInterest = interest;
    // 순이익 1억 돌파 → 이후 전기·수도료 부과 + 연간 법인세 과세표준 누적
    if (!S.bigProfit && net >= 10000) { S.bigProfit = true; rep.bigProfit = true; }
    if (S.bigProfit) S.taxBase = Math.max(0, (S.taxBase || 0) + net);
    if (rep.deferCount >= DEFER_SEIZE) rep.seized = this.seize();
    else if (rep.deferCount >= DEFER_WARN) rep.bankWarn = rep.deferCount;
    rep.childcare = childcare;
    // CEO 피로도: 지점이 많고 공사·적자가 겹칠수록 빨리 쌓임
    const nOpen = S.branches.length, nBuild = S.branches.filter(b => b.status === 'build').length;
    S.fatigue = clamp((S.fatigue || 0) + 2 + nOpen * 0.7 + nBuild * 1.2 + (net < 0 ? 1 : 0) + rnd(-1, 1), 0, 100);
    S.history.push({ m: S.month, rev, net }); if (S.history.length > 24) S.history.shift();
    // 경쟁사 성장
    S.competitors.forEach(c => { this.fixComp(c); c.asset = Math.round(c.asset + c.g * rnd(0.6, 1.4)); c.g *= 0.995; c.nw = Math.round(c.nw * rnd(1.003, 1.009) * 10) / 10; if (S.month % 24 === 0 && c.lv < 10) c.lv++; });
    rep.neg = S.cash < 0;
    // 마이너스 통장: -10억까지는 허용, 그보다 깊으면 대출 한도 안에서 비상 대출
    const deep = S.cash < -OVERDRAFT; // 이번 달 -10억을 넘었는가 (비상 대출로 메워도 위기로 셈)
    if (deep) {
      const room = S.loanCap - S.loan;
      const need = Math.min(room, Math.ceil((-OVERDRAFT - S.cash) / 10000) * 10000);
      if (need > 0) { S.loan += need; S.cash += need; rep.emergency = need; }
    }
    // -10억을 넘는 적자가 5개월 연속이면 파산 (비상 대출로 버틴 달도 포함)
    S.negMonths = deep ? S.negMonths + 1 : 0;
    rep.crisis = S.negMonths;
    if (S.negMonths >= BANKRUPT_MONTHS) S.over = true;
    const before = lvl;
    S.month++;
    rep.net = net; rep.rev = rev; rep.interest = interest;
    rep.lvlUp = this.lvl() > before ? this.lvl() : 0;
    if (S.month % 12 === 0 && S.branches.some(b => STAFF.some(s => b.staff[s.id]))) rep.wage = true;
    // 매년 3월 법인세 납부 (직전 1년 순이익 기준)
    // 준공 후 15년마다 인테리어 리뉴얼 시기
    rep.reno = S.branches.filter(b => b.status === 'open' && b.monthsOpen >= (b.renoNext || RENO_YEARS * 12));
    if (S.month % 12 === 0 && S.bigProfit && S.taxBase > 0) { const tax = this.corpTax(S.taxBase); S.cash -= tax; rep.tax = tax; rep.taxBase = S.taxBase; S.taxBase = 0; }
    // 매년 3월 부동산 재평가: 자산가치 상승 → 은행 담보 대출 한도 증가
    if (S.month % 12 === 0) {
      let inc = 0; S.branches.forEach(b => { if (b.status === 'open') { const d = Math.round((b.invest || 0) * LAND_GROWTH); b.invest += d; inc += d; } });
      if (inc) { S.loanCap += Math.round(inc * 0.7); rep.reval = inc; }
    }
    // 스테이지 진행
    rep.stage = this.checkStage();
    return rep;
  },

  tickBranch(b, rep) {
    const S = this.S; const lvl = this.lvl(); const rooms = this.rooms(b);
    const res = { revenue: 0, cost: 0 };
    if (b.status === 'build') {
      // 레벨 8: 공사 중 사전 계약
      if (lvl >= 8) {
        const inq = this.inquiries(b); const r = this.rates(b);
        let tot = 0; SEGS.forEach(k => tot += inq[k]);
        const pre = tot * r.tour * r.apply * r.contract * 0.6;
        b.waitlist = Math.min(Math.round(rooms * 0.7), b.waitlist + randRound(pre));
      }
      b.buildLeft--;
      res.cost = b.pendingCost; res.prepaid = b.pendingCost; b.pendingCost = 0;
      b.last = { building: true, revenue: 0, cost: res.cost, profit: -res.cost };
      if (b.buildLeft <= 0) { b.status = 'open'; b.openedAt = S.month + 1; b.monthsOpen = 0; rep.opened.push(b); }
      return res;
    }
    const land = this.land(b);
    const occStart = this.occ(b);
    // 퇴실
    const ch = this.churn(b); const mo = dateOf(S.month).mo;
    let out = 0;
    SEGS.forEach(k => {
      let c = ch; if ((k === 'stu' || k === 'intl') && (mo === 2 || mo === 8)) c += 0.06;
      const o = Math.min(b.occ[k], randRound(b.occ[k] * c)); b.occ[k] -= o; out += o;
    });
    // 문의 → 퍼널
    const inq = this.inquiries(b); const r = this.rates(b);
    let inqT = 0; SEGS.forEach(k => inqT += inq[k]);
    const tours = inqT * r.tour, apps = tours * r.apply, cons = apps * r.contract;
    let refC = 0;
    if (lvl >= 3) {
      let refM = 1; COMM_EVENTS.forEach(e => { refM += e.ref * 3 * this.dim(this.evN(b, e.id), 1); });
      refC = occStart * 0.025 * (b.sat / 80) * refM * (b.sat >= 90 ? 2 : 1);
    }
    const moveCand = cons * r.movein + refC * 0.9;
    // 입주 배분
    let vac = rooms - this.occ(b);
    b.waitlist = Math.floor(b.waitlist * 0.8);
    const fromWait = Math.min(vac, b.waitlist); b.waitlist -= fromWait; vac -= fromWait;
    const cand = randRound(moveCand);
    const moveNew = Math.min(vac, cand);
    const excess = cand - moveNew;
    if (excess > 0 && lvl >= 5) b.waitlist = Math.min(Math.round(rooms * 0.5), b.waitlist + Math.round(excess * 0.7));
    const totalIn = fromWait + moveNew;
    // 세그먼트 배분 (문의 비율 기준)
    const shares = SEGS.map(k => ({ k, v: inq[k] / (inqT || 1) * totalIn }));
    let given = 0; shares.forEach(s => { s.f = Math.floor(s.v); given += s.f; });
    shares.sort((a, c) => (c.v - c.f) - (a.v - a.f));
    for (let i = 0; given < totalIn; i++, given++) shares[i % shares.length].f++;
    shares.forEach(s => b.occ[s.k] += s.f);
    const occEnd = this.occ(b);
    // 매출
    const rent = this.baseRent(b) * b.rentF * this.modMul(b, 'rent');
    let revenue = Math.round((occStart + occEnd) / 2 * rent);
    revenue -= Math.round(this.modAdd(b, 'rentLoss') * rent);
    const rentRev = revenue; const extra = this.extraRev(b, (occStart + occEnd) / 2); revenue += extra.total;
    const c = this.costs(b);
    const cost = c.budget + c.staff + c.maint + c.channels + c.events + c.service + c.util + c.boost + b.pendingCost;
    const eventCost = b.pendingCost; b.pendingCost = 0;
    // 만족도 / 시설
    const tgt = this.satTarget(b);
    b.sat = clamp(b.sat + (tgt - b.sat) * 0.4, 0, 100);
    b.cond = clamp(b.cond - (3 + land.hidden[2] / 100 * 6 + (b.size === 'L' ? 2 : 0)) + b.budget.fac / 100 * 9 + this.dim(this.stN(b, 'fm'), 5) * this.ab(b, 'fm') + (this.ace(b, 'fm') ? 5 : 0), 0, 100);
    // 브랜드
    let xp = 0; const occR = occEnd / rooms;
    if (occR >= 0.9) xp += 2; else if (occR >= 0.7) xp += 1;
    if (b.sat >= 80) xp += 2;
    if (b.sat >= 90) xp += 3;
    if (b.sat < 50) xp -= 2;
    xp *= 0.6 + land.hidden[4] / 100 * 0.8;
    if (b.concept === 'creator') xp *= 1.2;
    CHANNELS.forEach(chn => { if (b.channels[chn.id] && chn.brand && !rep['ch_' + chn.id]) { xp += chn.brand; rep['ch_' + chn.id] = true; } });
    if (this.ace(b, 'mm')) xp += 2;
    S.brandXP = Math.max(0, S.brandXP + xp); rep.xp += xp;
    // 정보 공개
    b.monthsOpen++;
    for (let i = 0; i < 5; i++) if (!b.revealed[i] && b.monthsOpen >= i + 1) { b.revealed[i] = true; rep.revealed.push({ b, i }); break; }
    // 효과 기간 감소
    b.mods.forEach(m => m.n--); b.mods = b.mods.filter(m => m.n > 0);
    b.last = {
      inq: Math.round(inqT), tours: Math.round(tours), apps: Math.round(apps), cons: Math.round(cons), ref: Math.round(refC),
      movein: totalIn, moveout: out, fromWait, revenue, rentRev, extra, cost, costs: c, eventCost, profit: revenue - cost,
      occ: occEnd, occR, churn: ch, satTgt: tgt,
    };
    res.revenue = revenue; res.cost = cost; res.prepaid = eventCost;
    rep.branches.push(b);
    return res;
  },

  goalState(S = this.S) {
    const b = this.stageBranch(S); const st = STAGES[S.stage - 1];
    if (st.multi) {
      const opened = S.branches.filter(x => x.status === 'open').length;
      return { multi: true, branches: S.branches.length, opened, lvl: this.lvl(S), rank: this.rank(S).me,
        ok: [S.branches.length >= STAGE8_GOAL_BRANCHES && opened >= STAGE8_GOAL_BRANCHES, this.lvl(S) >= 10, this.rank(S).me === 1] };
    }
    if (!b || b.status !== 'open' || !b.last || b.last.building) return { b, ok: [false, false, false], occR: 0, sat: b ? b.sat : 0, profit: 0, target: b ? this.bTarget(b) : st.target };
    return { b, occR: b.last.occR, sat: b.sat, profit: b.last.profit, target: this.bTarget(b),
      ok: [b.last.occR >= 0.95, b.sat >= 80, b.last.profit >= this.bTarget(b)] };
  },

  checkStage() {
    const S = this.S;
    if (S.stageStatus === 'build') {
      const b = this.stageBranch(); if (b && b.status === 'open') S.stageStatus = 'run';
    }
    if (S.stageStatus !== 'run') return null;
    const g = this.goalState();
    if (g.multi) {
      if (g.ok.every(x => x) && !S.won) { S.won = true; S.stageStatus = 'cleared'; return { won: true }; }
      return null;
    }
    if (g.ok.every(x => x)) S.streak++; else S.streak = 0;
    if (S.streak >= 3) {
      S.stageStatus = 'cleared';
      return { cleared: S.stage };
    }
    return null;
  },

  // 이자 5회 보류 → 은행이 가장 비싼 건물을 압류 (채무 일부 상계)
  seize() {
    const S = this.S; if (!S.branches.length) return null;
    const b = S.branches.slice().sort((a, c) => (c.invest || 0) - (a.invest || 0))[0];
    S.branches = S.branches.filter(x => x !== b);
    const offset = Math.min(S.loan, Math.round((b.invest || 0) * 0.8));
    S.loan -= offset; S.unpaid = 0; S.deferCount = 0; S.sel = 0;
    if (b.stage === S.stage && (S.stageStatus === 'build' || S.stageStatus === 'run')) { S.stageStatus = 'select'; S.streak = 0; }
    if (!S.branches.length) S.over = true;
    return { name: b.name, invest: b.invest, offset };
  },
  repayUnpaid() {
    const S = this.S; if (!S.unpaid || S.cash < S.unpaid) return false;
    S.cash -= S.unpaid; S.unpaid = 0; S.deferCount = 0; return true;
  },

  advanceStage() {
    const S = this.S; if (S.stage >= 8) return;
    S.stage++; S.loanCap += Math.round(STAGES[S.stage - 1].loan * (S.loanMul || 1)); S.stageStatus = 'select'; S.streak = 0;
  },

  canPickMore() {
    const S = this.S; const st = STAGES[S.stage - 1];
    if (S.stageStatus === 'select') return true;
    if (st.multi && S.branches.length < STAGE8_GOAL_BRANCHES) {
      const used = S.branches.filter(b => b.stage === 8).map(b => b.landId);
      return used.length < 5;
    }
    return false;
  },

  // 업계 랭킹 점수 = 자산가치(억)×0.5 + 브랜드 레벨×25 + 평균 만족도
  assetsOf(S = this.S) { return S.cash + S.branches.reduce((a, b) => a + (b.invest || 0), 0); },
  netWorth(S = this.S) { return (this.assetsOf(S) - S.loan - (S.unpaid || 0)) * (1 - (S.stake || 0)) + (S.house ? 145000 : 0); },
  fixComp(c) { if (!CEO_NICKS.includes(c.ceo)) c.ceo = pick(CEO_NICKS); if (c.asset == null) { c.asset = (c.score || 100) * 2; c.lv = 4; c.nw = (c.score || 100) * 0.5; c.ceo = c.ceo || '대표'; } if (!c.g) c.g = c.asset * 0.022; return c; },
  compScore(c) { this.fixComp(c); return Math.round(c.asset * 0.5 + c.lv * 25 + 80); },
  score(S = this.S) {
    const open = S.branches.filter(b => b.status === 'open');
    const sat = open.length ? open.reduce((a, b) => a + b.sat, 0) / open.length : 0;
    return Math.round(this.assetsOf(S) / 10000 * 0.5 + this.lvl(S) * 25 + sat);
  },
  rank(S = this.S) {
    const me = this.score(S);
    const list = S.competitors.map(c => ({ name: c.name, score: this.compScore(c), asset: c.asset, lv: c.lv })).concat([{ name: S.brand, score: me, asset: Math.round(this.assetsOf(S) / 10000), lv: this.lvl(S), me: true }]);
    list.sort((a, b) => b.score - a.score);
    return { list, me: list.findIndex(x => x.me) + 1 };
  },
  ceoRank(S = this.S) {
    const list = S.competitors.map(c => { this.fixComp(c); return { name: c.ceo, brand: c.name, nw: c.nw }; }).concat([{ name: S.ceo, brand: S.brand, nw: Math.round(this.netWorth(S) / 10000), me: true }]);
    list.sort((a, b) => b.nw - a.nw);
    return { list, me: list.findIndex(x => x.me) + 1 };
  },

  // ---- 랜덤 이벤트 ----
  rollEvent() {
    const S = this.S;
    const open = S.branches.filter(b => b.status === 'open' && b.monthsOpen >= 1);
    if (!open.length || Math.random() > 0.6) return null;
    const pairs = [];
    open.forEach(b => EVENTS.forEach(e => pairs.push({ b, e })));
    const p = weighted(pairs, x => (x.e.disaster ? 0 : x.e.w(x.b, this)) * (x.b.stage === S.stage ? 1.5 : 1));
    return p ? { bid: p.b.id, eid: p.e.id } : null;
  },
  // 자연재해: 1년에 1번, 50% 확률 (그 해의 무작위 달)
  rollDisaster() {
    const S = this.S; const y = Math.floor(S.month / 12);
    if (S.dzYear !== y) { S.dzYear = y; S.dzMonth = Math.random() < 0.5 ? y * 12 + Math.floor(Math.random() * 12) : -1; }
    if (S.month !== S.dzMonth) return null;
    const open = S.branches.filter(b => b.status === 'open');
    if (!open.length) { if (S.month % 12 < 11) S.dzMonth++; return null; }
    const pairs = []; open.forEach(b => EVENTS.filter(e => e.disaster).forEach(e => pairs.push({ b, e })));
    const p = weighted(pairs, x => x.e.w(x.b, this));
    return p ? { bid: p.b.id, eid: p.e.id } : null;
  },
  findBranch(id) { return this.S.branches.find(b => b.id === id); },
};

    ctx.fillText('공사중 ' + Math.round(frac * 100) + '%', (g.x0 + g.bw / 2) * this.K, 138.5 * this.K);
  },

  facade(g, a, wall, wall2, N) {
    const x0 = g.x0, x1 = g.x0 + g.bw, top = g.top, bot = 150 - g.lounge;
    const line = mix(wall2, '#000', 0.1), hi = mix(wall, '#ffffff', 0.18);
    if (a.pat === 'brick') {
      for (let y = top + 1; y < bot; y += 3) { this.r(x0, y, g.bw, 1, line); for (let x = x0 + ((y - top) / 3 % 2 ? 2 : 5); x < x1; x += 6) this.r(x, y + 1, 1, 2, line); }
    } else if (a.pat === 'panel') {
      for (let x = x0 + 9; x < x1; x += 10) this.r(x, top, 1, bot - top, line);
    } else if (a.pat === 'glass') {
      for (let x = x0 + 4; x < x1; x += 5) this.r(x, top, 1, bot - top, mix(wall2, '#ffffff', 0.1));
      for (let i = 0; i < 4; i++) { const sx = x0 + 6 + i * 26; for (let k = 0; k < 14; k++) if (sx + k < x1 - 1) this.r(sx + k, top + 4 + k * 2, 1, 2, mix(hi, '#ffffff', N > 0.5 ? 0 : 0.2)); }
    } else if (a.pat === 'stripe') {
      const cs = ['#ff8fab', '#ffd166', '#4cc9f0', '#9be564'];
      for (let i = 0; i * 14 < g.bw; i++) this.r(x0 + i * 14, top, 5, bot - top, mix(cs[i % 4], '#2a2850', N * 0.45));
      for (let i = 0; i < 6; i++) this.r(x0 + 4 + i * 17, bot - 5 - (i % 3) * 2, 8, 2, mix(cs[(i + 2) % 4], '#000', 0.2));
    } else if (a.pat === 'tile') {
      for (let y = top + 1; y < bot; y += 2) for (let x = x0 + ((y - top) % 4 ? 1 : 0); x < x1; x += 2) this.r(x, y, 1, 1, line);
    }
  },

  roofDraw(g, a, trim, wall2, N) {
    const x0 = g.x0, bw = g.bw, top = g.top;
    if (a.roof === 'saw') {
      for (let x = x0; x < x0 + bw; x += 12) for (let k = 0; k < 6; k++) this.r(x + k * 2, top - k - 1, Math.max(1, 12 - k * 2), 1, mix('#6d7385', '#333', N * 0.4));
      for (let x = x0 + 9; x < x0 + bw; x += 12) this.r(x, top - 6, 2, 5, mix('#bfe3ff', '#ffd86b', N));
    } else if (a.roof === 'pitched') {
      const tile = mix('#3b3f4a', '#1b1d24', N * 0.4);
      for (let k = 0; k < 8; k++) this.r(x0 - 6 + k, top - k - 1, bw + 12 - k * 2, 1, tile);
      this.r(x0 - 8, top - 2, 3, 2, tile); this.r(x0 + bw + 5, top - 2, 3, 2, tile);
      this.r(x0 - 9, top - 3, 2, 1, tile); this.r(x0 + bw + 7, top - 3, 2, 1, tile);
      for (let x = x0 - 4; x < x0 + bw + 4; x += 3) this.r(x, top - 1, 1, 1, mix(tile, '#ffffff', 0.15));
    } else if (a.roof === 'crown') {
      this.r(x0 + 6, top - 5, bw - 12, 5, wall2); this.r(x0 + 16, top - 10, bw - 32, 5, mix(wall2, '#000', 0.15));
      this.r(x0 + bw / 2, top - 18, 1, 8, '#555'); if (Math.floor(Date.now() / 600) % 2) this.r(x0 + bw / 2, top - 19, 1, 1, '#ff5d5d');
    } else if (a.roof === 'garden') {
      for (let x = x0; x < x0 + bw; x += 6) { this.r(x, top - 3, 5, 3, mix('#3fa35a', '#1d4a33', N * 0.5)); this.r(x + 1, top - 4, 3, 1, mix('#4cb860', '#1d4a33', N * 0.5)); }
    } else {
      this.r(x0 + 4, top - 9, 14, 6, mix('#c9ced8', '#555', N * 0.5)); this.r(x0 + 6, top - 8, 4, 4, '#6d7385'); this.r(x0 + 11, top - 8, 4, 4, '#6d7385');
    }
  },

  building(t, b, S, sk) {
    const g = this.geom(b); const C = CONCEPTS[b.concept]; const K = this.K; const a = g.arch;
    const N = sk.night;
    // 리뉴얼할 때마다 외벽 톤 · 창틀 색 · 1층 차양이 바뀜
    const RT = ['', '#7fb8b0', '#e8b86a', '#a89be0', '#e0909a'][Math.min(4, b.reno || 0)];
    const baseWall = RT ? mix(a.wall, RT, 0.28) : a.wall, baseWall2 = RT ? mix(a.wall2, RT, 0.28) : a.wall2;
    const wall = mix(mix(baseWall, C.wall, 0.15), '#2a2850', N * 0.45), wall2 = mix(mix(baseWall2, C.wall2, 0.15), '#22203f', N * 0.45);
    const GR = b.grade || 'std';
    const trim = mix(GR === 'luxury' ? '#e8c25a' : GR === 'premium' ? '#bdeefa' : GR === 'basic' ? '#a7abb5' : (RT || C.trim), '#333', N * 0.3);
    const occR = Sim.occ(b) / Sim.rooms(b);
    this.r(g.x0 + 3, g.top + 2, g.bw, 150 - g.top - 2, mix(wall2, '#000', 0.25));
    this.r(g.x0, g.top, g.bw, 150 - g.top, wall);
    this.facade(g, a, wall, wall2, N);
    this.r(g.x0, g.top, 2, 150 - g.top, wall2); this.r(g.x0 + g.bw - 2, g.top, 2, 150 - g.top, wall2);
    if (a.roof !== 'pitched') this.r(g.x0 - 2, g.top - 3, g.bw + 4, 3, trim);
    this.roofDraw(g, a, trim, wall2, N);
    const rh = this.roofH(a);
    if (GR === 'premium' || GR === 'luxury') {
      if (a.roof !== 'pitched' && a.roof !== 'saw') {
        const rx = g.x0 + g.bw - 26;
        this.r(rx, g.top - 7, 22, 1, '#e8f6ff'); for (let i = 0; i < 6; i++) this.r(rx + i * 4, g.top - 7, 1, 4, '#e8f6ff');
        this.r(rx + 4, g.top - 13, 9, 2, GR === 'luxury' ? '#e8c25a' : '#ff8fab'); this.r(rx + 8, g.top - 11, 1, 8, '#555');
      }
    }
    if (GR === 'luxury') {
      for (let f = 0; f <= g.floors; f++) this.r(g.x0, g.top + f * g.fh - 1, g.bw, 1, mix('#e8c25a', '#333', N * 0.3));
      if (N > 0.5) { const am = Math.sin(t / 900) * 18; for (let i = 0; i < 20; i++) this.r(g.x0 + g.bw / 2 + am * i / 20 + 8, g.top - 22 - rh - i, 2, 1, 'rgba(255,240,170,0.35)'); }
    }
    if (GR === 'basic') { this.r(g.x0 + 8, g.top + 5, 4, 3, wall2); this.r(g.x0 + g.bw - 14, g.top + 20, 5, 2, wall2); }
    // 객실 창문
    const total = g.floors * g.cols; const lit = Math.round(occR * total);
    if (!this._perm || this._permId !== b.id + total) {
      const rr = seeded(hashStr(b.id)); this._perm = Array.from({ length: total }, (_, i) => i).sort(() => rr() - 0.5); this._permId = b.id + total;
    }
    const occSet = new Set(this._perm.slice(0, lit));
    const cw = (g.bw - 8) / g.cols;
    const segCol = SEGS.map(k => SEG_INFO[k].color);
    const frame = mix(a.pat === 'glass' ? '#2a3550' : '#3b2f4a', '#1b1628', N * 0.5);
    for (let f = 0; f < g.floors; f++) {
      const fy = g.top + f * g.fh;
      if (a.pat !== 'glass') this.r(g.x0, fy + g.fh - 1, g.bw, 1, wall2);
      if (a.win === 'band') this.r(g.x0 + 3, fy + 2, g.bw - 6, g.fh - 4, frame);
      for (let i = 0; i < g.cols; i++) {
        const idx = f * g.cols + i; const on = occSet.has(idx);
        let ww = 8, wh = Math.min(8, g.fh - 4), wx = Math.round(g.x0 + 4 + i * cw + cw / 2 - 4), wy = fy + 2;
        if (a.win === 'tall') { ww = 6; wh = g.fh - 3; wx += 1; wy = fy + 1; }
        if (a.win === 'band') { ww = Math.floor(cw) - 1; wx = Math.round(g.x0 + 4 + i * cw); wh = g.fh - 6; wy = fy + 3; }
        let glass;
        if (on) glass = N > 0.5 ? '#ffd86b' : mix('#bfe3ff', '#ffd86b', N);
        else glass = N > 0.5 ? '#1f2244' : (a.pat === 'glass' ? '#4d6a92' : '#58668a');
        if (a.win !== 'band') this.r(wx - 1, wy - 1, ww + 2, wh + 2, frame);
        this.r(wx, wy, ww, wh, glass);
        if (a.win === 'arch') { this.r(wx, wy, 1, 1, frame); this.r(wx + ww - 1, wy, 1, 1, frame); this.r(wx - 1, wy - 1, ww + 2, 1, wall); this.r(wx + 1, wy - 1, ww - 2, 1, frame); }
        if (a.win === 'tall') this.r(wx, wy + Math.floor(wh / 2), ww, 1, frame);
        if (on) {
          this.r(wx, wy, 2, wh, mix(segCol[idx % 5], '#000', N * 0.3));
          if (N > 0.5 && idx % 3 === 0 && wh >= 7) { this.r(wx + 4, wy + 2, 2, 2, '#6b4a3a'); this.r(wx + 3, wy + 4, 4, 3, '#6b4a3a'); }
          else if (N <= 0.5) this.r(wx + ww - 3, wy + 1, 2, 2, '#ffffff');
        } else if (N <= 0.5) this.r(wx + 1, wy + 1, 1, 3, '#7d8aa8');
        if (a.win === 'shutter') { this.r(wx - 3, wy - 1, 2, wh + 2, mix('#7a4a32', '#2a1a14', N * 0.5)); this.r(wx + ww + 1, wy - 1, 2, wh + 2, mix('#7a4a32', '#2a1a14', N * 0.5)); }
        if (a.win === 'balcony') { this.r(wx - 2, wy + wh + 1, ww + 4, 1, '#f4f4f4'); this.r(wx - 2, wy + wh - 1, 1, 2, '#f4f4f4'); this.r(wx + ww + 1, wy + wh - 1, 1, 2, '#f4f4f4'); }
        else if (a.win !== 'band') this.r(wx - 1, wy + wh, ww + 2, 1, trim);
      }
    }
    // 라운지 (1층)
    const ly = 150 - g.lounge;
    const wp = mix('#5c5390', '#2e2950', N * 0.4), wp2 = mix('#6b62a2', '#373160', N * 0.4);
    this.r(g.x0 + 2, ly, g.bw - 4, g.lounge, wp);
    for (let y = ly + 2; y < 148; y += 4) for (let x = g.x0 + 4 + ((y / 4) % 2) * 2; x < g.x0 + g.bw - 4; x += 4) this.r(x, y, 1, 1, wp2);
    this.r(g.x0 + 2, 148, g.bw - 4, 2, '#3a2b3a');
    if (b.reno) { // 리뉴얼: 1층 줄무늬 차양 + 라운지 조명 라인
      const aw = mix(RT, '#222', N * 0.4); for (let x = g.x0 + 2; x < g.x0 + g.bw - 2; x += 6) { this.r(x, ly - 3, 3, 4, aw); this.r(x + 3, ly - 3, 3, 4, mix('#ffffff', '#333', N * 0.4)); }
      this.r(g.x0 + 2, ly + 1, g.bw - 4, 1, mix(RT, '#ffd86b', N));
    }
    this.r(g.x0 + 4, ly + 4, 9, 14, '#8a8fa0'); this.r(g.x0 + 5, ly + 5, 7, 13, '#b9c3d6'); this.r(g.x0 + 8, ly + 5, 1, 13, '#8a8fa0');
    this.r(g.x0 + 15, ly + 4, 9, 14, '#7a3b3b'); this.r(g.x0 + 16, ly + 5, 7, 13, '#9c4b4b'); this.r(g.x0 + 21, ly + 11, 1, 1, '#ffd34d');
    const fx = g.x0 + 30;
    this.r(fx, ly + 11, 16, 5, '#2e8f8a'); this.r(fx, ly + 9, 16, 3, '#38a8a2'); this.r(fx - 1, ly + 10, 2, 6, '#2e8f8a'); this.r(fx + 15, ly + 10, 2, 6, '#2e8f8a');
    this.r(fx + 22, ly + 12, 8, 1, '#6b4a3a'); this.r(fx + 23, ly + 13, 1, 3, '#6b4a3a'); this.r(fx + 28, ly + 13, 1, 3, '#6b4a3a'); this.r(fx + 24, ly + 10, 3, 2, '#e9e2c4');
    this.r(fx + 34, ly + 4, 3, 1, '#333'); this.r(fx + 35, ly, 1, 4, '#333'); this.r(fx + 32, ly + 5, 7, 2, N > 0.3 ? '#ffd86b' : '#8a3b3b');
    if (g.bw > 100) {
      const bx = g.x0 + g.bw - 26; this.r(bx, ly + 3, 12, 15, '#7a4a32');
      for (let s = 0; s < 3; s++) for (let k = 0; k < 5; k++) this.r(bx + 1 + k * 2, ly + 4 + s * 5, 2, 4, ['#e05a5a', '#f2c14e', '#4fb3d9', '#9be564', '#ff8fab'][(k + s) % 5]);
    }
    const px = g.x0 + g.bw - 11; this.r(px, ly + 13, 5, 5, '#b8623f'); this.r(px - 1, ly + 7, 7, 6, '#3fa35a'); this.r(px + 1, ly + 5, 3, 2, '#3fa35a');
    this.drawPeople(t, b, g, ly, N);
    if (b.sat >= 90 && Math.random() < 0.03) this.hearts.push({ x: g.x0 + 10 + Math.random() * (g.bw - 20), y: ly - 4, life: 90 });
  },

  drawPeople(t, b, g, ly, N) {
    const occ = Sim.occ(b); const n = occ === 0 ? 0 : Math.min(7, Math.max(1, Math.ceil(occ / (Sim.rooms(b) / 7))) - (N > 0.5 ? 2 : 0));
    let arr = this.people[b.id];
    if (!arr) arr = this.people[b.id] = [];
    const sh = Sim.segShare(b);
    while (arr.length < Math.max(0, n)) {
      const r = Math.random(); let acc = 0, seg = 'stu';
      for (const k of SEGS) { acc += sh[k]; if (r <= acc) { seg = k; break; } }
      arr.push({ x: g.x0 + 8 + Math.random() * (g.bw - 20), v: 0.012 + Math.random() * 0.012, d: 1, seg, hair: pick(['#2b1d1a', '#5a3a22', '#e8c26a', '#c0392b', '#1a1a2e']), skin: pick(['#f5c9a5', '#e0a77e', '#a86f4c', '#ffdcbc']), wait: 0, sit: Math.random() < 0.3 });
    }
    if (arr.length > Math.max(0, n)) arr.length = Math.max(0, n);
    const minX = g.x0 + 5, maxX = g.x0 + g.bw - 10;
    arr.forEach((p, i) => {
      if (p.wait > 0) p.wait -= 16; else { p.x += p.v * 16 * p.d; if (p.x > maxX) { p.x = maxX; p.d = -1; p.wait = 800 + Math.random() * 2000; } if (p.x < minX) { p.x = minX; p.d = 1; p.wait = 600 + Math.random() * 1500; } if (Math.random() < 0.002) { p.wait = 1000 + Math.random() * 2000; } }
      const x = Math.round(p.x), y = ly + 6; const walk = p.wait <= 0 && Math.floor(t / 180 + i) % 2;
      const shirt = SEG_INFO[p.seg].color;
      this.r(x + 1, y, 3, 1, p.hair); this.r(x, y + 1, 5, 1, p.hair);
      this.r(x, y + 2, 5, 3, p.skin); this.r(x, y + 2, 1, 1, p.hair); this.r(x + 4, y + 2, 1, 1, p.hair);
      this.r(x + (p.d > 0 ? 3 : 1), y + 3, 1, 1, '#222');
      this.r(x, y + 5, 5, 3, shirt); this.r(x + 1, y + 8, 3, 1, '#3b4a6b');
      if (walk) { this.r(x + 1, y + 9, 1, 1, '#3b4a6b'); this.r(x + 3, y + 9, 1, 1, '#222'); }
      else { this.r(x + 1, y + 9, 1, 1, '#222'); this.r(x + 3, y + 9, 1, 1, '#222'); }
    });
  },
};

<script>
// ===== 이벤트 일러스트 씬 (160×90 픽셀, 애니메이션) =====
const Scenes = {
  W: 160, H: 90, K: 3, ctx: null,
  play(cv, id) {
    if (!cv) return;
    cv.width = this.W * this.K; cv.height = this.H * this.K;
    const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
    const f = SCN[id] || SCN.generic; const t0 = performance.now();
    const loop = now => {
      if (!cv.isConnected) return;
      this.ctx = ctx; ctx.clearRect(0, 0, cv.width, cv.height);
      try { f(this, now - t0); } catch (e) { console.error(e); return; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
  r(x, y, w, h, c) { if (!c) return; this.ctx.fillStyle = c; this.ctx.fillRect(Math.round(x) * this.K, Math.round(y) * this.K, Math.max(1, Math.round(w)) * this.K, Math.max(1, Math.round(h)) * this.K); },
  text(s, x, y, size, color, stroke) {
    const c = this.ctx, K = this.K; c.font = `900 ${size * K}px "Galmuri11","DungGeunMo",system-ui,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    if (stroke) { c.lineWidth = 3 * K / 2; c.strokeStyle = stroke; c.strokeText(s, x * K, y * K); }
    c.fillStyle = color; c.fillText(s, x * K, y * K);
  },
  // 사람: u=픽셀 배율, pose: stand|walk|tiptoe|up|sit
  person(x, y, o = {}) {
    const u = o.u || 2, R = (cx, cy, w, h, c) => this.r(x + cx * u, y + cy * u, w * u, h * u, c);
    const hair = o.hair || '#2b1d1a', skin = o.skin || '#f5c9a5', shirt = o.shirt || '#4fb3d9', pants = o.pants || '#3b4a6b';
    const fr = o.frame || 0, fl = o.flip;
    R(1, 0, 3, 1, hair); R(0, 1, 5, 1, hair);
    R(0, 2, 5, 3, skin); R(0, 2, 1, 1, hair); R(4, 2, 1, 1, hair);
    if (o.mask) R(0, 3, 5, 1, '#111');
    R(fl ? 1 : 3, 3, 1, 1, '#222');
    if (o.mouth) R(2, 4, 1, 1, o.mouth);
    R(0, 5, 5, 3, shirt);
    if (o.pose === 'up') { R(-1, 2, 1, 3, skin); R(5, 2, 1, 3, skin); }
    else { R(-1, 5, 1, 2, shirt); R(5, 5, 1, 2, shirt); R(-1, 7, 1, 1, skin); R(5, 7, 1, 1, skin); }
    if (o.pose === 'sit') { R(0, 8, 5, 1, pants); R(0, 9, 1, 1, '#222'); R(4, 9, 1, 1, '#222'); return; }
    R(1, 8, 3, 1, pants);
    if (o.pose === 'tiptoe') { R(fr ? 0 : 1, 9, 1, 1, '#222'); R(fr ? 3 : 4, 9, 1, 1, '#222'); }
    else if (fr) { R(0, 9, 1, 1, pants); R(4, 9, 1, 1, '#222'); }
    else { R(1, 9, 1, 1, '#222'); R(3, 9, 1, 1, '#222'); }
  },
  sky(top, bot) { for (let y = 0; y < 90; y += 3) this.r(0, y, 160, 3, mix(top, bot, y / 90)); },
  room(wall, floor) {
    this.r(0, 0, 160, 70, wall); for (let y = 4; y < 68; y += 6) for (let x = (y / 6 % 2) * 3; x < 160; x += 6) this.r(x, y, 1, 1, mix(wall, '#ffffff', 0.12));
    this.r(0, 68, 160, 2, mix(wall, '#000', 0.3)); this.r(0, 70, 160, 20, floor);
    for (let x = 0; x < 160; x += 16) this.r(x, 70, 1, 20, mix(floor, '#000', 0.15));
  },
  bldg(x, w, h, col, win, lit) {
    this.r(x, 76 - h, w, h, col); this.r(x - 1, 74 - h, w + 2, 2, mix(col, '#000', 0.3));
    for (let y = 80 - h; y < 70; y += 9) for (let wx = x + 3; wx < x + w - 5; wx += 8) this.r(wx, y, 5, 5, typeof lit === 'function' ? lit(wx, y) : win);
  },
  ground(c) { this.r(0, 76, 160, 14, c || '#5cc46a'); this.r(0, 79, 160, 11, '#4c2244'); },
  rain(t, n, col, len) { for (let i = 0; i < n; i++) { const x = (i * 37 + t * 0.12) % 170 - 5, y = (i * 53 + t * 0.35) % 95 - 5; this.r(x, y, 1, len || 4, col || '#9ec3ff'); } },
  stars(t) { for (let i = 0; i < 18; i++) if (Math.sin(t / 300 + i) > -0.2) this.r((i * 47) % 160, (i * 29) % 40, 1, 1, '#fff6c8'); },
  moon(x, y) { this.r(x + 2, y, 4, 8, '#f4f0d6'); this.r(x, y + 2, 8, 4, '#f4f0d6'); this.r(x + 1, y + 1, 6, 6, '#f4f0d6'); this.r(x + 4, y + 2, 2, 2, '#d8d2b0'); },
  heart(x, y, c) { c = c || '#ff6b8b'; this.r(x, y, 2, 1, c); this.r(x + 3, y, 2, 1, c); this.r(x - 0, y + 1, 5, 2, c); this.r(x + 1, y + 3, 3, 1, c); this.r(x + 2, y + 4, 1, 1, c); },
  phone(x, y, w, h, scr) { this.r(x - 2, y - 3, w + 4, h + 7, '#1e2034'); this.r(x, y, w, h, scr); this.r(x + w / 2 - 3, y + h + 1, 6, 2, '#555'); },
  bubble(x, y, s, c) { this.r(x, y, s, s, c || '#ffffff'); },
};
const PPL = [
  { hair: '#2b1d1a', skin: '#f5c9a5', shirt: '#ffd166' },
  { hair: '#e8c26a', skin: '#ffdcbc', shirt: '#4cc9f0' },
  { hair: '#5a3a22', skin: '#e0a77e', shirt: '#9be564' },
  { hair: '#c0392b', skin: '#f5c9a5', shirt: '#ff8fab' },
  { hair: '#1a1a2e', skin: '#a86f4c', shirt: '#c39bff' },

  end_yacht(Z, t) {

    Z.r(yx + 40, 30 + bob, 1, 24, '#888'); Z.r(yx + 41, 32 + bob, 1, 1, '#e05a5a');

    if (Sim.S && Sim.S.married) Z.person(yx + 6, 44 + bob, Object.assign({}, SPOUSE_LOOK, { u: 1.8 }));
    const ph = (t % 2400) / 2400; Z.r(yx + 64, 40 + bob - ph * 20, 2, 2, '#ffd34d'); for (let i = 0; i < 4; i++) Z.r(yx + 62 + i * 2, 44 + bob - ph * 10 - i * 2, 1, 1, '#fff6c8');

  end_mansion(Z, t) {

    Z.r(26, 18, 108, 42, '#f8f4ea'); Z.r(20, 14, 120, 6, '#d8c8a8'); Z.r(60, 4, 40, 10, '#f8f4ea'); Z.r(56, 2, 48, 3, '#d8c8a8');
    for (let i = 0; i < 6; i++) Z.r(32 + i * 18, 24, 6, 34, '#ffffff');
    for (let i = 0; i < 5; i++) Z.r(40 + i * 18, 26, 8, 12, '#9ad8ff');
    Z.r(70, 40, 20, 20, '#8a5a3a'); Z.r(79, 48, 2, 2, '#e8c25a');
    Z.r(0, 60, 160, 30, '#7ad08a'); Z.r(10, 66, 50, 14, '#3ad0ff'); for (let x = 12; x < 58; x += 8) Z.r(x + (t / 120 % 8), 70 + (x % 3) * 3, 4, 1, '#bff4ff');
    Z.r(4, 40, 3, 22, '#8a5a3a'); Z.r(0, 36, 12, 6, '#3fa35a'); Z.r(150, 40, 3, 22, '#8a5a3a'); Z.r(145, 36, 12, 6, '#3fa35a');
    const cx = Math.max(96, 170 - (t % 6000) / 30);
    Z.r(cx, 74, 30, 7, '#e05a5a'); Z.r(cx + 6, 70, 16, 5, '#e05a5a'); Z.r(cx + 8, 71, 5, 3, '#bfe3ff'); Z.r(cx + 15, 71, 5, 3, '#bfe3ff'); Z.r(cx + 3, 81, 5, 2, '#222'); Z.r(cx + 21, 81, 5, 2, '#222');
    Z.person(64, 62, Object.assign({}, CEO_LOOK, { u: 2, pose: Math.floor(t / 500) % 2 ? 'up' : 'stand' }));
    const S = Sim.S || {};

    const jx = 30 + Math.sin(t / 2000) * 10, jy = 28 + Math.sin(t / 700) * 2;
    for (let i = 1; i < 30; i++) Z.r(jx - i * 3, jy + 3, 2, 1, 'rgba(255,255,255,' + (0.8 - i / 40) + ')');
    Z.r(jx, jy, 60, 8, '#f4f4f4'); Z.r(jx + 56, jy + 1, 8, 6, '#f4f4f4'); Z.r(jx + 60, jy + 2, 6, 3, '#9ad8ff');
    Z.r(jx + 20, jy + 7, 22, 3, '#d0d8e8'); Z.r(jx + 2, jy - 8, 8, 8, '#e8c25a'); Z.r(jx, jy + 3, 60, 1, '#e8c25a');
    for (let i = 0; i < 7; i++) Z.r(jx + 14 + i * 6, jy + 2, 3, 2, '#4a6aa8');
    Z.text('PRIVATE JET', 120, 14, 6.5, '#ffffff', '#1e5aa8');
    Z.text('Tokyo · New York · London', 80, 82, 6, '#1e2034');
  },
  end_portrait(Z, t) {

    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + t / 3000; for (let r = 10; r < 80; r += 3) Z.r(80 + Math.cos(a) * r, 46 + Math.sin(a) * r, 2, 2, 'rgba(255,255,255,0.18)'); }
    for (let i = 0; i < 22; i++) { const x = (i * 31) % 160, y = ((i * 19 + t / 12) % 110) - 15; Z.r(x, y, 8, 4, '#3fa35a'); Z.r(x + 3, y + 1, 2, 2, '#9be564'); }
    Z.person(65, 20, Object.assign({}, CEO_LOOK, { u: 6, mask: true, mouth: '#c0392b' }));
    Z.r(68, 10, 24, 6, '#e8c25a'); Z.r(68, 6, 4, 4, '#e8c25a'); Z.r(78, 4, 4, 6, '#e8c25a'); Z.r(88, 6, 4, 4, '#e8c25a'); Z.r(79, 11, 2, 2, '#e05a5a');
    Z.r(70, 52, 20, 2, '#e8c25a'); Z.r(78, 54, 4, 4, '#e8c25a');
    for (let i = 0; i < 8; i++) if (Math.sin(t / 150 + i * 2) > 0.7) { const x = 20 + i * 18, y = 12 + (i * 23) % 60; Z.r(x, y - 2, 1, 5, '#fff'); Z.r(x - 2, y, 5, 1, '#fff'); }
