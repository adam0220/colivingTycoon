<script>
// ===== 창업 전 아르바이트: 햄버거 만들기 미니게임 =====
const BURGER_ING = {
  bun_b:   { name: '아랫빵' },
  patty:   { name: '패티' },
  cheese:  { name: '치즈' },
  lettuce: { name: '양상추' },
  tomato:  { name: '토마토' },
  onion:   { name: '양파' },
  bacon:   { name: '베이컨' },
  pickle:  { name: '피클' },
  bun_t:   { name: '윗빵' },
};
const BURGER_MID = ['patty', 'cheese', 'lettuce', 'tomato', 'onion', 'bacon', 'pickle'];
// 레벨: 버거 개수, 속재료 수 범위, 제한 시간(초)
const BURGER_LEVELS = [
  null,
  { n: 3, min: 2, max: 3, time: 30 },
  { n: 4, min: 3, max: 4, time: 30 },
  { n: 5, min: 4, max: 5, time: 30 },
  { n: 6, min: 5, max: 6, time: 30 },
  { n: 7, min: 6, max: 7, time: 30 },
];

const Burger = {
  K: 3, W: 160, H: 104,
  // 재료 한 층 그리기 (x=가운데, y=아랫면, w=폭) → 높이 반환
  layer(r, type, cx, y, w) {
    const x = cx - w / 2;
    switch (type) {
      case 'bun_b': r(x, y - 4, w, 4, '#e0a050'); r(x + 1, y - 1, w - 2, 1, '#b8732a'); return 4;
      case 'patty': r(x + 1, y - 4, w - 2, 4, '#6b3a22'); r(x + 1, y - 4, w - 2, 1, '#8a5232'); for (let i = 3; i < w - 3; i += 5) r(x + i, y - 2, 1, 1, '#4a2614'); return 4;
      case 'cheese': r(x - 1, y - 2, w + 2, 2, '#ffd34d'); r(x + 3, y, 3, 2, '#ffd34d'); r(x + w - 7, y, 3, 1, '#ffd34d'); return 2;
      case 'lettuce': for (let i = -2; i < w + 2; i += 3) r(x + i, y - 2 - (i % 2), 3, 2 + (i % 2), i % 6 ? '#4cb860' : '#3a9a4a'); return 2;
      case 'tomato': for (let i = 1; i < w - 1; i += 8) r(x + i, y - 2, 7, 2, '#e05a5a'); r(x + 2, y - 2, w - 4, 1, '#f07a7a'); return 2;
      case 'onion': for (let i = 1; i < w - 2; i += 7) { r(x + i, y - 2, 6, 2, '#f4e6f4'); r(x + i + 1, y - 2, 4, 1, '#c39bff'); } return 2;
      case 'bacon': for (let i = 0; i < w; i += 2) r(x + i, y - 2 - (i % 4 ? 0 : 1), 2, 2, i % 6 ? '#c0392b' : '#f4c9a5'); return 3;
      case 'pickle': for (let i = 3; i < w - 4; i += 7) { r(x + i, y - 2, 5, 2, '#7aa03a'); r(x + i + 2, y - 2, 1, 1, '#a8c860'); } return 2;
      case 'bun_t': {
        const h = 7;
        for (let k = 0; k < h; k++) { const ins = Math.round(Math.pow(k / h, 2) * w * 0.35); r(x + ins, y - 1 - k, w - ins * 2, 1, k < 2 ? '#d08a3a' : '#e8a24a'); }
        for (let i = 0; i < 5; i++) r(x + w * 0.2 + i * w * 0.14, y - 4 - (i % 2), 2, 1, '#fff6d6');
        return h;
      }
    }
    return 2;
  },

  start(done) {
    this.done = done; this.level = 1; this.earned = 0;
    UI.screenOpen = true;
    const sc = $('#screen'); sc.classList.remove('hidden'); sc.style.background = '#2b1428';
    sc.onclick = null;
    sc.innerHTML = `<div class="bg-wrap">
      <div class="bg-top"><span>🍔 버거 알바 <b id="bgLv">Lv.1</b>/5</span><span>남은 주문 <b id="bgLeft">0</b></span><span>💰 <b id="bgPay">0원</b></span></div>
      <div class="bg-timer"><i id="bgTime"></i><span id="bgSec"></span></div>
      <canvas id="bgCv"></canvas>
      <div class="bg-msg" id="bgMsg">주문표(왼쪽)와 똑같이 아래부터 쌓으세요</div>
      <div class="bg-ings">${Object.keys(BURGER_ING).map(k => `<button class="bg-ing" data-ing="${k}"><canvas width="48" height="30"></canvas><span>${BURGER_ING[k].name}</span></button>`).join('')}</div>
      <div class="bg-ctrl"><button class="btn ghost" id="bgUndo">↶ 다시 쌓기</button><button class="btn r" id="bgQuit">포기하기 (25%)</button></div>
      <div class="bg-over hidden" id="bgOver"></div>
    </div>`;
    // 버튼 아이콘
    sc.querySelectorAll('.bg-ing').forEach(b => {
      const c = b.querySelector('canvas').getContext('2d');
      const r = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x) * 3, Math.round(y) * 3, Math.max(1, Math.round(w)) * 3, Math.max(1, Math.round(h)) * 3); };
      this.layer(r, b.dataset.ing, 8, 7, 14);
    });
    sc.querySelectorAll('.bg-ing').forEach(b => b.onclick = () => this.tap(b.dataset.ing, b));
    $('#bgUndo').onclick = () => { if (this.state === 'play') { this.stack = []; this.msg('처음부터 다시 쌓아요'); } };
    $('#bgQuit').onclick = () => this.finish(this.state === 'play' ? 'fail' : 'quit');
    const cv = $('#bgCv'); cv.width = this.W * this.K; cv.height = this.H * this.K; this.ctx = cv.getContext('2d');
    this.state = 'intro'; this.introLevel();
    this.last = performance.now();
    const loop = now => {
      if (!document.getElementById('bgCv')) return;
      const dt = Math.min(100, now - this.last); this.last = now;
      if (this.state === 'play') {
        this.timeLeft -= dt / 1000;
        if (this.timeLeft <= 0) { this.timeLeft = 0; this.fail(); }
      }
      this.draw(now); this.hud();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },

  introLevel() {
    const L = BURGER_LEVELS[this.level];
    this.state = 'intro'; this.served = 0; this.stack = []; this.order = this.newOrder(); this.timeLeft = L.time;
    this.overlay(`<div class="bg-big">Lv.${this.level}</div><p>버거 <b>${L.n}개</b> · 속재료 ${L.min}~${L.max}개 · 제한 ${L.time}초</p>
      <p>클리어 보상 <b class="pos">${fmtMoney(BURGER_REWARD[this.level])}</b>${this.earned ? `<br><span class="muted">지금까지 쌓은 보상: ${fmtMoney(this.earned)}</span>` : ''}</p>
      <p class="muted">틀린 재료를 올리면 처음부터 다시 쌓고 3초가 줄어요<br>Lv.5까지 깨면 전액 · 그만두면 50% · 실패하면 25%</p>`,
      [{ label: '시작!', cls: 'y', on: () => { this.hideOverlay(); this.state = 'play'; this.msg('주문표와 똑같이 쌓으세요'); } }]
        .concat(this.earned ? [{ label: `그만두고 50%만 받기 (${fmtMoney(this.earned / 2)})`, cls: 'ghost', on: () => this.finish('quit') }] : []));
  },

  newOrder() {
    const L = BURGER_LEVELS[this.level];
    const n = L.min + Math.floor(Math.random() * (L.max - L.min + 1));
    const mid = []; for (let i = 0; i < n; i++) { let k; do { k = BURGER_MID[Math.floor(Math.random() * BURGER_MID.length)]; } while (mid[mid.length - 1] === k); mid.push(k); }
    return ['bun_b'].concat(mid, ['bun_t']);
  },

  tap(k, btn) {
    if (this.state !== 'play') return;
    const need = this.order[this.stack.length];
    if (k === need) {
      this.stack.push(k); btn.classList.add('ok'); setTimeout(() => btn.classList.remove('ok'), 150);
      if (this.stack.length === this.order.length) {
        this.served++; this.happy = performance.now();
        const L = BURGER_LEVELS[this.level];
        if (this.served >= L.n) { this.clearLevel(); return; }
        this.msg(`👍 ${this.served}/${L.n} 완성! 다음 주문`);
        this.stack = []; this.order = this.newOrder();
      }
    } else {
      this.stack = []; this.timeLeft = Math.max(0, this.timeLeft - 3); this.shake = performance.now();
      btn.classList.add('ng'); setTimeout(() => btn.classList.remove('ng'), 300);
      this.msg(`❌ ${BURGER_ING[k].name} 아니에요! 다음은 ${BURGER_ING[need].name} · 처음부터 다시 (-3초)`);
    }
  },

  clearLevel() {
    this.earned = BURGER_REWARD[this.level];
    if (this.level >= 5) { this.state = 'end'; this.overlay(`<div class="bg-big">ALL CLEAR!</div><p>사장님이 감동했어요<br>"자네 그냥 우리 가게 맡아볼래?"</p><p>최종 보상 <b class="pos">${fmtMoney(this.earned)}</b></p>`, [{ label: '정산받기 (전액)', cls: 'y', on: () => this.finish('clear') }]); return; }
    this.state = 'end';
    this.overlay(`<div class="bg-big">Lv.${this.level} CLEAR!</div><p>확보한 보상 <b class="pos">${fmtMoney(this.earned)}</b></p><p class="muted">계속 도전해 Lv.5를 깨면 2억 전액!<br>여기서 그만두면 50%, 도중에 실패하면 25%만 받아요</p>`,
      [{ label: `Lv.${this.level + 1} 도전 (보상 ${fmtMoney(BURGER_REWARD[this.level + 1])})`, cls: 'y', on: () => { this.level++; this.introLevel(); } },
       { label: `그만두고 50%만 받기 (${fmtMoney(this.earned / 2)})`, cls: 'ghost', on: () => this.finish('quit') }]);
  },

  fail() {
    this.state = 'end';
    this.overlay(`<div class="bg-big">TIME OVER</div><p>손님이 기다리다 돌아갔어요…</p><p>${this.earned ? `실패해서 쌓은 보상의 25%만 받아요 <b class="pos">${fmtMoney(this.earned * 0.25)}</b>` : '아직 쌓은 보상이 없어요'}</p>`,
      [{ label: '정산받기', cls: 'y', on: () => this.finish('fail') }]);
  },

  // 정산: 전부 클리어 100%, 중간에 그만두기 50%, 실패(시간 초과·도중 포기) 25%
  finish(mode) {
    if (this.closed) return; this.closed = true;
    const pay = Math.round(this.earned * (mode === 'clear' ? 1 : mode === 'quit' ? 0.5 : 0.25) / 100) * 100;
    this.lastMode = mode;
    const sc = $('#screen'); sc.innerHTML = ''; sc.classList.add('hidden'); sc.style.background = '';
    UI.screenOpen = false; this.closed = false;
    this.done && this.done(pay);
  },

  overlay(html, buttons) {
    const o = $('#bgOver'); o.classList.remove('hidden');
    o.innerHTML = `<div class="bg-card">${html}<div class="bg-btns">${buttons.map((b, i) => `<button class="btn big ${b.cls || ''}" data-ob="${i}">${b.label}</button>`).join('')}</div></div>`;
    o.querySelectorAll('[data-ob]').forEach(el => el.onclick = () => buttons[+el.dataset.ob].on());
  },
  hideOverlay() { const o = $('#bgOver'); o.classList.add('hidden'); o.innerHTML = ''; },
  msg(t) { const m = $('#bgMsg'); if (m) m.textContent = t; },

  hud() {
    const L = BURGER_LEVELS[this.level]; if (!L || !$('#bgLv')) return;
    $('#bgLv').textContent = 'Lv.' + this.level; $('#bgLeft').textContent = Math.max(0, L.n - this.served);
    $('#bgPay').textContent = this.earned ? fmtMoney(this.earned) : '0원';
    const f = this.timeLeft / L.time; const t = $('#bgTime'); t.style.width = (f * 100) + '%'; t.style.background = f < 0.25 ? '#ff5d5d' : f < 0.5 ? '#ffd34d' : '#c6f26b';
    $('#bgSec').textContent = Math.ceil(this.timeLeft) + '초';
  },

  draw(now) {
    const ctx = this.ctx, K = this.K;
    const r = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x) * K, Math.round(y) * K, Math.max(1, Math.round(w)) * K, Math.max(1, Math.round(h)) * K); };
    // 가게 배경
    r(0, 0, 160, 104, '#f6e2c0'); for (let x = 0; x < 160; x += 8) r(x, 0, 4, 30, '#f0d4a8');
    r(0, 30, 160, 3, '#c0392b'); r(0, 33, 160, 2, '#ffd34d');
    r(4, 4, 40, 18, '#2b2235'); Scenes.ctx = ctx; Scenes.text('BURGER', 24, 10, 5, '#ffd34d'); Scenes.text('since 1999', 24, 17, 3.5, '#fff');
    // 손님
    const happy = this.happy && now - this.happy < 900;
    const cx = 120;
    Scenes.person(cx, 8, { hair: '#5a3a22', skin: '#f5c9a5', shirt: '#4fb3d9', u: 2, pose: happy ? 'up' : 'stand', mouth: happy ? '#c0392b' : null });
    if (happy) Scenes.text('♥', cx + 18, 8, 7, '#ff3b5c');
    else if (this.state === 'play' && this.timeLeft < 10 && Math.floor(now / 300) % 2) Scenes.text('!!', cx + 16, 8, 7, '#ff3b3b');
    // 카운터
    r(0, 56, 160, 48, '#8a5a3a'); r(0, 56, 160, 3, '#b07a4a'); for (let x = 0; x < 160; x += 20) r(x, 62, 1, 42, '#6b4a3a');
    // 주문표
    r(6, 38, 46, 62, '#fffdf4'); r(6, 38, 46, 7, '#e05a5a'); Scenes.text('ORDER', 29, 41.5, 4.5, '#fff');
    if (this.order) {
      let y = 96; this.order.forEach((k, i) => { const h = this.layer(r, k, 29, y, 30); if (i === this.stack.length && this.state === 'play' && Math.floor(now / 400) % 2) r(7, y - h, 2, h, '#e05a5a'); y -= h + 1; });
    }
    // 접시와 쌓는 버거
    const sh = this.shake && now - this.shake < 300 ? Math.sin(now / 20) * 2 : 0;
    r(70, 96, 76, 4, '#f4f4f4'); r(66, 98, 84, 2, '#dcdcdc');
    let y = 96;
    (this.stack || []).forEach(k => { const h = this.layer(r, k, 108 + sh, y, 52); y -= h + 1; });
    if (this.stack && !this.stack.length && this.state === 'play') Scenes.text('여기에 쌓아요', 108, 88, 4.5, '#b07a4a');
  },
};

</script>
<script>
// ===== UI / 게임 루프 =====
const SAVE_KEY = 'coliving-tycoon-seoul-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = v => Math.round(v * 100) + '%';

const IC_PAL = { a: '#1f4a47' };
const ICONS = {
  home: ['....aa....', '...aaaa...', '..aaaaaa..', '.aaaaaaaa.', 'aaaaaaaaaa', '.aaaaaaaa.', '.aaa..aaa.', '.aaa..aaa.', '.aaa..aaa.', '.aaa..aaa.'],
  wrench: ['......aaa.', '.....aa..a', '.....a...a', '....aaa.aa', '...aaaaaa.', '..aaa.....', '.aaa......', 'aaa.......', 'aa........', '..........'],
  people: ['.aa....aa.', 'aaaa..aaaa', 'aaaa..aaaa', '.aa....aa.', '....aa....', '.aa.aaaa..', 'aaaaaaaaaa', 'aaaaaaaaaa', 'aaaaaaaaaa', '..........'],
  star: ['....aa....', '....aa....', '...aaaa...', 'aaaaaaaaaa', '.aaaaaaaa.', '..aaaaaa..', '..aaaaaa..', '.aaa..aaa.', '.aa....aa.', '..........'],
  mega: ['........a.', '......aaa.', '....aaaaa.', 'aaaaaaaaa.', 'aaaaaaaaa.', 'aaaaaaaaa.', '....aaaaa.', '.aa...aaa.', '.aa.....a.', '..........'],
  pause: ['aa..aa', 'aa..aa', 'aa..aa', 'aa..aa', 'aa..aa', 'aa..aa'],
  play: ['a.....', 'aaa...', 'aaaaa.', 'aaaaa.', 'aaa...', 'a.....'],
  coin: ['...aaaa...', '.aaaaaaaa.', '.aa.aa.aa.', 'aaa.aa.aaa', 'aaaaaaaaaa', 'aaa.aa.aaa', 'aaa.aa.aaa', '.aa.aa.aa.', '.aaaaaaaa.', '...aaaa...'],
};
const MEDAL = pxSvg(['.gg..gg.', '.gg..gg.', '..gggg..', '..yyyy..', '.yyooyy.', 'yyoyyoyy', 'yyyooyyy', '.yyyyyy.', '..yyyy..'], { g: '#3fa35a', y: '#f2b632', o: '#fff3b0' }, 28);
const TROPHY = pxSvg(['yyyyyyyyyy', 'yoyyyyyyoy', 'y.yyyyyy.y', '.yyyyyyyy.', '..yyyyyy..', '...yyyy...', '....yy....', '....yy....', '...oooo...', '..oooooo..'], { y: '#f2b632', o: '#8a5a2a' }, 28);
const MENU = pxSvg(['bbbbbbbbbb', 'bwwwwwwwwb', 'bbbbbbbbbb', '..........', 'bbbbbbbbbb', 'bwwwwwwwwb', 'bbbbbbbbbb', '..........', 'bbbbbbbbbb', 'bwwwwwwwwb', 'bbbbbbbbbb'], { b: '#1e2034', w: '#8fdcb6' }, 26);
const CAL = pxSvg(['..a....a....', '.rrrrrrrrrr.', 'rrrrrrrrrrrr', 'rrrrrrrrrrrr', 'wwwwwwwwwwww', 'wkwwkwwkwwkw', 'wwwwwwwwwwww', 'wkwwkwwkwwkw', 'wwwwwwwwwwww', 'wkwwkwwkwwww', 'wwwwwwwwwwww'], { a: '#1e2034', r: '#e05a5a', w: '#f4f4f4', k: '#1e2034' }, 34);
const COO_FACE = pxSvg(['...hhhhhh...', '..hhhhhhhh..', '.hhhhhhhhhh.', '.hhsssssshh.', '.hssssssssh.', '.hsessssesh.', '.hssssssssh.', '.hsssmmsssh.', '..hssssssh..', '...cccccc...', '..cccwwccc..', '.cccccccccc.'], { h: '#3a2420', s: '#ffd9b8', e: '#222', m: '#d9536f', c: '#2e8f8a', w: '#fff' }, 44);

const TABS = [
  { id: 'home', ic: 'home', label: '지점' },
  { id: 'ops', ic: 'wrench', label: '운영' },
  { id: 'mkt', ic: 'mega', label: '마케팅' },
  { id: 'fin', ic: 'coin', label: '재무' },
];

const UI = {
  tab: 'home', running: true, speed: 1, prog: 0, last: 0, title: true, screenOpen: false,
  mq: [], modalOn: false, pendingEv: null, dragging: false, hudT: 0,

  init() {
    Art.init($('#scene'));
    $('#btnGoals').innerHTML = MEDAL; $('#btnRank').innerHTML = TROPHY; $('#btnMenu').innerHTML = MENU; $('#tvIcon').innerHTML = CAL;
    $('#tabs').innerHTML = TABS.map(t => `<button class="tab" data-tab="${t.id}">${pxSvg(ICONS[t.ic], IC_PAL, 22)}<span>${t.label}</span></button>`).join('');
    $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { this.tab = b.dataset.tab; this.renderPanel(true); } });
    $('#panel').addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) this.act(el.dataset.act, el.dataset.arg, el); });
    $('#panel').addEventListener('input', e => { const el = e.target; if (el.dataset.slider) this.slide(el); });
    $('#panel').addEventListener('pointerdown', e => { if (e.target.type === 'range') this.dragging = true; });
    window.addEventListener('pointerup', () => { if (this.dragging) { this.dragging = false; this.renderPanel(); } });
    $('#btnPause').addEventListener('click', () => { this.running = !this.running; this.updBand(); });
    $('#btnSpeed').addEventListener('click', () => { this.speed = this.speed === 1 ? 2 : this.speed === 2 ? 4 : 1; this.updBand(); });
    $('#btnGoals').addEventListener('click', () => this.showGoals());
    $('#cashBox').addEventListener('click', () => this.showAssets());
    $('#btnRank').addEventListener('click', () => this.showRank());
    $('#btnMenu').addEventListener('click', () => this.showMenu());
    $('#branchSel').addEventListener('click', () => { const S = Sim.S; if (!S || S.branches.length < 2) return; S.sel = (S.sel + 1) % S.branches.length; this.renderPanel(); this.updHud(true); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.save(); });
    $('#fatChip').addEventListener('click', () => { if (Sim.S && !this.title) this.vacation(false); });
    this.updBand();
    this.showTitle();
    requestAnimationFrame(t => this.loop(t));
  },

  monthMs() { return 30000 / this.speed; },

  loop(ts) {
    const dt = Math.min(100, ts - (this.last || ts)); this.last = ts;
    const S = Sim.S;
    if (S && !this.title && this.running && !this.modalOn && !this.screenOpen && S.branches.length && !S.over) {
      this.prog += dt / this.monthMs();
      if (this.pendingEv && this.prog >= this.pendingEv.at) { const pe = this.pendingEv; this.pendingEv = null; this.showEvent(pe); }
      if (this.prog >= 1) { this.prog = 0; this.endMonth(); }
    }
    if (this.title) Art.render(ts, (ts / 30000) % 1, this.demoS, this.demoB);
    else if (S) { const b = Sim.branch(); Art.render(ts, S.branches.length ? this.prog : 0.3, S, b, b ? null : 'lot'); }
    if (ts - this.hudT > 200) { this.hudT = ts; this.updHud(); }
    requestAnimationFrame(t => this.loop(t));
  },

  // ---------- 타이틀 ----------
  showTitle() {
    $('#app').classList.add('pre', 'titlemode');
    this.title = true; this.screenOpen = true; $('#hud').style.visibility = $('#hudStats').style.visibility = 'hidden';
    const occ = { stu: 14, intl: 6, junior: 4, creator: 2, expat: 1 };
    this.demoS = { brand: 'CO-LIVING', stage: 1 };
    this.demoB = { id: 'demo', stage: 1, landId: 'A', concept: 'student', size: 'S', status: 'open', occ, sat: 92, budget: {}, upgrades: {} };
    let saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
    if (saved && !saved.family) saved.family = 'shop';
    const sc = $('#screen'); sc.classList.remove('hidden'); sc.style.background = 'transparent';
    sc.innerHTML = `<div class="title-wrap">
      <div class="title-sky"><div class="title-logo"><div class="l1">CO-LIVING<br>TYCOON</div><div class="l2">: SEOUL :</div></div></div>
      <div class="title-form"><div class="title-sub">코리빙 브랜드 1위에 도전하세요</div>
        ${saved && !saved.over ? `<button class="btn y big" id="tContinue">▶ 이어하기 <small style="font-weight:400">${esc(saved.ceo)} 대표 · ${esc(saved.brand)} · ${elapsedStr(saved.month)}</small></button><div class="muted" style="text-align:center;margin:12px 0 0">또는 새로 시작</div>` : ''}
        <div class="tf-card"><label>🏠 건물주 이름</label><input id="tCeo" maxlength="10" placeholder="예: 배아담" value="">
        <label>🏷️ 코리빙 브랜드명</label><input id="tBrand" maxlength="12" placeholder="예: episode" value=""></div>
        <button class="btn big" id="tNew">새 게임 시작</button>
        <div class="ver"><span>🏢 서울 10개 지점</span><span>⭐ 브랜드 Lv.10</span><span>🏆 업계 1위</span></div>
      </div></div>`;
    const cont = $('#tContinue');
    if (cont) cont.onclick = () => { Sim.S = saved; this.startPlay(); };
    $('#tNew').onclick = () => {
      const ceo = $('#tCeo').value.trim() || '배아담';
      const brand = $('#tBrand').value.trim() || 'episode';
      const go = () => this.familyReveal(ceo, brand);
      if (saved && !saved.over) this.modal({ icon: '⚠️', title: '새 게임을 시작할까요?', body: '이전 저장 데이터는 사라져요', buttons: [{ label: '새로 시작', cls: 'r', on: go }, { label: '취소', cls: 'ghost' }] });
      else go();
    };
  },

  familyReveal(ceo, brand) {
    const f = Sim.rollFamily();
    this.modal({ scene: 'fam_' + f.id, icon: '🧬', title: f.name, sub: `${esc(ceo)} 님의 가문 (이 운명으로 태어날 확률 ${f.rate}%)`,
      body: `<div class="fam-desc">"${f.desc}"</div>
        ${f.father !== '-' ? `<div class="row"><span class="k">아버지</span><span class="v">${f.father}</span></div><div class="row"><span class="k">어머니</span><span class="v">${f.mother}</span></div>` : ''}
        <div class="row"><span class="k">상속금 (시작 자본)</span><span class="v pos">${f.money ? fmtMoney(f.money) + '원' : '0원'}</span></div>
        <div class="row"><span class="k">특수능력</span><span class="v">${f.skill}</span></div>
        <div class="muted" style="text-align:right">${f.eff}</div>`,
      buttons: [{ label: '이 운명으로 시작한다', cls: 'y', on: () => { Sim.newGame(ceo, brand, f.id); this.startPlay(true); } }] });
  },

  startPlay(fresh) {
    $('#app').classList.remove('titlemode');
    this.title = false; this.screenOpen = false; this.prog = 0; this.pendingEv = null; $('#hud').style.visibility = $('#hudStats').style.visibility = '';
    const sc = $('#screen'); sc.classList.add('hidden'); sc.style.background = ''; sc.innerHTML = '';
    this.tab = 'home'; this.renderPanel(true); this.updHud(true);
    if (fresh) this.intro();
    else if (Sim.S.stageStatus === 'select' && !Sim.S.branches.length) this.openSelect();
    this.save();
  },

  coo(lines, done) {
    const S = Sim.S; const L = lines.slice();
    const next = () => {
      const l = L.shift(); if (!l) { done && done(); return; }
      this.modal({ coo: l.replace(/\{ceo\}/g, esc(S.ceo)).replace(/\{brand\}/g, esc(S.brand)), buttons: [{ label: L.length ? '다음 ▶' : '좋아요!', on: next }] });
    };
    next();
  },

  intro() {
    const S = Sim.S; const f = Sim.fam();
    this.coo([
      '<b>{ceo} 대표님</b>, {brand} 창업을 축하드려요! 저는 COO <b>로제</b>예요',
      '우리는 건물을 짓고 파는 회사가 아니에요<br>입주자를 모으고, 커뮤니티를 운영하고, <b>브랜드를 키우는</b> 코리빙 운영사죠',
      '최종 목표는 <b>서울 10개 지점 · 브랜드 레벨 10 · 업계 1위</b>예요',
      `${f.name} 출신이시네요. 시작 자본은 <b>${S.cash ? fmtMoney(S.cash) : '0원'}</b>, 은행 대출은 <b>${fmtMoney(S.loanCap)}</b>까지 돼요<br>착공할 땐 <b>건축 PF 대출</b>로 건설비의 70%를 더 빌릴 수 있어요`,
      '첫 무대는 <b>신촌</b>이에요<br>후보지 5곳 중 딱 한 곳만 고를 수 있으니 신중하게!',
    ], () => this.offerJob());
  },

  // ---------- 창업 전 아르바이트 (첫 시작 전에만, 1번) ----------
  offerJob() {
    const S = Sim.S;
    if (S.jobDone || S.branches.length) { this.openSelect(); return; }
    this.modal({ scene: 'burger_shop', icon: '🍔', title: '창업 전 아르바이트',
      body: `종잣돈이 조금이라도 더 있으면 든든하겠죠?<br><span class="muted">주문표대로 재료를 쌓아 버거를 완성하세요. 레벨이 오를수록 주문이 복잡해지고 보상도 커져요</span>`,
      buttons: [
        { label: '🍔 햄버거 알바 하기', cls: 'y', on: () => { S.jobDone = true; Burger.start(pay => this.jobResult(pay)); } },
        { label: '바로 사업 시작', cls: 'ghost', on: () => { S.jobDone = true; this.openSelect(); } },
      ] });
  },
  jobResult(pay) {
    const S = Sim.S; S.cash += pay; S.jobPay = pay; this.updHud(true); this.save();
    this.modal({ icon: pay ? '💰' : '😅', title: pay ? '알바 정산 완료!' : '알바 실패…', sub: '창업 전 아르바이트',
      body: pay ? `땀 흘려 번 종잣돈 <b class="pos">+${fmtMoney(pay)}</b><br>시작 자본이 <b>${fmtMoney(S.cash)}</b>이 됐어요` : '한 레벨도 통과하지 못했어요. 그래도 좋은 경험이었어요',
      buttons: [{ label: '이제 사업 시작!', cls: 'y', on: () => this.openSelect() }] });
  },

  // ---------- 부지 선정 ----------
  openSelect() {
    const S = Sim.S;
    if (Sim.fam().reveal && !(S.surveys[S.stage] || {})._free) {
      // 건물주 가문: 후보지마다 건물 정보 2개 무료 공개
      S.surveys[S.stage] = S.surveys[S.stage] || {};
      STAGES[S.stage - 1].lands.forEach(l => {
        const got = S.surveys[S.stage][l.id] = S.surveys[S.stage][l.id] || [];
        const left = [0, 1, 2, 3, 4].filter(i => !got.includes(i));
        for (let k = 0; k < 2 && left.length; k++) got.push(left.splice(Math.floor(Math.random() * left.length), 1)[0]);
      });
      S.surveys[S.stage]._free = true;
    }
    this.screenOpen = true;
    this.sel = { step: 0, landId: null, concept: null, size: null, grade: 'std', borrow: 0 };
    this.renderSelect();
  },

  // ---------- 행운 이벤트: 현금이 마이너스가 되면 (게임 전체 딱 2번) ----------
  luckCheck(rep) {
    const S = Sim.S; const n = S.lucks || 0;
    if ((!rep || !rep.neg) && S.cash >= 0 || n >= 2) return false;
    S.lucks = n + 1;
    const give = (amt, after) => () => { S.cash += amt; if (after) after(); this.updHud(true); this.renderPanel(); this.save(); };
    if (n === 0) {
      this.modal({ hideFx: true, scene: 'playground', icon: '🛝', title: '사업이 힘들어 찾은 놀이터', sub: `${esc(S.ceo)} 대표 · 현금 ${fmtMoney(S.cash)}`,
        body: '통장은 마이너스, 머리는 복잡해요. 밤늦게 동네 놀이터에 혼자 앉았어요<br>무엇을 할까요?',
        buttons: [
          { label: '모래밭을 파본다', cls: 'choice', on: give(LUCK_SAND, () => this.modal({ scene: 'gold', icon: '🪙', title: '모래밭에서 금괴 발견!', body: `손끝에 딱딱한 게 걸렸어요. 오래전 누군가 묻어둔 금괴였어요<br>법적 절차를 거쳐 <b class="pos">${fmtMoney(LUCK_SAND)}</b>이 대표님 몫으로 확정됐어요`, buttons: [{ label: '이게 꿈이야 생시야!', cls: 'y' }] })) },
          { label: '미끄럼틀을 타본다', cls: 'choice', on: give(LUCK_SLIDE, () => { S.fatigue = clamp((S.fatigue || 0) - 30, 0, 100); this.modal({ scene: 'slide', icon: '🎟️', title: '미끄럼틀 아래의 복권', body: `동심으로 돌아가 미끄럼틀을 탔더니 마음이 가벼워졌어요<br>내려오는 순간 발밑에 떨어진 복권 한 장… 확인해 보니 1등!<br><b class="pos">${fmtMoney(LUCK_SLIDE)}</b> 당첨 · 피로도도 확 풀렸어요`, buttons: [{ label: '인생 모르는 거네!', cls: 'y' }] }); }) },
        ] });
    } else {
      this.modal({ hideFx: true, scene: 'oldman', icon: '🚇', title: '지하철에서 넘어진 노인', sub: `${esc(S.ceo)} 대표 · 현금 ${fmtMoney(S.cash)}`,
        body: '투자자 미팅에 늦어 지하철로 달려가는데, 앞에서 노신사가 넘어져 일어나지 못해요<br>어떻게 할까요?',
        buttons: [
          { label: '미팅은 포기하고 직접 병원까지 모신다', cls: 'choice', on: give(LUCK_HELP, () => this.modal({ scene: 'oldman', icon: '👴', title: '미국 최고 부자의 보답', body: `며칠 뒤 연락이 왔어요. 그 노신사는 미국 최고 부자였어요<br>"자기 일을 제쳐두고 날 도운 젊은이에게 보답하고 싶네" — <b class="pos">${fmtMoney(LUCK_HELP)}</b>을 보내왔어요`, buttons: [{ label: 'Thank you, sir!', cls: 'y' }] })) },
          { label: '근처 역무원에게 도움을 요청한다', cls: 'choice', on: give(LUCK_STAFF, () => this.modal({ scene: 'oldman', icon: '💌', title: '감사 편지와 수표 한 장', body: `역무원과 함께 노신사를 도와드리고 미팅에도 늦지 않았어요<br>몇 주 뒤 미국에서 감사 편지와 함께 <b class="pos">${fmtMoney(LUCK_STAFF)}</b> 수표가 도착했어요. 그분이 미국 최고 부자였대요!`, buttons: [{ label: '세상은 아직 따뜻해', cls: 'y' }] })) },
        ] });
    }
    return true;
  },

  // ---------- 어워드 수상 ----------
  award(title, prize) {
    const S = Sim.S; S.cash += prize; S.awards = (S.awards || 0) + 1;
    this.modal({ scene: 'end_award', icon: '🏆', title, sub: `${esc(S.brand)} · 브랜드 Lv.${Sim.lvl()}`,
      body: `${esc(S.ceo)} 대표가 시상대에 올랐어요!<br>상금 <b class="pos">+${fmtMoney(prize)}</b>`, buttons: [{ label: '감사합니다!', cls: 'y' }] });
  },
  closeSelect() { this.screenOpen = false; const sc = $('#screen'); sc.classList.add('hidden'); sc.innerHTML = ''; this.renderPanel(); },

  hiddenLabel(i, v) {
    if (HIDDEN_GOOD_HIGH[i]) return v >= 70 ? ['높음', 'good'] : v >= 50 ? ['보통', ''] : ['낮음', 'bad'];
    return v < 30 ? ['낮음', 'good'] : v < 60 ? ['보통', ''] : ['높음', 'bad'];
  },

  renderSelect() {
    const S = Sim.S, st = STAGES[S.stage - 1], s = this.sel, sc = $('#screen');
    sc.classList.remove('hidden');
    const avail = S.loanCap - S.loan;
    const used = S.branches.filter(b => b.stage === S.stage).map(b => b.landId);
    const NAMES = ['부지 선정', '컨셉 선택', '객실 규모', '건물 등급', '자금 계획'];
    const head = `<div class="scr-head"><div class="stg">STAGE ${S.stage} · ${st.area}${st.multi ? ` · 지점 ${S.branches.length}/${STAGE8_GOAL_BRANCHES}` : ''}</div>
      <h2>${NAMES[s.step]}</h2><p>${st.title}</p>
      <div class="money"><span class="badge y">현금 ${fmtMoney(S.cash)}</span><span class="badge">은행 대출 가능 ${fmtMoney(avail)}</span>${Sim.fam().reveal ? '<span class="badge l">부동산 감각 · 건물 정보 일부 공개</span>' : ''}</div>
      <div class="steps">${NAMES.map((_, i) => `<i class="${i <= s.step ? 'on' : ''}"></i>`).join('')}</div></div>`;
    let body = '', foot = '';
    const land = s.landId ? st.lands.find(l => l.id === s.landId) : null;
    if (s.step === 0) {
      body = st.lands.map(l => {
        const sv = ((S.surveys[S.stage] || {})[l.id]) || [];
        const hs = HIDDEN_NAMES.map((n, i) => {
          if (!sv.includes(i)) return `<span>${n} <b>???</b></span>`;
          const [t, c] = this.hiddenLabel(i, l.hidden[i]); return `<span>${n} <b class="${c === 'good' ? 'pos' : c === 'bad' ? 'neg' : ''}">${t}</b></span>`;
        }).join('');
        const isUsed = used.includes(l.id);
        return `<div class="land ${s.landId === l.id ? 'sel' : ''} ${isUsed ? 'used' : ''}" data-land="${l.id}">
          <div class="ttl"><span class="lt">${l.id}</span><b>${l.name}${isUsed ? ' (운영중)' : ''}</b><span class="price">${fmtMoney(l.price)}</span></div>
          <div class="meta"><div>수요 <b>${l.demand}</b><div class="bar" style="margin-top:2px"><i style="width:${l.demand}%"></i></div></div><div>예상 월세 <b>${l.rent}만원</b><div class="muted">${l.school ? '🎓학교 ' : ''}${l.transit ? '🚇역세권' : ''}</div></div></div>
          <div class="pc">${l.pros.map(p => `<span class="p">+ ${p}</span>`).join('  ')} ${l.cons.map(p => `<span class="c">- ${p}</span>`).join('  ')}</div>
          <div class="pc muted">주요 수요: ${SEGS.map((k, i) => [k, l.seg[i]]).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => SEG_INFO[x[0]].name).join(' · ')}</div>
          <div class="hid"><div class="hs">${hs}</div>
          <div class="survey"><span>건물 정보는 운영하며 매달 하나씩 공개돼요</span>${sv.length < 5 && !isUsed ? `<button class="btn ghost" data-survey="${l.id}" style="padding:4px 8px;font-size:11px">🔍 실사 ${SURVEY_COST}만</button>` : ''}</div></div>
        </div>`;
      }).join('');
      foot = `${S.branches.length ? '<button class="btn ghost" data-nav="close">나중에</button>' : ''}<button class="btn y big" data-nav="next" ${s.landId ? '' : 'disabled'}>이 부지로 결정 ▶</button>`;
    } else if (s.step === 1) {
      body = Object.entries(CONCEPTS).map(([id, c]) => `<div class="opt ${s.concept === id ? 'sel' : ''}" data-concept="${id}">
        <div class="sw" style="background:${c.wall};border-color:#1e2034"><span style="display:block;width:22px;height:8px;background:${c.sign}"></span></div>
        <div class="tx"><b>${c.name}</b><small>${c.ko} · <span class="eff">${c.eff}</span></small><small>타깃: ${c.segs.map(k => SEG_INFO[k].name).join(', ')}</small></div></div>`).join('')
        + `<div class="muted" style="padding:2px 4px">모든 건물은 코리빙이에요. 컨셉은 타깃 입주민 문의와 만족도(컨셉 적합)에 영향을 줘요</div>`;
      foot = `<button class="btn ghost" data-nav="prev">◀</button><button class="btn y big" data-nav="next" ${s.concept ? '' : 'disabled'}>다음 ▶</button>`;
    } else if (s.step === 2) {
      body = Object.entries(SIZES).map(([id, z]) => {
        const lock = !st.sizes.includes(id) && !(id === 'L' && land.bigLot); const c = Sim.buildCost(S.stage, s.landId, id);
        return `<div class="opt ${s.size === id ? 'sel' : ''} ${lock ? 'locked' : ''}" data-size="${lock ? '' : id}">
          <div class="sw" style="background:#2c6e74;color:#fff;font-size:13px;font-weight:900">${z.rooms}실</div>
          <div class="tx"><b>${z.name} · 기본 건설비 ${fmtMoney(c.build)}</b><small>공사 ${z.months}개월 · 만실 월매출 ${fmtMoney(z.rooms * land.rent)}</small>
          <small>${z.pros.map(p => `<span class="pos">+${p}</span>`).join(' ')} ${z.cons.map(p => `<span class="neg">-${p}</span>`).join(' ')}</small>
          ${lock ? '<small class="neg">🔒 Stage 2부터 해금 (넓은 부지는 가능)</small>' : (id === 'L' && land.bigLot && !st.sizes.includes('L') ? '<small class="pos">넓은 부지 특례로 개발 가능</small>' : '')}</div></div>`;
      }).join('') + `<div class="muted" style="padding:2px 4px">공사 중에는 수익이 없어요. 클리어 목표 월 순이익은 토지+건설비의 연 ${(STAGE_YIELD[S.stage - 1] * 100).toFixed(1)}% 수준이에요. 비싸게 지을수록 목표도 높아져요</div>`;
      foot = `<button class="btn ghost" data-nav="prev">◀</button><button class="btn y big" data-nav="next" ${s.size ? '' : 'disabled'}>다음 ▶</button>`;
    } else if (s.step === 3) {
      const z = SIZES[s.size];
      body = Object.entries(GRADES).map(([id, g]) => {
        const c = Sim.buildCost(S.stage, s.landId, s.size, id); const rent = Math.round(land.rent * g.rent);
        const need = Math.max(0, c.land + c.build - S.cash); const can = need <= avail + c.pf;
        const col = { basic: '#9aa0ad', std: '#d9825b', premium: '#3aa6b9', luxury: '#d9a63a' }[id];
        return `<div class="opt ${s.grade === id ? 'sel' : ''}" data-grade="${id}">
          <div class="sw" style="background:${col};color:#1e2034;font-size:11px;font-weight:900">${'★'.repeat({ basic: 1, std: 2, premium: 3, luxury: 4 }[id])}</div>
          <div class="tx"><b>${g.name} · 건설비 ${fmtMoney(c.build)}</b><small>기준 월세 <span class="eff">${rent}만원</span> · 만실 월매출 ${fmtMoney(z.rooms * rent)} · 만족도 ${g.sat > 0 ? '+' : ''}${g.sat}</small>
          <small>${g.desc}${g.demand < 1 ? ` · 전체 수요 ×${g.demand}` : ''}</small>
          <small>건축 PF 대출 +${fmtMoney(c.pf)}${can ? '' : ' · <span class="neg">자금 부족</span>'}</small></div></div>`;
      }).join('') + `<div class="muted" style="padding:2px 4px">비싼 건물일수록 월세를 높게 받을 수 있지만 대학생 수요는 줄어요. 착공할 때 <b>건축 PF 대출</b>로 건설비의 70%를 추가로 빌릴 수 있어요</div>`;
      foot = `<button class="btn ghost" data-nav="prev">◀</button><button class="btn y big" data-nav="next">다음 ▶</button>`;
    } else {
      const c = Sim.buildCost(S.stage, s.landId, s.size, s.grade); const total = c.land + c.build;
      const av = avail + c.pf;
      const minB = Math.max(0, Math.ceil((total - S.cash) / 10000) * 10000);
      const ok = minB <= av;
      if (!s.borrowInit) { s.borrowInit = true; s.borrow = Math.min(av, minB + 30000); }
      if (s.borrow < minB) s.borrow = Math.min(av, minB);
      if (s.borrow > av) s.borrow = av;
      const after = S.cash + s.borrow - total;
      body = `<div class="card"><h3>개발 비용</h3>
        <div class="row"><span class="k">토지 · ${land.name}</span><span class="v">${fmtMoney(c.land)}</span></div>
        <div class="row"><span class="k">건설 · ${SIZES[s.size].name} ${SIZES[s.size].rooms}실 · ${GRADES[s.grade].name}</span><span class="v">${fmtMoney(c.build)}</span></div>
        <div class="row"><span class="k">컨셉</span><span class="v">${CONCEPTS[s.concept].name}</span></div>
        <div class="row"><span class="k">기준 월세</span><span class="v">${Math.round(land.rent * GRADES[s.grade].rent)}만원</span></div>
        <div class="row" style="border-top:2px dashed #1f5257;margin-top:4px;padding-top:6px"><span class="k">합계</span><span class="v">${fmtMoney(total)}</span></div>${st.multi ? "" : `<div class="row"><span class="k">🎯 이 지점 클리어 목표 (월 순이익)</span><span class="v" style="color:var(--yellow)">${fmtMoney(Sim.targetFor(S.stage, total))}</span></div>`}</div>
        <div class="card"><h3>대출 <small>연 ${Sim.rateYear()}%</small></h3>
        <div class="row"><span class="k">은행 대출 가능</span><span class="v">${fmtMoney(avail)}</span></div>
        <div class="row"><span class="k">건축 PF 대출 (건설비 70%)</span><span class="v pos">+${fmtMoney(c.pf)}</span></div>
        ${ok ? `<div class="slider"><div class="top"><span>이번에 받을 대출</span><b>${fmtMoney(s.borrow)}</b></div>
        <input type="range" id="borrowR" min="${minB}" max="${av}" step="10000" value="${s.borrow}" ${av === minB ? 'disabled' : ''}></div>` : `<div class="neg" style="font-size:12px">자금이 ${fmtMoney(minB - av)} 부족해요. 등급·규모를 낮추거나 기존 지점을 운영해 현금을 모으세요</div>`}
        <div class="fin-big"><div><small>월 이자</small><b class="neg">-${fmtMoney(Math.round((S.loan + s.borrow) * Sim.rate()))}</b><em>대출 총 ${fmtMoney(S.loan + s.borrow)} · 연 ${Sim.rateYear()}%</em></div><div><small>착공 후 남는 현금</small><b class="${after < 3000 ? 'neg' : 'pos'}">${fmtMoney(after)}</b><em>${after < 0 ? '마이너스 통장 사용' : '운영 자금'}</em></div></div>
        <div class="muted">오픈 직후엔 입주자가 적어 적자가 나요. 최소 몇 달 운영비는 남겨두세요. 현금은 마이너스 10억까지 버틸 수 있어요. 그보다 깊으면 비상 대출이 실행되지만, 그런 달이 12개월 연속이면 파산이에요</div></div>`;
      foot = `<button class="btn ghost" data-nav="prev">◀</button><button class="btn y big" data-nav="go" ${ok ? '' : 'disabled'}>🏗 착공!</button>`;
    }
    sc.innerHTML = head + `<div class="scr-body">${body}</div><div class="scr-foot">${foot}</div>`;
    sc.onclick = e => {
      const t = e.target;
      const sv = t.closest('[data-survey]');
      if (sv) {
        e.stopPropagation();
        if (S.cash < SURVEY_COST) { this.toast('현금이 부족해요'); return; }
        Sim.survey(S.stage, sv.dataset.survey); this.renderSelect(); this.toast('🔍 실사 완료 · 건물 정보 2개 공개'); return;
      }
      const ld = t.closest('[data-land]'); if (ld) { s.landId = ld.dataset.land; this.renderSelect(); return; }
      const cp = t.closest('[data-concept]'); if (cp) { s.concept = cp.dataset.concept; this.renderSelect(); return; }
      const sz = t.closest('[data-size]'); if (sz && sz.dataset.size) { s.size = sz.dataset.size; this.renderSelect(); return; }
      const gr = t.closest('[data-grade]'); if (gr) { s.grade = gr.dataset.grade; s.borrowInit = false; this.renderSelect(); return; }
      const nv = t.closest('[data-nav]'); if (!nv || nv.disabled) return;
      const k = nv.dataset.nav;
      if (k === 'close') this.closeSelect();
      else if (k === 'prev') { s.step--; s.borrowInit = false; this.renderSelect(); }
      else if (k === 'next') { s.step++; sc.scrollTop = 0; this.renderSelect(); }
      else if (k === 'go') this.confirmBuild();
    };
    const br = $('#borrowR'); if (br) br.oninput = () => { s.borrow = +br.value; const y = sc.scrollTop; this.renderSelect(); sc.scrollTop = y; };
  },

  confirmBuild() {
    const S = Sim.S, s = this.sel;
    const b = Sim.startBranch(S.stage, s.landId, s.concept, s.size, s.borrow, s.grade);
    this.closeSelect(); this.prog = 0; this.pendingEv = null;
    this.toast(`🏗 ${b.name} 착공! 공사 기간 ${b.buildTotal}개월`);
    this.updHud(true); this.save();
    if (!S.tut) {
      S.tut = 1;
      this.coo(['착공했어요! 공사 중엔 수익이 없어요<br>화면 아래 <b>달력 바</b>가 한 번 차면 한 달이 지나요', '공사가 끝나면 입주자 모집을 시작해야 해요<br>입주는 <b>자동이 아니에요</b> — 마케팅이 필수예요']);
    }
  },

  // ---------- 월 마감 ----------
  endMonth() {
    const S = Sim.S; const prevStage = S.stage; const cash0 = S.cash; const lvl0 = Sim.lvl(); const streak0 = S.streak;
    const rep = Sim.monthTick();
    if (S.showReport !== false && S.branches.some(x => x.last && !x.last.building)) this.monthReport(rep, cash0);
    if (rep.bankWarn) this.modal({ scene: 'bank', icon: '🏦', title: '은행에서 찾아왔어요', sub: `이자 보류 ${rep.bankWarn}회 / ${DEFER_SEIZE}회`,
      body: `"${esc(S.ceo)} 대표님, 이자를 ${rep.bankWarn}번이나 안 내셨네요. 미납 이자 <b class="neg">${fmtMoney(S.unpaid)}</b>에 연체 가산이 붙고 있습니다"<br><br><b class="neg">${DEFER_SEIZE - rep.bankWarn}번 더 보류하면 건물을 압류합니다</b><br><span class="muted">🔧 운영 탭 재무에서 미납 이자를 상환하면 횟수가 초기화돼요</span>`,
      buttons: [{ label: '알겠습니다… 곧 갚을게요', cls: 'r' }] });
    if (rep.seized) this.modal({ scene: 'seize', icon: '🔨', title: '건물이 압류됐어요', sub: rep.seized.name,
      body: `이자를 ${DEFER_SEIZE}번 보류해 은행이 <b>${esc(rep.seized.name)}</b>을 압류했어요<br>건물 가치 ${fmtMoney(rep.seized.invest)} 중 대출 <b>${fmtMoney(rep.seized.offset)}</b>만 상계됐어요<br><span class="muted">입주민과 직원 모두 떠났어요</span>`,
      buttons: [{ label: '뼈아픈 교훈…', cls: 'r' }] });
    const b = Sim.branch();
    this.float((rep.net >= 0 ? '+' : '') + fmtMoney(rep.net), rep.net >= 0 ? '#c6f26b' : '#ff8a8a', 50, 38);
    if (b && b.last && !b.last.building) {
      if (b.last.movein) setTimeout(() => this.float('+' + b.last.movein + ' 입주', '#9be7ff', 35, 55), 300);
      if (b.last.moveout) setTimeout(() => this.float('-' + b.last.moveout + ' 퇴실', '#ffb0b0', 65, 55), 600);
    }
    rep.opened.forEach(o => {
      this.toast(`🎉 ${o.name} 오픈! 입주자 모집 시작`);
      if (S.tut === 1) {
        S.tut = 2;
        this.coo(['드디어 오픈했어요! 이제부터가 진짜예요',
          '<b>📣 마케팅</b> 탭에서 채널을 켜면 문의가 늘어요<br>매달 자동으로 집행되고 비용이 나가요',
          '<b>🔧 운영</b> 탭에서 청소·시설·마케팅·커뮤니티 예산을 배분하세요<br>만족도가 낮으면 재계약이 줄어요',
          '<b>⭐ 브랜드</b> 탭에서 스테이지 목표를 확인할 수 있어요<br>입주율 95% · 만족도 80 · 순이익 목표를 <b>3개월 연속</b> 지키면 클리어!']);
      }
    });
    rep.revealed.forEach(x => {
      const [t] = this.hiddenLabel(x.i, Sim.land(x.b).hidden[x.i]);
      this.toast(`🔍 ${x.b.name} 건물 정보 공개 · ${HIDDEN_NAMES[x.i]} ${t}`);
    });
    if (rep.emergency) this.toast(`⚠️ 현금 부족! 비상 대출 ${fmtMoney(rep.emergency)} 실행`);
    if (S.negMonths > 0) {
      const left = BANKRUPT_MONTHS - S.negMonths;
      if (S.negMonths === 1 || left === 1) this.modal({ icon: '🚨', title: left === 1 ? '파산 직전 · 마지막 경고' : '자금 위기 발생', sub: `위기 ${S.negMonths} / ${BANKRUPT_MONTHS}개월`,
        body: `이번 달 적자가 마이너스 통장 한도(-10억)를 넘었어요${rep.emergency ? `<br>은행 비상 대출 <b class="neg">${fmtMoney(rep.emergency)}</b>로 겨우 메웠어요` : ''}<br><br><b class="neg">이런 달이 ${BANKRUPT_MONTHS}개월 연속이면 파산해요 (남은 기회 ${left}개월)</b><br><span class="muted">월세 조정, 직원·마케팅 비용 절감, 이자 보류 등으로 적자를 -10억 안으로 줄이세요</span>`,
        buttons: [{ label: '정신 바짝 차릴게요', cls: 'r' }] });
      else this.toast(`🚨 자금 위기 ${S.negMonths}/${BANKRUPT_MONTHS}개월 · 비상 대출로 버티는 중`);
    } else if (S.cash < 0) this.toast(`⚠️ 마이너스 통장 사용 중 (${fmtMoney(S.cash)} / 한도 -10억)`);
    if (rep.lvlUp) {
      this.modal({ icon: '⭐', title: `브랜드 레벨 ${rep.lvlUp} 달성!`, sub: BRAND_NAMES[rep.lvlUp], body: (BRAND_PERKS.find(p => p.lv === rep.lvlUp) || { text: '문의 수와 투어 전환율이 올라가요' }).text, buttons: [{ label: '좋아요' }] });
      // 레벨 3부터 어워드 수상 (레벨이 높을수록 상금 ↑, 1천만~5천만)
      if (rep.lvlUp >= 3 && S.stage >= 2) this.award(['', '', '', '신인 코리빙 브랜드상', '서울 주거혁신상', '올해의 커뮤니티상', '대한민국 코리빙 대상', '아시아 주거 디자인상', '서울시장 표창', '대한민국 브랜드 대상', '글로벌 코리빙 어워드'][rep.lvlUp], Math.round((1000 + (rep.lvlUp - 3) / 7 * 4000) / 100) * 100);
    }
    // 매년 12월 연말 시상식 (브랜드 Lv.4+)
    if (S.stage >= 2 && dateOf(S.month - 1).mo === 12 && Sim.lvl() >= 4 && Math.random() < 0.5) this.award('연말 코리빙 어워드 수상', Math.round(rnd(1000, 5000) / 100) * 100);
    if (rep.reval) this.toast(`🏙️ 부동산 재평가 · 자산가치 +${fmtMoney(rep.reval)} · 대출 한도 +${fmtMoney(Math.round(rep.reval * 0.7))}`);
    const tot = S.branches.reduce((a, x) => a + (x.last && !x.last.building ? x.last.movein : 0), 0);
    const out = S.branches.reduce((a, x) => a + (x.last && !x.last.building ? x.last.moveout : 0), 0);
    if (S.showReport === false && S.branches.some(x => x.status === 'open')) this.toast(`📅 ${elapsedStr(S.month - 1)} 결산 · 순이익 ${fmtMoney(rep.net, true)} · 입주 ${tot} / 퇴실 ${out}`);
    if (S.over) {
      this.modal({ icon: '💀', title: '파산했어요', sub: `${S.ceo} 대표의 도전은 여기까지`, body: '마이너스 통장 한도(-10억)를 넘는 적자가 12개월 연속 이어졌어요<br>비상 대출로도 더는 버틸 수 없어요<br>무리한 대출이나 낮은 입주율을 조심하세요', buttons: [{ label: '처음부터 다시', cls: 'y', on: () => { localStorage.removeItem(SAVE_KEY); this.showTitle(); } }] });
      localStorage.removeItem(SAVE_KEY); return;
    }
    if (rep.stage && rep.stage.cleared) this.stageClear(rep.stage.cleared);
    if (rep.wage) this.toast(`💼 ${dateOf(S.month).y}년 연봉 협상 · 지점별 근속 1년마다 월급 +${Math.round(WAGE_RAISE * 100)}% · 경력이 쌓여 능력 +5%`);
    if (rep.stage && rep.stage.won) { this.playEnding(); return; }
    if (rep.bigProfit) this.modal({ icon: '💡', title: '월 순이익 1억 돌파!', sub: '이제 진짜 기업이에요', body: '회사가 커져서 앞으로는 <b>건물 전기·수도 요금</b>이 매달 각 지점 비용으로 나가고, <b>매년 3월 법인세</b>(직전 1년 순이익에 누진세율 9~24% + 지방소득세 10%)를 내야 해요', buttons: [{ label: '알겠어요' }] });
    if (rep.tax) this.modal({ icon: '🧾', title: '법인세 납부', sub: `${dateOf(S.month).y}년 3월 · 누진세율 9~24% + 지방소득세`, body: `직전 1년 순이익 ${fmtMoney(rep.taxBase)}에 대한 법인세 <b class="neg">-${fmtMoney(rep.tax)}</b>을 냈어요`, buttons: [{ label: '성실 납세 완료' }] });
    (rep.reno || []).forEach(b => {
      const base = b.buildCost || Math.round((b.invest || 0) * 0.5);
      const cost = Math.round(base * rnd(0.05, 0.10) / 100) * 100; const yrs = Math.round(b.monthsOpen / 12);
      b.renoNext = b.monthsOpen + 6;
      this.modal({ hideFx: true, scene: 'reno', icon: '🛠️', title: '인테리어 리뉴얼 시기', sub: `${esc(b.name)} · 준공 ${yrs}년차`,
        body: `건물이 지은 지 ${yrs}년이 됐어요. 공용부와 객실 인테리어가 낡아 부분 리뉴얼이 필요해요<br><span class="muted">공사비는 처음 건설비의 5~10% 수준이에요</span>`,
        buttons: [
          { label: '부분 리뉴얼 공사 진행', cls: 'choice y', sub: `비용 ${fmtMoney(cost)} · 시설 상태 100 회복 · 만족도 +3 · 외관 디자인이 바뀌어요`, on: () => {
            S.cash -= cost; b.reno = (b.reno || 0) + 1; b.renoNext = b.monthsOpen + RENO_YEARS * 12; b.cond = 100; b.sat = clamp(b.sat + 3, 0, 100);
            this.toast(`🛠️ ${b.name} 리뉴얼 완료 · 새 단장!`); this.updHud(true); this.renderPanel(); } },
          { label: '6개월 뒤로 미룬다', cls: 'choice', sub: '시설 상태 -20 · 만족도 -5', on: () => { b.cond = clamp(b.cond - 20, 0, 100); b.sat = clamp(b.sat - 5, 0, 100); } },
        ] });
    });
    if (!this.milestones() && !this.bizNews() && !this.luckCheck(rep) && !this.investOffer() && !this.lifeExtra()) this.ceoEvents();
    const ev = Sim.rollDisaster() || Sim.rollEvent(); this.pendingEv = ev ? { ...ev, at: rnd(0.25, 0.8) } : null;
    if (!this.dragging) this.renderPanel();
    this.updHud(true); this.save();
  },

  // ---------- 대표 총 자산(보유 자산) 마일스톤 ----------
  milestones() {
    const S = Sim.S; const assets = S.cash + S.branches.reduce((a, b) => a + (b.invest || 0), 0);
    if (this.rankReward('brand') || this.rankReward('ceo')) return true;
    if (assets >= 10000000 && !S.ms1000) {
      S.ms1000 = S.month; S.brandXP += 20;
      this.modal({ scene: 'ny_news', icon: '🗽', title: '뉴욕 경제 뉴스에 등장', sub: `총 자산 ${fmtMoney(assets)}`,
        body: `"Seoul's co-living king" — 뉴욕 경제 채널이 ${esc(S.ceo)} 대표를 아시아의 떠오르는 자산가로 소개했어요<br><b class="pos">브랜드 +20</b>`, buttons: [{ label: '세계가 주목한다!', cls: 'y' }] });
      return true;
    }
    if (assets >= 30000000 && !S.ms3000) {
      S.ms3000 = S.month; S.cash -= AUDIT_FINE;
      this.modal({ scene: 'tax_audit', icon: '🕵️', title: '국세청 세무조사', sub: `총 자산 ${fmtMoney(assets)} 돌파 직후`,
        body: `급성장한 회사에 국세청 특별 세무조사가 나왔어요. 몇 년 치 장부를 모두 가져갔어요<br>조사 결과 추징금 <b class="neg">-${fmtMoney(AUDIT_FINE)}</b>이 부과됐어요<br><span class="muted">현금이 부족하면 마이너스 통장과 비상 대출로 메워야 해요</span>`,
        buttons: [{ label: '…납부하겠습니다', cls: 'r' }] });
      this.updHud(true);
      return true;
    }
    if (assets >= 50000000 && !S.ms5000) {
      S.ms5000 = S.month; S.brandXP += SUMMIT_XP;
      this.modal({ scene: 'summit', icon: '🌏', title: '세계정상회담 기업가 대표 초청', sub: `총 자산 ${fmtMoney(assets)}`,
        body: `${esc(S.ceo)} 대표가 세계정상회담에 한국 기업가 대표로 참석해 "도시 주거의 미래"를 발표했어요<br>전 세계 언론에 소개되며 <b class="pos">브랜드 인지도 +${SUMMIT_XP}</b>`, buttons: [{ label: '역사적인 순간!', cls: 'y' }] });
      return true;

  // 순위가 처음으로 올라갈 때 리워드 (4위 1억 · 3위 2억 · 2위 5억 · 1위 10억)
  rankReward(kind) {
    const S = Sim.S; const r = kind === 'brand' ? Sim.rank().me : Sim.ceoRank().me;
    // 첫 결산 때의 순위를 출발점으로 기록 (가문 상속금만으로 받는 리워드 방지)
    if (!S.rankBest || !S.rankInit) { S.rankBest = { brand: Sim.rank().me, ceo: Sim.ceoRank().me }; S.rankInit = true; return false; }
    const best = S.rankBest[kind]; if (r >= best) return false;
    S.rankBest[kind] = r;
    const tiers = Object.keys(RANK_REWARDS).map(Number).filter(t => t >= r && t < best);
    const prize = tiers.reduce((a, t) => a + RANK_REWARDS[t], 0);
    if (!prize) return false;
    S.cash += prize; this.updHud(true);
    const brand = kind === 'brand';
    this.modal({ scene: 'end_award', icon: r === 1 ? '👑' : '🏅', title: brand ? `브랜드 순위 ${r}위 달성!` : `CEO 순자산 순위 ${r}위 달성!`,
      sub: brand ? `${esc(S.brand)} · 코리빙 업계 랭킹` : `${esc(S.ceo)} 대표 · 부자 랭킹`,
      body: `${brand ? `${esc(S.brand)}가 코리빙 브랜드 순위 <b>${r}위</b>에 올랐어요` : `${esc(S.ceo)} 대표가 업계 CEO 순자산 순위 <b>${r}위</b>에 올랐어요`}<br>순위 상승 리워드 <b class="pos">+${fmtMoney(prize)}</b>${r > 1 ? `<br><span class="muted">다음 목표: ${r - 1}위 리워드 ${fmtMoney(RANK_REWARDS[r - 1])}</span>` : ''}`,
      buttons: [{ label: r === 1 ? '정상에 섰다!' : '더 높이 간다!', cls: 'y' }] });
    return true;
  },

        body: dataBr.length
          ? `AI 로봇이 집집마다 보급되면서 "사람이 실제로 사는 공간" 데이터 수요가 폭발했어요<br>미리 공간 데이터 연구를 해둔 ${dataBr.length}개 지점의 <b class="pos">AI 데이터 제휴 수익이 200%(2배)</b>로 뛰어요`
          : 'AI 로봇이 집집마다 보급되면서 실제 주거 공간 데이터 몸값이 폭등했어요<br><span class="muted">공간 데이터 연구를 미리 해뒀다면 큰 기회였을 텐데… 지금 개발해도 이번 특수는 놓쳤어요</span>',
        buttons: [{ label: dataBr.length ? '미리 해두길 잘했다!' : '아쉽다…', cls: 'y' }] });

    if (S.stage >= 7 && !S.newsAI2) {

      this.modal({ scene: 'ai_deal', icon: '🌐', title: '글로벌 AI 기업과 제휴 협약', sub: '공간 데이터 파트너십',
        body: dataBr.length
          ? `세계적인 AI 기업이 ${esc(S.brand)}의 공간 데이터에 주목했어요<br>· 공동 연구 투자금 <b class="pos">+${fmtMoney(AI_GRANT)}</b> 입금<br>· 입주 공간에 그 회사 AI 제품을 도입하고 수수료를 받아 <b class="pos">공간 데이터 수익 150%(1.5배)</b> 추가`
          : '글로벌 AI 기업이 서울 코리빙 공간 데이터 파트너를 찾았지만, 데이터를 쌓아둔 다른 회사와 계약했어요<br><span class="muted">공간 데이터 연구를 해둔 지점이 하나라도 있었다면…</span>',
        buttons: [{ label: dataBr.length ? '협약 체결!' : '다음 기회를…', cls: 'y' }] });
      this.updHud(true);
      return true;
    }
    S.adDeals = S.adDeals || [];
    if (adsBr.length && S.stage >= 2 && S.stage <= 4 && S.adDeals.length < 2 && Math.random() < (S.stage === 4 ? 0.3 : 0.08)) {
      const pool = [{ kind: 'sport', brand: '스포츠 브랜드 「스트라이드」', ico: '👟' }, { kind: 'fashion', brand: '유명 의류 브랜드 「모노그램 서울」', ico: '👕' }];
      const d = S.adDeals.length ? pool.find(p => p.kind !== S.adDeals[0].kind) : pick(pool);
      S.adDeals.push({ kind: d.kind, until: S.month + 24 });
      this.modal({ scene: 'ad_' + d.kind, icon: d.ico, title: '2년 광고 계약 체결!', sub: d.brand,
        body: `${d.brand}가 ${esc(S.brand)} 입주민(20~30대)을 겨냥해 엘리베이터 광고를 2년간 독점 집행해요<br>앞으로 24개월간 <b class="pos">광고 수익 120%(1.2배)</b>${S.adDeals.length === 2 ? '<br><span class="muted">두 계약이 겹치는 동안은 효과가 함께 적용돼요</span>' : ''}`,
        buttons: [{ label: '계약 체결!', cls: 'y' }] });
      return true;
    }
    return false;
  },

  // ---------- 싱가포르 투자 유치 (게임 중 단 1번) ----------
  investOffer() {
    const S = Sim.S; if (S.sgDone) return false;
    const open = S.branches.filter(b => b.status === 'open');
    if (S.stage < 4 || Sim.lvl() < 3 || !open.length || S.lastNet <= 0) return false;
    const sat = open.reduce((a, b) => a + b.sat, 0) / open.length; if (sat < 75) return false;
    S.sgDone = 'offered';
    this.modal({ scene: 'singapore', icon: '🇸🇬', title: '싱가포르 투자사의 제안', sub: '단 한 번의 기회 · 시리즈 A',
      body: `아시아 코리빙 시장을 노리는 싱가포르 투자사가 ${esc(S.brand)}에 <b class="pos">${fmtMoney(SG_INVEST)}</b> 투자를 제안했어요<br><br>
        <b>받는 것</b><br>· 투자금 ${fmtMoney(SG_INVEST)} · 은행 신용 상승으로 대출 한도 +${fmtMoney(SG_INVEST)} · 브랜드 +20<br>
        <b>내주는 것</b><br>· 지분 ${Math.round(SG_STAKE * 100)}% · 기관 투자를 받을 수준의 회사 체계 구축 필요<br>
        <b class="neg">· 법인 재설립·법무/회계 실사·ERP·본사 이전 ${fmtMoney(SG_SETUP)} (일시)</b><br>
        <b class="neg">· CFO·재무·법무팀, 외부감사, IR 등 본사 운영비 월 ${fmtMoney(SG_HQ)} (매달)</b><br><br>
        <span class="muted">거절하면 이 기회는 다시 오지 않아요</span>`,
      buttons: [
        { label: '투자 유치 수락', cls: 'y', sub: `순유입 ${fmtMoney(SG_INVEST - SG_SETUP)} · 이후 매달 -${fmtMoney(SG_HQ)}`, on: () => {
          S.sgDone = 'accepted'; S.cash += SG_INVEST - SG_SETUP; S.loanCap += SG_INVEST; S.brandXP += 20; S.hqCost = SG_HQ; S.stake = SG_STAKE;
          this.modal({ scene: 'singapore', icon: '🥂', title: '투자 유치 완료!', sub: `${esc(S.brand)} 시리즈 A`, body: `${fmtMoney(SG_INVEST)} 입금 · 회사 체계 구축비 ${fmtMoney(SG_SETUP)} 지출<br>이제 본사 운영비 월 ${fmtMoney(SG_HQ)}이 나가요. 투자금으로 빠르게 확장하세요`, buttons: [{ label: '확장 개시!' }] });
          this.updHud(true); this.renderPanel(); this.save(); } },
        { label: '정중히 거절 (지분 100% 유지)', cls: 'ghost', on: () => { S.sgDone = 'declined'; this.toast('투자 제안을 거절했어요. 우리 힘으로 간다!'); } },
      ] });
    return true;
  },

  // ---------- 가족 · 공간 대관 · 아이돌 이벤트 ----------
  lifeExtra() {
    const S = Sim.S; S.famDone = S.famDone || []; S.famSkip = S.famSkip || []; S.rentals = S.rentals || [];
    const f = S.fatigue || 0;
    // 1) 아이돌 데이트 사실이 결혼 후 드러남 → 합의 이혼
    if (S.datedIdol && S.married && !S.scandalDone) {
      if (!S.scandalAt) S.scandalAt = S.month + 3 + Math.floor(Math.random() * 4);
      if (S.month >= S.scandalAt) {
        S.scandalDone = true;
        this.modal({ scene: 'scandal', icon: '📰', title: '열애 보도 · 합의 이혼', sub: '연예 뉴스 단독',
          body: `"코리빙 CEO ${esc(S.ceo)}, 아이돌과 비밀 데이트" 사진이 보도됐어요<br>배우자와 긴 대화 끝에 합의 이혼하기로 했어요<br>위자료 <b class="neg">-${fmtMoney(ALIMONY_IDOL)}</b>`,
          buttons: [{ label: '…모두 내 잘못이에요', cls: 'r', on: () => this.divorce(ALIMONY_IDOL, '아이돌 스캔들 합의 이혼') }] });
        return true;
      }
    }
    // 2) 아이돌의 데이트 신청 (화보 촬영 1~3개월 뒤)
    if (S.idolAsk && !S.idolAsked && S.month >= S.idolAsk) {
      S.idolAsked = true;
      this.modal({ hideFx: true, scene: 'idol_date', icon: '💌', title: '아이돌의 데이트 신청', sub: '화보 촬영 때 만난 그 아이돌',
        body: `화보 촬영 때 인사를 나눈 아이돌 멤버가 DM을 보냈어요<br>"대표님, 그때 정말 멋지셨어요. 혹시 저녁 같이 하실래요?"${S.married ? '<br><span class="muted">대표님은 결혼한 상태예요</span>' : ''}`,
        buttons: [
          { label: '데이트 신청을 수락한다', cls: 'choice', sub: 'CEO 피로도 0', on: () => { S.fatigue = 0; S.datedIdol = S.month; this.toast('💘 꿈같은 저녁… 피로가 싹 풀렸어요'); this.updHud(true); } },
          { label: '정중하게 거절한다', cls: 'choice', on: () => { this.toast('🙇 일에 집중하기로 했어요'); } },
        ] });
      return true;
    }
    // 2-b) 스테이지가 오를수록 나오는 어려운 경영 결정 (각 1회)
    if (this.stageDecision()) return true;
    // 3) 공간 대관 (게임 전체 3회: 아이돌 화보 · 뮤직비디오 · 방송)
    const open = S.branches.filter(b => b.status === 'open');
    const left = RENTALS.filter(r => !S.rentals.includes(r.id));
    if (open.length && left.length && S.month >= 6 && Math.random() < 0.05) {
      const r = pick(left); const b = pick(open); const fee = Math.round(rnd(1000, 3000) / 100) * 100;
      S.rentals.push(r.id);
      this.modal({ hideFx: true, scene: r.scene, icon: r.icon, title: `공간 대관 요청 · ${r.name}`, sub: b.name,
        body: `${r.text}<br>라운지와 루프탑을 하루 빌려달라고 해요`,
        buttons: [
          { label: '대관 수락', cls: 'choice y', sub: `대관료 +${fmtMoney(fee)} · 브랜드 +5 · 그날 입주민 불편으로 만족도 -1`, on: () => {
            S.cash += fee; S.brandXP += 5; b.sat = clamp(b.sat - 1, 0, 100);
            if (r.id === 'idol') S.idolAsk = S.month + 1 + Math.floor(Math.random() * 3);
            this.updHud(true); } },
          { label: '입주민을 위해 거절', cls: 'choice', sub: '만족도 +1', on: () => { b.sat = clamp(b.sat + 1, 0, 100); } },
        ] });
      return true;
    }
    // 4) 가족 이벤트 (결혼 후, 각 1회 · 3개 이상 소홀하면 이혼)
    if (S.married && S.month - S.married >= 6 && Math.random() < 0.07) {
      const kids = S.kids || 0;
      const pool = FAMILY_EVENTS.filter(e => !S.famDone.includes(e.id) && !S.famSkip.includes(e.id) && (!e.kid || kids) && S.month - S.married >= e.after && (!e.kidAge || S.month - (S.kidAt || S.month) >= e.kidAge));
      if (pool.length) {
        const e = pick(pool);
        const done = (cost, fat) => () => { S.cash -= cost; S.ceoSpent = (S.ceoSpent || 0) + cost; S.famDone.push(e.id); if (fat) S.fatigue = clamp(f + fat, 0, 100); this.updHud(true); };
        const skip = () => { S.famSkip.push(e.id); if (S.famSkip.length >= 3) this.mq.push({ scene: 'divorce', icon: '💔', title: '이혼 소송', sub: '가족에게 소홀했던 대가', body: `"당신은 회사만 사랑했어"<br>가족 행사를 ${S.famSkip.length}번이나 챙기지 않아 배우자가 이혼 소송을 냈어요<br>위자료와 자녀 양육 일시금 <b class="neg">-${fmtMoney(ALIMONY_BIG + kids * ALIMONY_KID)}</b>`, buttons: [{ label: '…돌이킬 수 없어요', cls: 'r', on: () => this.divorce(ALIMONY_BIG + kids * ALIMONY_KID, '가족 소홀로 인한 이혼') }] }); };
        this.modal({ hideFx: true, scene: e.scene, icon: e.icon, title: e.title, sub: `가족 이벤트 · 챙기지 못한 행사 ${S.famSkip.length}/3`,
          body: e.text(S), buttons: e.opts.map(o => o.skip
            ? { label: o.label, cls: 'choice', sub: '가족 실망 · 3번 쌓이면 이혼', on: skip }
            : { label: o.label, cls: 'choice', sub: `비용 ${fmtMoney(o.cost)}${o.fat ? ' · 피로도 ' + (o.fat > 0 ? '+' : '') + o.fat : ''} · 가족 행복`, on: done(o.cost, o.fat) }) });
        return true;
      }
    }
    return false;
  },
  stageDecision() {
    const S = Sim.S; S.decided = S.decided || [];
    const open = S.branches.filter(b => b.status === 'open'); if (!open.length || Math.random() > 0.06) return false;
    const can = id => !S.decided.includes(id);
    const big = open.slice().sort((a, c) => Sim.rooms(c) - Sim.rooms(a))[0];
    if (S.stage >= 3 && can('corpLease')) {
      S.decided.push('corpLease');
      this.modal({ hideFx: true, scene: 'corp', icon: '🏢', title: '대기업 통임대 제안', sub: big.name,
        body: `대기업 인사팀이 ${esc(big.name)} 객실 40%를 2년간 통째로 빌리겠대요. 대신 월세를 크게 깎아 달래요<br><span class="muted">빈방 걱정은 사라지지만 커뮤니티 분위기가 달라질 수 있어요</span>`,
        buttons: [
          { label: '계약한다', cls: 'choice', sub: '빈방 즉시 채움 · 지점 월세 -12% (24개월) · 만족도 -4', on: () => {
            const add = Math.min(Sim.rooms(big) - Sim.occ(big), Math.round(Sim.rooms(big) * 0.4)); big.occ.junior += add; Sim.addMod(big, 'rent', null, 0.88, 24); big.sat = clamp(big.sat - 4, 0, 100); this.renderPanel(); } },
          { label: '정중히 거절', cls: 'choice', sub: '변화 없음', on: () => {} },
        ] });
      return true;

    if (S.stage >= 4 && can('union')) {

      this.modal({ hideFx: true, scene: 'quit', icon: '✊', title: '직원 노조 결성', sub: '전 지점 직원 대표',
        body: '직원들이 노조를 만들고 임금 10% 인상과 휴게 공간을 요구해요',

        ] });
      return true;
    }
    if (S.stage >= 5 && can('rentCap')) {
      S.decided.push('rentCap');
      this.modal({ hideFx: true, scene: 'press', icon: '⚖️', title: '임대료 상한제 시행', sub: '정부 정책 발표',
        body: '청년 주거비 부담을 줄이려고 정부가 공유주거 월세 인상 상한제를 도입한대요. 업계가 대응을 고민하고 있어요',
        buttons: [
          { label: '선제적으로 따른다', cls: 'choice', sub: '모든 지점 월세 기준가 +15% 상한 · 정부 인증으로 이후 클리어 목표 -15% · 브랜드 +30', on: () => { S.rentCap = 1.15; S.targetMul = 0.85; S.branches.forEach(b => { if (b.rentF > 1.15) b.rentF = 1.15; }); S.brandXP += 30; this.renderPanel(); } },
          { label: '법무법인을 써서 예외를 인정받는다', cls: 'choice', sub: `비용 ${fmtMoney(150000)} · 월세 자유 유지 · 브랜드 -40 (여론 악화)`, on: () => { S.cash -= 150000; S.brandXP = Math.max(0, S.brandXP - 40); } },
        ] });
      return true;
    }
    if (S.stage >= 6 && can('acquire')) {
      const c = S.competitors.slice().sort((a, d) => Sim.compScore(a) - Sim.compScore(d))[0];
      S.decided.push('acquire');
      this.modal({ hideFx: true, scene: 'corp', icon: '🤝', title: `경쟁 브랜드 「${c.name}」 인수 제안`, sub: '업계 재편',

          { label: '지켜본다', cls: 'choice', sub: '다른 회사가 인수해 그 경쟁사가 더 커져요', on: () => { c.asset = Math.round(c.asset * 1.6); c.g *= 1.3; } },
        ] });

    if (S.stage >= 7 && can('rateHike')) {
      S.decided.push('rateHike');
      const fee = Math.round(S.loan * 0.02 / 10000) * 10000;
      this.modal({ hideFx: true, scene: 'bank', icon: '📈', title: '기준금리 인상 · 대출 금리 재조정', sub: `대출 ${fmtMoney(S.loan)}`,
        body: '중앙은행이 기준금리를 올려 은행이 대출 금리를 연 1.5%p 올리겠다고 통보했어요',
        buttons: [
          { label: '수수료를 내고 고정금리로 갈아탄다', cls: 'choice', sub: `비용 ${fmtMoney(fee)} (대출의 2%) · 금리 유지`, on: () => { S.cash -= fee; } },
          { label: '오른 금리를 받아들인다', cls: 'choice', sub: '대출 이자 연 +1.5%p (영구)', on: () => { S.rateAdd = (S.rateAdd || 0) + 0.015; } },
        ] });
      return true;
    }
    return false;
  },
  divorce(amount, why) {
    const S = Sim.S;
    S.cash -= amount; S.ceoSpent = (S.ceoSpent || 0) + amount;
    S.married = false; S.house = false; S.divorces = (S.divorces || []).concat([{ m: S.month, why, amount }]);
    S.famDone = []; S.famSkip = []; S.scandalAt = 0;
    this.toast(`💔 ${why} · 위자료 ${fmtMoney(amount)}`); this.updHud(true); this.renderPanel(); this.save();
  },

  // ---------- CEO 라이프 이벤트 ----------
  ceoEvents() {
    const S = Sim.S; const f = S.fatigue || 0; const n = S.branches.length;
    const pay = (amt, after) => () => { S.cash -= amt; S.ceoSpent = (S.ceoSpent || 0) + amt; if (after) after(); this.updHud(true); this.renderPanel(); };
    // 1) 과로로 병원행 (강제)
    if (f >= 95 || (f >= 80 && Math.random() < 0.35)) {
      const cost = 1500 + n * 400;
      S.fatigue = 35; S.cash -= cost; S.ceoSpent = (S.ceoSpent || 0) + cost;
      S.branches.forEach(b => { if (b.status === 'open') b.sat = clamp(b.sat - 3, 0, 100); });
      this.modal({ scene: 'hospital', icon: '🏥', title: '과로로 쓰러져 입원했어요', sub: `${esc(S.ceo)} 대표 · 피로도 ${Math.round(f)}`,
        body: `무리한 업무 끝에 응급실에 실려 갔어요. 2주간 입원하는 동안 회사가 멈췄어요<br><b class="neg">병원비·업무 공백 -${fmtMoney(cost)}</b> · 전 지점 만족도 -3<br><span class="muted">피로도가 70을 넘으면 휴가를 다녀오세요. 메뉴(≡)에서도 갈 수 있어요</span>`,
        buttons: [{ label: '다시는 무리하지 않을게요' }] });
      return;
    }
    // 2) 번아웃 경고 → 휴가 선택
    if (f >= 70 && S.month - (S.burnAt || -99) >= 6) { S.burnAt = S.month; this.vacation(true); return; }
    // 3) 결혼
    if (!S.married && S.month >= 15 && Math.random() < 0.035) {
      this.modal({ hideFx: true, scene: 'wedding', icon: '💍', title: '결혼을 결심했어요', sub: `${esc(S.ceo)} 대표의 인생 이벤트`,
        body: `오랫동안 곁을 지켜준 연인에게 프러포즈했어요. 어떤 결혼을 할까요?<br><span class="muted">현재 가용 현금 ${fmtMoney(S.cash)}</span>`,
        buttons: [
          { label: '호텔 웨딩 + 한강뷰 신혼집 매입', cls: 'choice y', disabled: S.cash < WEDDING_FULL, sub: `비용 ${fmtMoney(WEDDING_FULL)} (결혼식 5천만 + 신혼집 14.5억) · 피로도 -30 · 브랜드 +15${S.cash < WEDDING_FULL ? ' · <b>현금 부족</b>' : ''}`, on: pay(WEDDING_FULL, () => { S.married = S.month; S.famDone = []; S.famSkip = []; S.house = true; S.fatigue = clamp(f - 30, 0, 100); S.brandXP += 15; this.toast('📰 "코리빙 CEO의 화려한 결혼식" 기사화'); }) },
          { label: '스몰 웨딩 (신혼집은 나중에)', cls: 'choice', disabled: S.cash < WEDDING_SMALL, sub: `비용 ${fmtMoney(WEDDING_SMALL)} · 피로도 -15`, on: pay(WEDDING_SMALL, () => { S.married = S.month; S.famDone = []; S.famSkip = []; S.fatigue = clamp(f - 15, 0, 100); this.toast('💐 행복한 결혼 생활의 시작!'); }) },
          { label: '사업이 먼저… 결혼을 미룬다', cls: 'choice', sub: '피로도 +10 · 연인이 서운해해요 · 언젠가 다시 물어볼 거예요', on: () => { S.fatigue = clamp(f + 10, 0, 100); S.delayWed = (S.delayWed || 0) + 1; } },
        ] });
      return;
    }
    // 4) 출산
    if (S.married && (S.kids || 0) < (S.kidsPlan || (S.kidsPlan = 1 + Math.floor(Math.random() * 3))) && S.month - S.married >= 10 && Math.random() < 0.06) {
      const k = (S.kids || 0) + 1;
      this.modal({ hideFx: true, scene: 'baby', icon: '👶', title: k === 1 ? '첫 아이가 태어났어요!' : `${k}번째 아이가 태어났어요!`, sub: `${esc(S.ceo)} 대표의 인생 이벤트`,
        body: `건강한 아기가 태어났어요. 축하해요, 대표님!<br>자녀 1명당 월 양육비 <b class="neg">${fmtMoney(CHILD_COST)}</b>이 회사 현금에서 계속 나가요`,
        buttons: [
          { label: '프리미엄 산후조리원 + 육아휴직 1개월', cls: 'choice', sub: `비용 ${fmtMoney(9000)} · 피로도 -30 · 전 지점 만족도 -2 (대표 부재)`, on: pay(9000, () => { S.kids = k; S.kidAt = S.month; S.fatigue = clamp(f - 30, 0, 100); S.branches.forEach(b => { if (b.status === 'open') b.sat = clamp(b.sat - 2, 0, 100); }); }) },
          { label: '일반 산후조리원, 대표는 바로 복귀', cls: 'choice', sub: `비용 ${fmtMoney(3500)} · 피로도 +15`, on: pay(3500, () => { S.kids = k; S.kidAt = S.month; S.fatigue = clamp(f + 15, 0, 100); }) },
        ] });
    }
  },

  vacation(warn) {
    const S = Sim.S; const f = Math.round(S.fatigue || 0);
    const go = (cost, fat, scene, title, satHit) => () => {
      S.cash -= cost; S.ceoSpent = (S.ceoSpent || 0) + cost; S.fatigue = clamp((S.fatigue || 0) - fat, 0, 100);
      if (satHit) S.branches.forEach(b => { if (b.status === 'open') b.sat = clamp(b.sat - satHit, 0, 100); });
      this.modal({ scene, icon: '🧳', title, sub: `피로도 ${f} → ${Math.round(S.fatigue)}`, body: '푹 쉬고 돌아왔어요. 다시 달릴 준비 완료!<div class="fx" style="margin-top:8px">' + this.fxHtml('피로도 -' + Math.min(fat, f) + (satHit ? ' · 대표 부재로 전 지점 만족도 -' + satHit : '')) + '</div>', buttons: [{ label: '복귀하기' }] });
      this.updHud(true); this.renderPanel(); this.save();
    };
    const opts = [
      { label: '제주도 3박 4일 힐링', cls: 'choice', noResult: true, sub: `비용 ${fmtMoney(400)} · 피로도 -40`, on: go(400, 40, 'travel_jeju', '제주도에서 재충전했어요') },
      { label: '유럽 2주 여행', cls: 'choice', noResult: true, sub: `비용 ${fmtMoney(2000)} · 피로도 전부 회복 · 대표 부재로 전 지점 만족도 -2`, on: go(2000, 100, 'travel_europe', '유럽 여행에서 영감을 얻었어요', 2) },
    ];
    if (warn) opts.push({ label: '휴가는 사치! 계속 일한다', cls: 'choice', sub: '피로도 +5 · 병원에 실려 갈 위험 ↑', on: () => { S.fatigue = clamp((S.fatigue || 0) + 5, 0, 100); } });
    else opts.push({ label: '취소', cls: 'ghost' });
    this.modal({ hideFx: true, scene: 'burnout', icon: '😵', title: warn ? '번아웃 경고' : 'CEO 휴가', sub: `피로도 ${f} / 100`,
      body: warn ? `로제: "대표님, 요즘 잠도 못 주무시죠? 이러다 쓰러지세요. 휴가 다녀오세요!"<br><span class="muted">피로도가 80을 넘으면 병원에 실려 갈 수 있어요</span>` : '어디로 다녀올까요? 휴가를 다녀오면 병원에 갈 일이 없어요',
      buttons: opts });
  },

  // ---------- 월 결산 리포트 ----------
  monthReport(rep, cash0) {
    const S = Sim.S; const d = elapsedStr(S.month - 1);
    const open = S.branches.filter(x => x.last && !x.last.building);
    const cost = S.branches.reduce((a, x) => a + (x.last ? x.last.cost : 0), 0);
    const mi = open.reduce((a, x) => a + x.last.movein, 0), mo = open.reduce((a, x) => a + x.last.moveout, 0);
    const rooms = open.reduce((a, x) => a + Sim.rooms(x), 0), occ = open.reduce((a, x) => a + Sim.occ(x), 0);
    const g = Sim.goalState();
    let h = `<div class="rep-big">
      <div><small>월 매출</small><b class="pos">${fmtMoney(rep.rev)}</b></div>
      <div><small>월 순이익 (이자 포함)</small><b class="${rep.net >= 0 ? 'pos' : 'neg'}">${fmtMoney(rep.net, true)}</b></div>
      <div><small>입주율</small><b>${rooms ? pct(occ / rooms) : '-'}</b></div>
      <div><small>입주 / 퇴실</small><b><span class="pos">+${mi}</span> / <span class="neg">-${mo}</span></b></div></div>
      <table class="rep-tbl">
        <tr><td>운영 비용 (예산·인건비·유지비·마케팅 등)</td><td class="neg">-${fmtMoney(cost)}</td></tr>
        <tr><td>대출 이자 (연 ${Sim.rateYear()}%)</td><td class="neg">${rep.deferred ? `보류 (${fmtMoney(rep.deferred)})` : "-" + fmtMoney(rep.interest)}</td></tr>
        ${rep.tax ? `<tr><td>법인세 (연 1회)</td><td class="neg">-${fmtMoney(rep.tax)}</td></tr>` : ''}${S.bigProfit ? `<tr><td>법인세 과세 누적 (3월 납부)</td><td>${fmtMoney(S.taxBase || 0)} → 예상 ${fmtMoney(Sim.corpTax(S.taxBase || 0))}</td></tr>` : ''}
        ${S.unpaid ? `<tr><td>미납 이자 누적 · 보류 ${S.deferCount}/${DEFER_SEIZE}회</td><td class="neg">${fmtMoney(S.unpaid)}</td></tr>` : ""}
        ${rep.childcare ? `<tr><td>자녀 양육비 (${S.kids}명)</td><td class="neg">-${fmtMoney(rep.childcare)}</td></tr>` : ""}
        <tr><td>CEO 피로도</td><td class="${S.fatigue >= 70 ? "neg" : ""}">${Math.round(S.fatigue || 0)} / 100</td></tr>
        ${rep.hq ? `<tr><td>본사 운영비 (투자 유치 후)</td><td class="neg">-${fmtMoney(rep.hq)}</td></tr>` : ""}
        <tr><td>현금 변화</td><td class="${S.cash - cash0 >= 0 ? 'pos' : 'neg'}">${fmtMoney(cash0)} → ${fmtMoney(S.cash)}</td></tr>
        ${rep.xp ? `<tr><td>브랜드 포인트</td><td class="pos">+${Math.round(rep.xp)}pt (Lv.${Sim.lvl()})</td></tr>` : ''}
      </table>`;
    h += `<div class="rep-sec">지점별 실적</div>` + S.branches.map(b => {
      if (!b.last || b.last.building) return `<div class="rep-br"><div class="t"><span>${esc(b.name)}</span><span>🏗 공사 ${b.buildLeft}개월 남음</span></div></div>`;
      const L = b.last;
      return `<div class="rep-br"><div class="t"><span>${esc(b.name)}</span><span class="${L.profit >= 0 ? 'pos' : 'neg'}">${fmtMoney(L.profit, true)}</span></div>
        <div class="g"><div><b>${Sim.occ(b)}/${Sim.rooms(b)}</b><small>입주</small></div><div><b class="${b.sat >= 80 ? 'pos' : b.sat < 50 ? 'neg' : ''}">${Math.round(b.sat)}</b><small>만족도</small></div>
        <div><b>${L.inq}</b><small>문의</small></div><div><b>${Sim.rentNow(b)}만</b><small>월세</small></div></div>
        <div class="muted" style="margin-top:3px">문의 ${L.inq} → 투어 ${L.tours} → 지원 ${L.apps} → 계약 ${L.cons} → 입주 ${L.movein} · 퇴실률 ${pct(L.churn)}</div></div>`;
    }).join('');
    if (!g.multi && g.b && g.b.last && !g.b.last.building) {
      h += `<div class="rep-sec">STAGE ${S.stage} 목표 (${S.streak}/3개월 연속)</div>
        <div class="goal ${g.ok[0] ? 'ok' : ''}"><span class="ck">${g.ok[0] ? '✓' : ''}</span>입주율 95%<span class="gv">${pct(g.occR)}</span></div>
        <div class="goal ${g.ok[1] ? 'ok' : ''}"><span class="ck">${g.ok[1] ? '✓' : ''}</span>만족도 80<span class="gv">${Math.round(g.sat)}</span></div>
        <div class="goal ${g.ok[2] ? 'ok' : ''}"><span class="ck">${g.ok[2] ? '✓' : ''}</span>지점 순이익 ${fmtMoney(g.target)}<span class="gv">${fmtMoney(g.profit)}</span></div>`;
    }
    const tips = this.advice();
    h += `<div class="rep-sec">COO 로제의 한마디</div><div class="coo"><div class="face">${COO_FACE}</div><div class="say"><ul class="advice">${tips.map(t => `<li>${t}</li>`).join('')}</ul></div></div>`;
    this.modal({ wide: true, icon: '📅', title: `${d} 월 결산`, sub: `${esc(S.brand)} · 지점 ${S.branches.length}개`, body: h,
      buttons: [{ label: '다음 달 진행 ▶', cls: 'y' }, { label: '결산 팝업 그만 보기', cls: 'ghost', sub: '메뉴(≡)에서 다시 켤 수 있어요', on: () => { S.showReport = false; this.save(); } }] });
  },

  // COO 조언: 가장 시급한 것부터 최대 3개
  advice() {
    const S = Sim.S; const tips = [];
    const add = (p, t) => tips.push([p, t]);
    const target = Sim.stageBranch();
    S.branches.forEach(b => {
      if (!b.last || b.last.building) return;
      const L = b.last, nm = S.branches.length > 1 ? `<b>${esc(b.name)}</b> ` : '';
      const w = b === target ? 1.5 : 1;
      const occR = Sim.occ(b) / Sim.rooms(b);
      const parts = Sim.satParts(b); const rentPen = (parts.find(p => p[0] === '월세 인상') || [0, 0])[1];
      const stTarget = Sim.bTarget(b);
      if (occR < 0.9) {
        const ra = Sim.rentMulAvg(b);
        if (b.rentF > 1.1 && ra < 0.8) add(9 * w, `${nm}월세(${Sim.rentNow(b)}만원) 때문에 문의가 ${Math.round((1 - ra) * 100)}% 줄었어요. 빈방이 ${Sim.rooms(b) - Sim.occ(b)}개나 있으니 월세를 낮춰 먼저 채워요`);
        if (Sim.priceResist(b) < 0.85) add(6 * w, `${nm}월세가 비싸서 투어 후 지원을 망설이는 사람이 많아요 (지원율 ${pct(Sim.rates(b).apply)}). 세일즈 매니저나 브랜드 레벨로 보완할 수 있어요`);
        const chOn = CHANNELS.filter(c => b.channels[c.id]).length;
        if (chOn < 2 || b.budget.mkt < 50) add(8 * w, `${nm}문의가 ${L.inq}건뿐이에요. <b>📣 마케팅</b> 채널을 더 켜거나 마케팅 예산을 올려요${!Sim.stN(b, 'mm') ? ' · 마케팅 매니저도 효과가 커요' : ''}`);
        else if (!Sim.stN(b, 'sm')) add(6 * w, `${nm}문의는 들어오는데 계약까지 이어지는 게 적어요. <b>세일즈 매니저</b>를 채용하면 계약률이 올라요`);
        const top = SEGS.map((k, i) => [k, Sim.land(b).seg[i]]).sort((a, c) => c[1] - a[1])[0][0];
        const ch = CHANNELS.find(c => c.segs !== 'all' && c.segs.includes(top) && !b.channels[c.id]);
        if (ch) add(5 * w, `${nm}이 동네 주 수요는 <b>${SEG_INFO[top].name}</b>이에요. <b>${ch.name}</b> 채널이 잘 맞아요`);
      }
      if (b.sat < 80) {
        const miss = [];
        if (!Sim.stN(b, 'cm')) miss.push('커뮤니티 매니저 채용 (+8)');
        if (Sim.sessions(b) < 3) miss.push('커뮤니티 이벤트 회차 늘리기 (최대 +12)');
        if (b.budget.clean < 70) miss.push('청소 예산 올리기');
        if (b.budget.comm < 70) miss.push('커뮤니티 예산 올리기');
        if (rentPen < -3) miss.push(`월세 인상 감점 ${Math.round(rentPen)} 줄이기`);
        if (b.cond < 70) miss.push('시설 상태 회복');
        add((b.sat < 60 ? 10 : 7) * w, `${nm}만족도가 ${Math.round(b.sat)}이에요 (예상 목표 ${Math.round(Sim.satTarget(b))}). ${miss.length ? miss.slice(0, 3).join(' · ') : '서비스 업그레이드로 입주민 선호를 채워보세요'}`);
      }
      if (b.cond < 55) add(7 * w, `${nm}시설 상태가 ${Math.round(b.cond)}로 낡았어요. 고장 이벤트가 잦아지니 시설관리 예산을 올리거나 시설 관리자를 채용해요`);
      if (L.churn > 0.06) add(6 * w, `${nm}한 달에 ${pct(L.churn)}가 나가고 있어요. 커뮤니티 예산과 이벤트가 재계약률을 올려줘요`);
      if (occR >= 0.97 && b.sat >= 84 && b.rentF < 1.3) add(5 * w, `${nm}만실에 만족도도 높아요! 월세를 조금(5~10%) 올려 수익을 키워볼 만해요`);
      if (occR >= 0.97 && L.costs.channels >= 100 && L.profit < stTarget) add(5 * w, `${nm}이미 만실인데 마케팅 채널비가 월 ${fmtMoney(L.costs.channels)} 나가요. 일부를 꺼서 순이익을 올려요`);
      if (b === target && L.profit < stTarget && occR >= 0.9) add(6 * w, `${nm}목표 순이익까지 ${fmtMoney(stTarget - L.profit)} 부족해요. 월세 조정이나 비용 절감이 필요해요`);
      const sh = Sim.segShare(b);
      SEGS.forEach(k => { if (sh[k] > 0.3 && Sim.prefMatch(b, k) === 0) add(4 * w, `${nm}입주민의 ${pct(sh[k])}가 ${SEG_INFO[k].name}인데 선호(${SEG_INFO[k].prefs.join('·')})를 하나도 못 채우고 있어요`); });
    });
    const monthly = S.branches.reduce((a, x) => a + (x.last ? x.last.cost : 0), 0) + Math.round(S.loan * Sim.rate());
    if (S.deferCount) add(13, `대출 이자를 ${S.deferCount}번 보류했어요 (미납 ${fmtMoney(S.unpaid || 0)}). ${DEFER_SEIZE}번이면 건물을 압류당해요. 여유가 생기면 바로 상환해요`);
    if (S.negMonths > 0) add(20, `<b>자금 위기 ${S.negMonths}/${BANKRUPT_MONTHS}개월!</b> 적자를 -10억 안으로 줄이지 못하면 파산이에요. 월세를 낮춰 입주율을 올리거나, 직원·마케팅·이벤트 비용부터 줄여요`);
    if (S.cash < monthly * 2) add(11, `현금이 ${fmtMoney(S.cash)}밖에 없어요. 두 달 운영비도 안 돼요. 비용을 줄이거나 대출을 받아두세요`);
    const g = Sim.goalState();
    if (!g.multi && g.ok && g.ok.every(x => x)) add(12, `이번 달 목표 3개를 모두 달성했어요! 이대로 <b>${3 - S.streak}개월</b>만 더 유지하면 스테이지 클리어예요`);
    if (S.stageStatus === 'select' || (STAGES[S.stage - 1].multi && Sim.canPickMore())) add(3, '다음 지역 부지 선정이 기다리고 있어요. 자금이 모이면 <b>🏠 지점</b> 탭에서 진출해요');
    tips.sort((a, c) => c[0] - a[0]);
    const out = []; tips.forEach(t => { if (out.length < 3 && !out.includes(t[1])) out.push(t[1]); });
    return out.length ? out : ['아주 잘하고 있어요, 대표님! 지금처럼만 운영해요'];
  },

  stageClear(n) {
    const S = Sim.S; const st = STAGES[n - 1]; const nx = STAGES[n];
    const b = Sim.stageBranch();
    Sim.advanceStage();
    this.modal({ icon: '🏆', title: `STAGE ${n} CLEAR!`, sub: `${st.area} · ${b.name}`,
      body: `입주율 ${pct(b.last.occR)} · 만족도 ${Math.round(b.sat)} · 월 순이익 ${fmtMoney(b.last.profit)}<br>3개월 연속 목표 달성!<br><br>
        다음 무대 <b class="pos">Stage ${n + 1} ${nx.area}</b><br>${nx.title}<br>대출 한도 <b class="pos">+${fmtMoney(nx.loan)}</b>`,
      buttons: [{ label: '▶ 다음 지역 진출', cls: 'y', on: () => this.openSelect() }, { label: '자금을 더 모은 뒤 진출', cls: 'ghost', sub: '지점 탭에서 언제든 시작할 수 있어요' }] });
  },

    const assets = S.cash + S.branches.reduce((a, b) => a + (b.invest || 0), 0) - S.loan;
    const fam = S.married ? `사랑하는 가족${S.kids ? `, 아이 ${S.kids}명` : ''}과 함께` : '자유로운 싱글 라이프';
    const shots = [
