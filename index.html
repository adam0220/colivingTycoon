      ['end_award', '올해의 코리빙 브랜드 대상', `${esc(S.ceo)} 대표, 수상 소감: "모든 입주민 덕분입니다"`],
      ['end_yacht', '한강 위의 요트 파티', '주말엔 샴페인과 노을, 그리고 요트'],
      ['end_mansion', '한남동 펜트하우스 & 슈퍼카', fam],
      ['end_jet', '전용기로 떠나는 세계 여행', '다음 목표는 도쿄, 뉴욕, 런던 코리빙'],
      ['end_portrait', `CEO ${esc(S.ceo)}`, `순자산 ${fmtMoney(assets)} · 작은 코리빙 하나에서 시작한 여정`],
    ];
    const timers = []; this._endTimers = timers;
    const clear = () => timers.forEach(clearTimeout);
    const finale = () => {
      clear();
      sc.innerHTML = `<div class="end-wrap"><canvas class="end-cv"></canvas><div class="end-final">
        <div style="flex:1"></div><div class="big">THE END</div>
        <div class="end-sub">${esc(S.ceo)} 대표의 ${esc(S.brand)}<br>${S.month}개월간의 코리빙 여정</div>
        <button class="btn y big" id="endCont">계속 운영하기</button><button class="btn ghost big" id="endNew">새 게임</button><div style="height:30px"></div></div></div>`;
      Scenes.play(sc.querySelector('.end-cv'), 'end_fireworks');
      $('#endCont').onclick = () => { sc.innerHTML = ''; sc.classList.add('hidden'); sc.style.background = ''; this.screenOpen = false; this.renderPanel(); };
      $('#endNew').onclick = () => { localStorage.removeItem(SAVE_KEY); this.showTitle(); };
    };
    const credits = () => {
      clear();
      const rows = S.branches.map(b => `<p>${esc(b.name)} · ${Sim.occ(b)}/${Sim.rooms(b)}실 · 만족도 ${Math.round(b.sat)}</p>`).join('');
      sc.innerHTML = `<div class="end-wrap"><button class="end-skip">건너뛰기 ▶▶</button><canvas class="end-cv" style="opacity:.35"></canvas>
        <div class="end-credits"><h1>${esc(S.brand)}</h1><p>CO-LIVING TYCOON : SEOUL</p>
        <h2>CEO</h2><p>${esc(S.ceo)} · ${Sim.fam().name}</p>
        <h2>COO</h2><p>로제</p>
        <h2>운영 기록</h2><p>운영 기간 ${spanStr(S.month)}</p><p>총 입주민 ${occ}명 / ${rooms}실</p><p>브랜드 레벨 ${Sim.lvl()} · 업계 랭킹 ${Sim.rank().me}위</p><p>순자산 ${fmtMoney(assets)}</p>
        <h2>지점</h2>${rows}
        <h2>인생</h2><p>${S.married ? '결혼 ✓' : '싱글'}${S.kids ? ` · 자녀 ${S.kids}명` : ''}</p><p>CEO 개인 지출 ${fmtMoney(S.ceoSpent || 0)}</p>${S.stake ? `<h2>투자</h2><p>싱가포르 투자 유치 ${fmtMoney(SG_INVEST)} · 지분 ${Math.round(S.stake * 100)}%</p>` : ""}
        <h2>THANK YOU FOR PLAYING</h2><p>모든 입주민과 직원들에게</p></div></div>`;
      Scenes.play(sc.querySelector('.end-cv'), 'end_fireworks');
      sc.querySelector('.end-skip').onclick = finale;
      timers.push(setTimeout(finale, 26500));
    };
    const show = i => {
      if (i >= shots.length) { credits(); return; }
      const [scene, cap, sub] = shots[i];
      sc.innerHTML = `<div class="end-wrap"><button class="end-skip">건너뛰기 ▶▶</button><canvas class="end-cv"></canvas><div class="end-cap">${cap}</div><div class="end-sub">${sub}</div>
        <div style="margin-top:auto;padding:16px;display:flex;gap:6px">${shots.map((_, k) => `<i style="width:18px;height:4px;border-radius:2px;background:${k <= i ? '#c6f26b' : '#333'}"></i>`).join('')}</div></div>`;
      Scenes.play(sc.querySelector('.end-cv'), scene);
      sc.querySelector('.end-skip').onclick = credits;
      sc.querySelector('.end-cv').onclick = () => { clear(); show(i + 1); };
      timers.push(setTimeout(() => show(i + 1), 5200));
    };
    show(0);
  },

  ending() {
    const S = Sim.S;
    this.modal({ icon: '👑', title: '업계 1위 달성!', sub: '서울 대표 코리빙 브랜드',
      body: `<b>${esc(S.ceo)}</b> 대표님의 <b>${esc(S.brand)}</b>가 서울 ${S.branches.length}개 지점을 운영하는 업계 1위 코리빙 브랜드가 됐어요<br><br>
        운영 기간 ${S.month}개월 · 총 입주민 ${S.branches.reduce((a, b) => a + Sim.occ(b), 0)}명 · 현금 ${fmtMoney(S.cash)}<br><br>작은 코리빙 하나에서 시작한 여정, 정말 멋졌어요`,
      buttons: [{ label: '계속 운영하기', cls: 'y' }, { label: '새 게임', cls: 'ghost', on: () => { localStorage.removeItem(SAVE_KEY); this.showTitle(); } }] });
  },

  showEvent(pe) {
    const S = Sim.S; const b = Sim.findBranch(pe.bid); const e = EVENTS.find(x => x.id === pe.eid);
    if (!b || !e) return;
    const text = e.text(b, Sim);
    // 오픈 1년이 지나고 담당 직원이 '우수' 이상이면 간단한 민원은 알아서 처리 (선택지 없이 알림만)
    const ar = AUTO_RESOLVE[e.id];
    if (ar && Sim.autoOK(b, ar[0]) && e.choices) {
      const c = e.choices[ar[1]]; const lv = Sim.payLv(b, ar[0]); const cost = Math.round(c.cost(b, Sim) * (lv >= 3 ? 0 : lv >= 2 ? 0.5 : 1));
      if (cost) { S.cash -= cost; b.pendingCost += cost; }
      c.apply(b, Sim);
      const who = STAFF.find(s => s.id === ar[0]).name;
      this.toast(`${e.icon} ${b.name} ${e.title} → ${who}가 처리했어요${cost ? ` (${fmtMoney(cost)})` : ''}`);
      this.renderPanel(); this.updHud(true);
      return;
    }
    if (e.auto) {
      e.apply(b, Sim);
      this.modal({ scene: e.id, icon: e.icon, title: e.title, sub: b.name, body: `${text}<br><b class="pos">${e.auto}</b>`, buttons: [{ label: '좋아요!' }] });
    } else {
      this.modal({ hideFx: true, scene: e.id, icon: e.icon, title: (e.disaster ? '<span class="dz">재난</span> ' : '') + e.title, sub: b.name, body: text,
        buttons: e.choices.map(c => {
          const cost = c.cost(b, Sim);
          return { label: c.label, cls: 'choice', sub: (cost ? `비용 ${fmtMoney(cost)} · ` : '') + c.desc,
            on: () => { if (cost) { S.cash -= cost; b.pendingCost += cost; } c.apply(b, Sim); this.renderPanel(); this.updHud(true); } };
        }) });
    }
  },

  // ---------- 모달 ----------
  modal(o) { this.mq.push(o); if (!this.modalOn) this.nextModal(); },
  nextModal() {
    const o = this.mq.shift(); const m = $('#modal');
    if (!o) { this.modalOn = false; m.classList.add('hidden'); m.innerHTML = ''; this.flushToasts(); return; }
    this.modalOn = true; m.classList.remove('hidden');
    // hideFx: 선택지에는 비용만 보여주고, 효과는 고른 뒤 결과 팝업으로 공개
    const btns = (o.buttons || [{ label: '확인' }]).map(b => {
      if (!o.hideFx || !b.sub || b.noResult) return b;
      const parts = b.sub.split(' · ');
      const ci = parts.findIndex(p => p.startsWith('비용'));
      const lack = parts.find(p => p.includes('현금 부족'));
      const shown = (ci >= 0 ? parts[ci] : '비용 없음') + (lack ? ' · ' + lack : '');
      const rest = parts.filter((p, i) => i !== ci && p !== lack).join(' · ');
      return Object.assign({}, b, { sub: shown + ' · <span style="opacity:.75">결과는 선택 후 공개</span>', result: rest });
    });
    const head = o.coo ? '' : `<div class="mhead">${o.icon ? `<span class="ic">${o.icon}</span>` : ''}<div><h3>${o.title}</h3>${o.sub ? `<small>${o.sub}</small>` : ''}</div></div>`;
    const body = o.coo ? `<div class="mbody"><div class="coo"><div class="face">${COO_FACE}</div><div class="say">${o.coo}</div></div></div>` : `<div class="mbody">${o.body || ''}</div>`;
    const scene = o.scene ? '<canvas class="evcv"></canvas>' : '';
    m.innerHTML = `<div class="mbox ${o.wide ? 'wide' : ''}">${head}${scene}${body}<div class="mfoot">${btns.map((b, i) => `<button class="btn ${b.cls || ''} ${(b.cls || '').includes('choice') ? '' : 'big'}" data-mb="${i}" ${b.disabled ? "disabled" : ""}>${b.label}${b.sub ? `<small style="display:block;font-weight:400;font-size:11px;margin-top:2px">${b.sub}</small>` : ''}</button>`).join('')}</div></div>`;
    if (o.scene) Scenes.play(m.querySelector('.evcv'), o.scene);
    m.querySelectorAll('[data-mb]').forEach(el => el.onclick = () => {
      const b = btns[+el.dataset.mb]; this.modalOn = false;
      if (b && b.result) this.mq.unshift({ icon: '📋', title: '선택 결과', sub: b.label, body: `<div class="fx">${this.fxHtml(b.result)}</div>`, buttons: [{ label: '확인' }] });
      if (b && b.on) b.on();
      if (!this.modalOn) this.nextModal();
    });
  },
  // 결과 문구에서 +는 초록, -는 빨강으로
  fxHtml(t) {
    if (!t) return '<b>변화 없음</b>';
    return t.split(' · ').map(p => {
      const cls = /[+]\d|증가|회복|유지|무료/.test(p) && !/위험|퇴실 증가|-\d/.test(p) ? 'pos' : /-\d|감소|퇴사|위험|퇴실 증가|부재/.test(p) ? 'neg' : '';
      return `<div class="fx-row ${cls}">${cls === 'pos' ? '▲' : cls === 'neg' ? '▼' : '•'} ${p}</div>`;
    }).join('');
  },
  // 팝업이 떠 있는 동안 안내는 대기했다가 팝업이 모두 닫히면 차례로 보여줌
  toast(t) {
    if (this.modalOn) { this.tq = (this.tq || []).concat([t]).slice(-4); return; }
    this.showToast(t);
  },
  flushToasts() { const q = this.tq || []; this.tq = []; q.forEach((t, i) => setTimeout(() => this.showToast(t), i * 900)); },
  showToast(t) { const d = document.createElement('div'); d.className = 'tst'; d.innerHTML = t; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3300); while ($('#toast').children.length > 3) $('#toast').firstChild.remove(); },
  float(t, c, x, y) { const d = document.createElement('div'); d.className = 'floater'; d.textContent = t; d.style.color = c; d.style.left = x + '%'; d.style.top = y + '%'; $('#floaters').appendChild(d); setTimeout(() => d.remove(), 1900); },

      <div class="kv2"><div><small>현금</small><b class="${S.cash < 0 ? 'neg' : 'pos'}">${fmtMoney(S.cash)}</b></div><div><small>대출</small><b>${fmtMoney(S.loan)}</b></div><div><small>월 이자</small><b class="neg">${fmtMoney(Math.round(S.loan * Sim.rate()))}</b></div></div>
      <div class="row"><span class="k">대출 한도</span><span class="v">${fmtMoney(S.loanCap)} (연 ${Sim.rateYear()}%)</span></div>
      <div class="btn-row"><button class="btn" data-act="borrow" ${avail < 100000 ? 'disabled' : ''}>+10억 대출</button><button class="btn y" data-act="repay" ${S.loan < 100000 || S.cash < 100000 ? 'disabled' : ''}>10억 상환</button></div></div>`;
    h += `<div class="card"><h3>🏦 이자 보류 <small>${S.deferCount || 0} / ${DEFER_SEIZE}회</small></h3>
      ${S.unpaid ? `<div class="row"><span class="k">미납 이자</span><span class="v neg">${fmtMoney(S.unpaid)}</span></div>` : ''}
      <div class="btn-row"><button class="btn ${S.deferNext ? 'r' : 'ghost'}" data-act="defer">${S.deferNext ? '✓ 보류 예약됨' : '다음 달 이자 보류'}</button><button class="btn y" data-act="payunpaid" ${!S.unpaid || S.cash < S.unpaid ? 'disabled' : ''}>미납 이자 상환</button></div>
      <div class="muted">${DEFER_WARN}회부터 은행이 찾아오고 ${DEFER_SEIZE}회면 건물을 압류해요</div></div>`;
    if (S.bigProfit) h += `<div class="card"><h3>🧾 법인세 <small>매년 3월</small></h3><div class="row"><span class="k">올해 쌓인 과세 이익</span><span class="v">${fmtMoney(S.taxBase || 0)}</span></div><div class="row"><span class="k">예상 세금 (누진 9~24% + 지방세)</span><span class="v neg">${fmtMoney(Sim.corpTax(S.taxBase || 0))}</span></div></div>`;
    if (S.negMonths > 0) h += `<div class="card warn"><h3>🚨 자금 위기 ${S.negMonths} / ${BANKRUPT_MONTHS}개월</h3><div class="muted">적자가 -10억을 넘는 달이 ${BANKRUPT_MONTHS}개월 이어지면 파산해요</div></div>`;
    return h;
  },

  goalsHtml(g) {
    const S = Sim.S;
    if (g.multi) return `<div class="goal ${g.ok[0] ? 'ok' : ''}"><span class="ck">${g.ok[0] ? '✓' : ''}</span>서울 ${STAGE8_GOAL_BRANCHES}개 지점 운영<span class="gv">${g.opened}/${STAGE8_GOAL_BRANCHES}</span></div>
      <div class="goal ${g.ok[1] ? 'ok' : ''}"><span class="ck">${g.ok[1] ? '✓' : ''}</span>브랜드 레벨 10<span class="gv">Lv.${g.lvl}</span></div>
      <div class="goal ${g.ok[2] ? 'ok' : ''}"><span class="ck">${g.ok[2] ? '✓' : ''}</span>업계 랭킹 1위<span class="gv">${g.rank}위</span></div>`;
    return `<div class="muted" style="margin-bottom:4px">${g.b ? esc(g.b.name) + ' 기준 · ' : ''}아래 3개를 <b>3개월 연속</b> 유지하면 클리어</div>
      <div class="goal ${g.ok[0] ? 'ok' : ''}"><span class="ck">${g.ok[0] ? '✓' : ''}</span>입주율 95% 이상<span class="gv">${pct(g.occR || 0)}</span></div>
      <div class="goal ${g.ok[1] ? 'ok' : ''}"><span class="ck">${g.ok[1] ? '✓' : ''}</span>만족도 80 이상<span class="gv">${Math.round(g.sat || 0)}</span></div>
      <div class="goal ${g.ok[2] ? 'ok' : ''}"><span class="ck">${g.ok[2] ? '✓' : ''}</span>지점 월 순이익 ${fmtMoney(g.target)} 이상<span class="gv">${fmtMoney(g.profit || 0)}</span></div>
      <div class="row" style="margin-top:4px"><span class="k">연속 달성</span><span class="v pos">${S.stageStatus === 'cleared' || S.stageStatus === 'select' ? '클리어!' : S.streak + ' / 3개월'}</span></div>`;
  },

  act(a, arg) {
    const S = Sim.S; const b = Sim.branch();
    if (a === 'select') { this.openSelect(); return; }
    if (a === 'selbranch') { S.sel = +arg; this.renderPanel(); this.updHud(true); return; }
    if (a === 'borrow') { if (S.loanCap - S.loan >= 100000) { S.loan += 100000; S.cash += 100000; } }
    if (a === 'repay') { if (S.loan >= 100000 && S.cash >= 100000) { S.loan -= 100000; S.cash -= 100000; } }
    if (a === 'defer') { S.deferNext = !S.deferNext; this.toast(S.deferNext ? '🏦 다음 달 대출 이자를 보류해요' : '이자 보류 취소'); }
    if (a === 'payunpaid') { if (Sim.repayUnpaid()) this.toast('✅ 미납 이자 상환 완료 · 보류 횟수 초기화'); }
    if (!b) { this.renderPanel(); this.updHud(true); return; }
    if (a === 'staffn') { const [id, d] = arg.split(':'); const n = Sim.stN(b, id) + (+d); if (+d > 0 && b.vacant && b.vacant[id] > S.month) return; b.staff[id] = clamp(n, 0, STAFF_MAX); }
    if (a === 'grade') { const [id, d] = arg.split(':'); b.payLv = b.payLv || {}; b.payLv[id] = clamp(Sim.payLv(b, id) + (+d), 0, PAY_GRADES.length - 1); }
    if (a === 'eventn') { const [id, d] = arg.split(':'); b.events[id] = clamp(Sim.evN(b, id) + (+d), 0, EVENT_MAX); }
    if (a === 'channel') b.channels[arg] = !b.channels[arg];
    if (a === 'boost') { b.boost = clamp((b.boost || 1) + (+arg), 1, BOOST_MAX); }
    if (a === 'biz') {
      const z = BIZ.find(x => x.id === arg); const cost = Sim.bizCost(b, z);
      if (S.cash >= cost && Sim.lvl() >= z.lvl && !(b.biz && b.biz[arg])) { S.cash -= cost; b.biz = b.biz || {}; b.biz[arg] = true; this.toast(`🚀 ${z.name} 완료 · 다음 달부터 ${z.rev} 발생`); }
    }
    if (a === 'upgrade') {
      const u = UPGRADES.find(x => x.id === arg); const cost = Sim.upgradeCost(b, u);
      if (S.cash >= cost && !b.upgrades[arg]) { S.cash -= cost; b.upgrades[arg] = true; this.toast(`✨ ${u.name} 설치 완료`); }
    }
    this.renderPanel(); this.updHud(true); this.save();
  },

  slide(el) {
    const b = Sim.branch(); if (!b) return;
    if (el.dataset.slider === 'member') {
      b.member = +el.value;
      const card = $('#memberCard'); const tmp = document.createElement('div'); tmp.innerHTML = this.memberCardHtml(b);
      card.querySelector('.top').innerHTML = tmp.querySelector('.top').innerHTML;
      card.querySelector('.muted').innerHTML = tmp.querySelector('.muted').innerHTML;
      this.save(); return;
    }
    if (el.dataset.slider === 'rent') {
      b.rentF = Math.min(Sim.S.rentCap || 99, Math.round(+el.value / Sim.baseRent(b) * 10000) / 10000);
      // 드래그 중엔 슬라이더를 제외한 문구만 갱신
      const card = $('#rentCard'); const tmp = document.createElement('div'); tmp.innerHTML = this.rentCardHtml(b);
      card.querySelector('.top').innerHTML = tmp.querySelector('.top').innerHTML;
      card.querySelector('.muted').innerHTML = tmp.querySelector('.muted').innerHTML;
      this.save(); return;
    }
    if (el.dataset.slider === 'budget') b.budget[el.dataset.k] = +el.value;
    const top = el.parentElement.querySelector('.top b');
    if (top) top.textContent = b.budget[el.dataset.k] + ' · ' + fmtMoney(Math.round(b.budget[el.dataset.k] * Sim.scale(b)));
    if (!this.dragging) this.renderPanel();
  },

  // ---------- 상단 버튼 ----------
  // ---------- 대표 총 자산 내역 (상단 금액 클릭) ----------
  showAssets() {
    if (!Sim.S || this.title) return;
    const S = Sim.S;
    const re = S.branches.reduce((a, b) => a + (b.invest || 0), 0);
    const gross = S.cash + re;
    const debt = S.loan + (S.unpaid || 0);
    const equity = gross - debt;
    const mine = equity * (1 - (S.stake || 0));
    const home = S.house ? 145000 : 0;
    const rooms = S.branches.reduce((a, b) => a + Sim.rooms(b), 0), occ = S.branches.reduce((a, b) => a + Sim.occ(b), 0);
    const brs = S.branches.map(b => {
      const land = Sim.land(b); const st = b.status === 'open';
      return `<div class="as-br"><div class="t"><span>${esc(b.name)}</span><span>${fmtMoney(b.invest || 0)}</span></div>
        <div class="s">${land.name} · ${SIZES[b.size].name} ${Sim.rooms(b)}실 · ${Sim.grade(b).name} · ${CONCEPTS[b.concept].name}</div>
        <div class="s">${st ? `입주 ${Sim.occ(b)}/${Sim.rooms(b)}실 · 월세 ${Sim.rentNow(b)}만원 · 지난달 순이익 ${b.last ? fmtMoney(b.last.profit, true) : '-'}` : `🏗 공사중 · ${b.buildLeft}개월 남음`}${b.biz && b.biz.data ? ' · 📡데이터' : ''}${b.biz && b.biz.ads ? ' · 📺광고' : ''}</div></div>`;
    }).join('') || '<div class="muted">아직 보유한 건물이 없어요</div>';
    this.modal({ wide: true, icon: '💼', title: `${esc(S.ceo)} 대표의 총 자산`, sub: `${esc(S.brand)} · ${Sim.fam().name} · ${elapsedStr(S.month)}`,
      body: `<div class="as-big"><small>화면 맨 위 금액 = 보유 자산 (현금 + 부동산)</small><b>${fmtMoney(gross)}</b></div>
        <table class="as-tbl">
          <tr><td>💵 현금 (가용 자금)</td><td class="${S.cash < 0 ? 'neg' : ''}">${fmtMoney(S.cash)}</td></tr>
          <tr><td>🏢 부동산 (토지+건물 ${S.branches.length}개, 매년 재평가)</td><td>${fmtMoney(re)}</td></tr>
          <tr><td>🏦 대출 잔액</td><td class="neg">-${fmtMoney(S.loan)}</td></tr>
          ${S.unpaid ? `<tr><td>⚠️ 미납 이자</td><td class="neg">-${fmtMoney(S.unpaid)}</td></tr>` : ''}
          <tr class="tot"><td>회사 순자산 (자산 − 빚)</td><td>${fmtMoney(equity)}</td></tr>
          ${S.stake ? `<tr><td>🇸🇬 투자사 지분 ${Math.round(S.stake * 100)}% 제외 → 대표 몫</td><td>${fmtMoney(mine)}</td></tr>` : ''}
          ${home ? `<tr><td>🏠 한강뷰 신혼집 (개인 자산)</td><td>${fmtMoney(home)}</td></tr>` : ''}
          <tr><td>💸 CEO 개인 지출 누적 (결혼·휴가·병원 등)</td><td>${fmtMoney(S.ceoSpent || 0)}</td></tr>
        </table>
        <div class="rep-sec">👨‍👩‍👧 가족</div>
        <table class="as-tbl">
          <tr><td>💍 결혼</td><td>${S.married ? `기혼 · ${dateStr(S.married)} 결혼` : (S.divorces && S.divorces.length ? `이혼 ${S.divorces.length}회 · 현재 미혼` : '미혼')}</td></tr>
          <tr><td>👶 자녀</td><td>${S.kids ? `${S.kids}명 · 양육비 월 ${fmtMoney(S.kids * CHILD_COST)}` : '없음'}</td></tr>
          ${S.married ? `<tr><td>🎁 가족 이벤트 (기념일·여행·리마인드 웨딩·유학)</td><td>챙김 ${(S.famDone || []).length} · <span class="${(S.famSkip || []).length >= 2 ? 'neg' : ''}">소홀 ${(S.famSkip || []).length}/3</span></td></tr>` : ''}
          ${S.datedIdol ? `<tr><td>💘 아이돌과의 데이트</td><td class="neg">${S.scandalDone ? '보도됨' : '비밀…'}</td></tr>` : ''}
          ${(S.divorces || []).map(d => `<tr><td>💔 ${d.why} (${dateStr(d.m)})</td><td class="neg">위자료 -${fmtMoney(d.amount)}</td></tr>`).join('')}
        </table>
        <div class="muted" style="margin-bottom:6px">보유 자산은 빚으로 산 건물도 포함한 금액이에요. 대출을 빼면 실제 내 몫은 "회사 순자산"이에요<br>자산 마일스톤(1,000억·3,000억·5,000억)은 보유 자산 기준이에요</div>
        <div class="rep-sec">보유 건물 · 총 ${rooms}실 (입주 ${occ}명)</div>${brs}`,
      buttons: [{ label: '닫기' }] });
  },

  showGoals() {
    if (!Sim.S || this.title) return;
    const S = Sim.S;
    this.modal({ icon: '🎯', title: `STAGE ${S.stage} 목표`, sub: STAGES[S.stage - 1].area + ' · ' + STAGES[S.stage - 1].title, body: this.goalsHtml(Sim.goalState()) + `<div class="muted" style="margin-top:8px">최종 목표: 서울 10개 지점 · 브랜드 레벨 10 · 업계 1위</div>`, buttons: [{ label: '닫기' }] });
  },
  // 🏆 업계 랭킹 · 브랜드 · 지점 목록 (탭에서 옮겨온 내용)
  showRank() {
    if (!Sim.S || this.title) return;
    const S = Sim.S; const r = Sim.rank(); const cr = Sim.ceoRank(); const lv = Sim.lvl();
    const rb = S.rankBest || { brand: 6, ceo: 6 };
    const rw = k => `<div class="rank-rw">${[4, 3, 2, 1].map(t => `<span class="${rb[k] <= t ? 'got' : ''}">${t}위 ${fmtMoney(RANK_REWARDS[t])}${rb[k] <= t ? ' ✓' : ''}</span>`).join('')}</div>`;
    const brs = S.branches.map((b, i) => `<div class="br-item ${i === S.sel ? 'cur' : ''}" data-br="${i}"><span class="nm">${esc(b.name)}</span><span>${b.status === 'build' ? '🏗 공사중' : `${Math.round(Sim.occ(b) / Sim.rooms(b) * 100)}% · 😊${Math.round(b.sat)}`}</span><span class="${b.last && b.last.profit >= 0 ? 'pos' : 'neg'}">${b.last ? fmtMoney(b.last.profit, true) : '-'}</span></div>`).join('') || '<div class="muted">아직 없어요</div>';
    this.modal({ wide: true, icon: '🏆', title: '업계 랭킹 · 브랜드', sub: `${esc(S.brand)} 브랜드 ${r.me}위 · 대표 자산 ${cr.me}위`,
      body: `<div class="rep-sec">⭐ 브랜드 레벨 ${lv} · ${BRAND_NAMES[lv]}</div>
        <div class="bar big"><i style="width:${Sim.lvlProgress() * 100}%;background:var(--yellow)"></i></div>
        <div class="muted" style="margin:4px 0 6px">${lv < 10 ? `다음 레벨까지 ${Math.ceil(BRAND_XP[lv] - S.brandXP)}pt` : '최고 레벨!'} · ${BRAND_PERKS.filter(p => p.lv > lv).slice(0, 1).map(p => `Lv.${p.lv}: ${p.text}`).join('')}</div>
        <div class="rep-sec">🏢 브랜드 순위 <small class="muted">자산가치 · 브랜드 · 만족도</small></div>${rw('brand')}
        ${r.list.map((x, i) => `<div class="rank-row ${x.me ? 'me' : ''}"><span class="no">${i + 1}</span><span class="nm">${esc(x.name)}<small>자산 ${fmtMoney(x.asset * 10000)} · Lv.${x.lv}</small></span><span>${x.score}</span></div>`).join('')}
        <div class="rep-sec">💎 대표 순자산 순위</div>${rw('ceo')}
        ${cr.list.map((x, i) => `<div class="rank-row ${x.me ? 'me' : ''}"><span class="no">${i + 1}</span><span class="nm">${esc(x.name)}<small>${esc(x.brand)}</small></span><span>${fmtMoney(x.nw * 10000)}</span></div>`).join('')}
        <div class="rep-sec">📍 내 지점 <small class="muted">누르면 그 지점으로 이동</small></div>${brs}`,
      buttons: [{ label: '닫기' }] });
    document.querySelectorAll('#modal [data-br]').forEach(el => el.onclick = () => { S.sel = +el.dataset.br; this.mq = []; this.modalOn = false; this.nextModal(); this.renderPanel(); this.updHud(true); });
  },
  showMenu() {
    if (!Sim.S || this.title) return;
    const S = Sim.S;
    this.modal({ icon: '📋', title: `CEO ${esc(S.ceo)}`, sub: `${esc(S.brand)} · ${elapsedStr(S.month)}`,
      body: `<div class="row"><span class="k">CEO 피로도</span><span class="v ${(S.fatigue || 0) >= 70 ? "neg" : ""}">${Math.round(S.fatigue || 0)} / 100</span></div><div class="row"><span class="k">가족</span><span class="v">${S.married ? "기혼" : "미혼"}${S.kids ? " · 자녀 " + S.kids + "명" : ""}</span></div><div class="row"><span class="k">CEO 개인 지출 누적</span><span class="v">${fmtMoney(S.ceoSpent || 0)}</span></div><div class="row"><span class="k">가문</span><span class="v">${Sim.fam().name}</span></div><div class="row"><span class="k">특수능력</span><span class="v">${Sim.fam().skill} · ${Sim.fam().eff}</span></div><div class="row"><span class="k">지점 수</span><span class="v">${S.branches.length}</span></div><div class="row"><span class="k">브랜드</span><span class="v">Lv.${Sim.lvl()} ${BRAND_NAMES[Sim.lvl()]}</span></div><div class="muted" style="margin-top:6px">진행 상황은 매달 자동 저장돼요</div>`,
      buttons: [{ label: '🧳 휴가 가기 (피로도 ' + Math.round(S.fatigue || 0) + ')', cls: 'y', on: () => this.vacation(false) }, { label: '저장하고 타이틀로', on: () => { this.save(); this.showTitle(); } }, { label: S.showReport === false ? '월 결산 팝업 켜기' : '월 결산 팝업 끄기', cls: 'ghost', on: () => { S.showReport = S.showReport === false; this.toast(S.showReport ? '📅 월 결산 팝업 ON' : '📅 월 결산은 알림으로만 표시'); this.save(); } }, { label: '도움말', cls: 'ghost', on: () => this.help() }, { label: '새 게임 (데이터 삭제)', cls: 'r', on: () => this.modal({ icon: '⚠️', title: '정말 처음부터 시작할까요?', body: '저장 데이터가 삭제돼요', buttons: [{ label: '삭제하고 새 게임', cls: 'r', on: () => { localStorage.removeItem(SAVE_KEY); this.showTitle(); } }, { label: '취소', cls: 'ghost' }] }) }, { label: '닫기', cls: 'ghost' }] });
  },
  help() {
    this.modal({ icon: '❓', title: '플레이 가이드', body: `<b>게임 루프</b><br>토지 선택 → 개발 → 입주자 모집 → 운영 → 수익 → 브랜드 성장 → 다음 지역<br><br>
      <b>입주 퍼널</b><br>문의 → 투어 50% → 지원 50% → 계약 50% → 입주 80%<br>마케팅 채널·예산이 문의를, 세일즈 매니저와 브랜드가 전환율을 올려요<br><br>
      <b>만족도</b><br>청소·시설·커뮤니티 예산, 직원, 이벤트, 입주민 선호 충족으로 올라가요. 월세를 올리면 떨어져요<br><br>
      <b>건물 정보</b><br>공실 리스크·민원·유지비·재계약률·브랜드 적합도는 운영하며 공개되거나, 부지 선정 때 실사로 미리 볼 수 있어요<br><br>
      <b>시간</b><br>달력 바가 한 번 차면 한 달. 일시정지와 x1/x2/x4 배속을 쓸 수 있어요`, buttons: [{ label: '닫기' }] });
  },

  save() { try { if (Sim.S && !this.title && !Sim.S.over) localStorage.setItem(SAVE_KEY, JSON.stringify(Sim.S)); } catch (e) {} },
};

window.addEventListener('load', () => UI.init());

</script>
</body>
</html>
